<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3737FF" id="themeColor">
<meta name="description" content="Audioguía interactiva del Paradox Museum Barcelona: el recorrido exhibición por exhibición, en castellano, català y English.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paradox">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Paradox Audioguía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
/* Black ground so all five brand colours keep their punch (the brand book's
   own black page proves it); flat colour blocks, hard edges, no gradients and
   no rounded bubbles — corporate, not a kids' app. */
:root{
  --blue:#3737FF; --mint:#00FFB9; --yellow:#FFDB00; --magenta:#FB48C4;
  --orange:#FF4C2A; --grey:#D2D3D4; --black:#000000; --white:#FFFFFF;
  --bg:#3737FF; --panel2:#2A2ADB; --line:#ffffff33;
  --fg:#fff; --muted:#ffffffab;
  --acc:#FFDB00; --accink:#14141c;   /* amarillo protagonista */
  color-scheme:dark;
  --f-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  position:relative;background:var(--bg);overflow:hidden}
@media (min-width:600px){#app{border-inline:1px solid var(--line)}}
.lbl{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase}

header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:9px;z-index:5}
.top{display:flex;align-items:center;gap:12px}
.top img{height:25px;width:auto;display:block}
.langs{display:flex;gap:2px;border:1px solid var(--line);padding:2px;margin-left:auto}
.langs button{padding:5px 9px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.1em;color:var(--muted);transition:.12s}
.langs button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.tabs{display:flex;gap:22px}
.tabs button{padding:0 0 9px;font-size:13px;font-weight:700;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--acc)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 26px max(16px,env(safe-area-inset-right,0px))}

.progress{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.bar{flex:1;height:3px;background:#ffffff1a;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.progress span{color:var(--muted);font-variant-numeric:tabular-nums}
.progress button{color:var(--muted)}
.progress button:hover{color:var(--orange)}

.sechead{display:flex;align-items:center;gap:9px;padding:24px 0 6px;position:sticky;top:0;
  background:linear-gradient(var(--bg) 76%,transparent);z-index:2}
.sechead b{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 8px}
.sechead i{flex:1;height:1px;background:var(--line)}
.sechead em{color:var(--muted);font-style:normal}

.stop{display:flex;gap:12px;align-items:center;width:100%;padding:9px 0;
  border-bottom:1px solid var(--line)}
.thumb{flex:0 0 auto;width:56px;height:56px;overflow:hidden;background:var(--panel2)}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.stop .meta{flex:1;min-width:0}
.stop .meta b{display:block;font-size:14.5px;font-weight:700;line-height:1.25;
  letter-spacing:-.01em}
.stop .meta span{display:block;font-size:11px;color:var(--muted);margin-top:4px;
  font-family:var(--f-mono);letter-spacing:.06em}
.num{flex:0 0 auto;min-width:26px;height:21px;padding:0 6px;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;font-weight:600;color:#06261f;background:var(--mint)}
.tick{flex:0 0 auto;width:19px;height:19px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:transparent;transition:.12s}
.stop.done .tick{border-color:var(--acc);color:var(--accink);background:var(--acc)}
.stop.done .meta b{color:var(--muted)}

.roomcard{display:block;width:100%;border:1px solid var(--line);padding:15px 16px;margin-top:9px}
.roomcard b{display:inline-block;font-size:14px;font-weight:800;letter-spacing:-.01em;
  padding:4px 9px}
.roomcard span{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.roomcard .pips{display:flex;gap:3px;flex-wrap:wrap;margin-top:11px}
.roomcard .pips i{width:14px;height:4px}

#detail{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;
  flex-direction:column;transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);padding-top:env(safe-area-inset-top,0px)}
#detail.open{transform:none}
.dtop{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:11px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.dtop .back{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
  color:var(--muted)}
.dtop .count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.dbody{flex:1;overflow-y:auto;overscroll-behavior:contain}

.hero{position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden}
.hero svg,.hero img{width:100%;height:100%;display:block;object-fit:cover}
.hero .tag{position:absolute;left:0;bottom:0;background:#0b0b2bd9;padding:6px 10px;color:#fff}
.dtext{padding:20px max(16px,env(safe-area-inset-left,0px)) 10px}
.droom{display:inline-block;padding:4px 9px}
.dtext h1{margin:12px 0 0;font-size:27px;font-weight:800;line-height:1.08;
  letter-spacing:-.025em;text-wrap:balance;color:var(--acc)}
.dtext h1 .hn{font-family:var(--f-mono);font-size:19px;font-weight:600;
  color:#ffffff8f;margin-right:9px;letter-spacing:0}

.block{padding:0 max(16px,env(safe-area-inset-left,0px));margin-top:26px}
.block > .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:10px}
.block > .lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.lead{margin:0;font-size:16px;line-height:1.6;max-width:62ch}
.lead + .lead{margin-top:15px}
.hook{margin:0;font-size:19px;line-height:1.42;font-weight:700;letter-spacing:-.015em;
  max-width:46ch;color:var(--fg)}
.sub{margin:10px 0 0;font-size:13.5px;line-height:1.6;color:var(--grey);max-width:62ch}

.gal{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.gal img{flex:0 0 auto;height:190px;width:auto;max-width:none;display:block;
  border:1px solid var(--line)}
.howrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.howcard{flex:0 0 150px}
.howcard .ph{aspect-ratio:3/4;background:var(--panel2);border:1px solid var(--line);
  position:relative;overflow:hidden}
.howcard .ph svg,.howcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.howcard .ph em{position:absolute;inset:auto 0 0 0;background:#0b0b2bd9;padding:4px 6px;
  font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;text-align:center}
.howcard b{display:block;margin-top:8px;font-size:12.5px;font-weight:700;line-height:1.35}
.howcard span{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);line-height:1.4}
.howstep{position:absolute;top:6px;left:6px;width:22px;height:22px;background:var(--acc);
  color:var(--accink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;
  font-weight:700;line-height:1;z-index:2}

.quiz{background:#ffffff1f;padding:18px 16px;margin:0 max(16px,env(safe-area-inset-left,0px))}
.quiz .lbl{color:var(--yellow)}
.quiz p{margin:9px 0 0;font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.quiz .reveal{margin-top:14px;background:var(--yellow);color:#000;padding:11px 14px;
  width:100%;font-size:13.5px;font-weight:800;text-align:center}
.quiz .ans{margin:13px 0 0;font-size:14.5px;line-height:1.55;color:#fff;font-weight:400}
.quiz .ans b{color:var(--mint)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);padding:6px 9px;font-size:11.5px;color:var(--grey)}
.pending{border:1px dashed var(--line);padding:13px 14px;font-size:12.5px;color:var(--muted);
  line-height:1.5}

.dfoot{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:10px max(16px,env(safe-area-inset-left,0px));
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--bg)}
.nextrow{display:flex;gap:8px}
.nextrow .prev{flex:0 0 52px;height:54px;border:1px solid var(--line);display:grid;
  place-items:center;font-size:18px;color:var(--grey)}
.nextrow .prev:disabled{opacity:.25;cursor:default}
.nextrow .next{flex:1;height:54px;background:var(--acc);color:var(--accink);display:flex;
  align-items:center;justify-content:space-between;padding:0 16px;font-size:15px;
  font-weight:800;letter-spacing:-.01em;min-width:0}
.nextrow .next:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.nextrow .next i{font-style:normal;font-size:19px;flex:0 0 auto;padding-left:10px}
.nextrow .next span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seenbtn{height:40px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--grey)}
.seenbtn[data-on="1"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}

#gate{position:absolute;inset:0;z-index:40;background:var(--blue);display:flex;
  flex-direction:column;overflow-y:auto;padding:0 max(22px,env(safe-area-inset-left,0px))}
#gate.hide{display:none}
#gate .inner{margin:auto 0;padding:34px 0}
#gate img{width:min(270px,72%);height:auto;display:block}
#gate h1{margin:30px 0 0;font-size:41px;font-weight:800;line-height:.98;
  letter-spacing:-.035em;color:var(--acc)}
#gate h1 em{font-style:normal;color:#fff}
#gate p{margin:16px 0 0;font-size:14.5px;line-height:1.55;color:#fff;max-width:32ch}
#gate .pick{margin-top:30px;color:#ffffffb3}
#gate .opts{display:flex;flex-direction:column;gap:7px;margin-top:11px}
#gate .opts button{display:flex;align-items:center;gap:12px;background:#ffffff14;
  border:1px solid #ffffff38;padding:15px 16px;font-size:15.5px;font-weight:700}
#gate .opts button u{text-decoration:none;margin-left:auto;font-family:var(--f-mono);
  font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--acc)}
#gate .opts button:hover{background:var(--acc);border-color:var(--acc);color:var(--accink)}
#gate .opts button:hover u{color:#000}
#gate .foot{margin-top:24px;color:#ffffff80}

.styleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.styleGrid button{border:1px solid var(--line);padding:0;overflow:hidden}
.styleGrid button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.styleGrid .sv{display:block;aspect-ratio:1/1;background:var(--panel2)}
.styleGrid .sv svg{width:100%;height:100%;display:block}
.styleGrid b{display:block;padding:8px 8px 0;font-size:11.5px;font-weight:700}
.styleGrid span{display:block;padding:4px 8px 9px;font-size:10.5px;color:var(--muted);
  line-height:1.35}
.note{margin-top:16px;border-left:2px solid var(--yellow);padding:2px 0 2px 12px;
  font-size:12.5px;color:var(--grey);line-height:1.55}


/* visor de fotos a pantalla completa */
.hero,.gal img,.howcard .ph{cursor:zoom-in}
#lightbox{position:fixed;inset:0;z-index:60;background:#070722f2;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  padding:max(16px,env(safe-area-inset-left,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(3px)}
#lightbox img{grid-column:2;max-width:100%;max-height:82vh;width:auto;height:auto;
  margin:0 auto;display:block;object-fit:contain}
#lightbox button{width:44px;height:44px;display:grid;place-items:center;font-size:19px;
  color:#fff;background:#ffffff1c;border:1px solid #ffffff38}
#lightbox button:disabled{opacity:.25}
#lbClose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
  right:calc(14px + env(safe-area-inset-right,0px));z-index:2}
#lbCount{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  text-align:center;color:#ffffffa8}
@media (max-width:520px){
  #lightbox{grid-template-columns:1fr}
  #lbPrev,#lbNext{position:absolute;bottom:calc(44px + env(safe-area-inset-bottom,0px))}
  #lbPrev{left:calc(16px + env(safe-area-inset-left,0px))}
  #lbNext{right:calc(16px + env(safe-area-inset-right,0px))}
  #lightbox img{grid-column:1}
}

@media (prefers-reduced-motion:reduce){#detail{transition:none}.bar i{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <img id="logo" alt="Paradox Museum">
      <div class="langs" id="langs" role="group" aria-label="Idioma">
        <button data-l="es" aria-pressed="true">ES</button>
        <button data-l="ca" aria-pressed="false">CA</button>
        <button data-l="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="route" role="tab" aria-selected="true" id="tabRoute">Recorrido</button>
      <button data-tab="rooms" role="tab" aria-selected="false" id="tabRooms">Salas</button>
      <button data-tab="style" role="tab" aria-selected="false" id="tabStyle">Estilo</button>
    </div>
  </header>

  <main id="main"></main>

  <section id="detail" aria-hidden="true">
    <div class="dtop">
      <button class="back" id="back">← <span id="backTxt">Recorrido</span></button>
      <span class="count lbl" id="dcount"></span>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="dfoot">
      <button class="seenbtn" id="done"></button>
      <div class="nextrow">
        <button class="prev" id="prev" aria-label="Anterior">←</button>
        <button class="next" id="next"><span id="nextTxt"></span><i>→</i></button>
      </div>
    </div>
  </section>

  <section id="gate">
    <div class="inner">
      <img id="gateLogo" alt="Paradox Museum">
      <h1>¡Bienvenidos!<br><em>Benvinguts!</em><br>Welcome!</h1>
      <p>Aquí dentro nada es lo que parece. Esta guía te acompaña exhibición
         por exhibición y te cuenta cómo sacarles partido.</p>
      <div class="lbl pick">Elige idioma · Tria idioma · Choose language</div>
      <div class="opts">
        <button data-l="es">Español <u>ES</u></button>
        <button data-l="ca">Català <u>CA</u></button>
        <button data-l="en">English <u>EN</u></button>
      </div>
      <div class="lbl foot">Paradox Museum Barcelona</div>
    </div>
  </section>

  <div id="lightbox" hidden aria-modal="true" role="dialog">
    <button id="lbClose" aria-label="Cerrar">✕</button>
    <button id="lbPrev" aria-label="Anterior">←</button>
    <img id="lbImg" alt="">
    <button id="lbNext" aria-label="Siguiente">→</button>
    <div id="lbCount" class="lbl"></div>
  </div>
</div>

<script>
const LOGO="img/logo.png";
document.getElementById("logo").src=LOGO;
document.getElementById("gateLogo").src=LOGO;

const UI={
 es:{route:"Recorrido",rooms:"Salas",style:"Estilo",of:"de",

const C={blue:"#3737FF",mint:"#00FFB9",yellow:"#FFDB00",magenta:"#FB48C4",
         orange:"#FF4C2A",white:"#FFFFFF"};
const ROOMS={
 entrada:{c:"#FFFFFF",ink:"#14141c",tc:"#FFFFFF",  n:{es:"Entrada",ca:"Entrada",en:"Entrance"}},
 tienda:{c:"#FFDB00",ink:"#14141c",tc:"#FFDB00", n:{es:"Paradox Boutique",ca:"Paradox Boutique",en:"Paradox Boutique"}},
 s3:{c:"#00FFB9",ink:"#06261f",tc:"#00FFB9",   n:{es:"Sala 3 · Green Room",ca:"Sala 3 · Green Room",en:"Room 3 · Green Room"}},
 s2:{c:"#FB48C4",ink:"#2a0820",tc:"#FFFFFF",n:{es:"Sala 2 · Eixample",ca:"Sala 2 · Eixample",en:"Room 2 · Eixample"}},
 s4:{c:"#FFDB00",ink:"#14141c",tc:"#FFDB00", n:{es:"Sala 4 · Dodecaedro",ca:"Sala 4 · Dodecàedre",en:"Room 4 · Dodecahedron"}},

const S=[
{n:"",r:"entrada",t:"Bienvenido · Benvingut · Welcome",art:"welcome",
 hook:{es:"Tus ojos están a punto de mentirte más de cincuenta veces seguidas. Lo van a hacer muy bien.",
       ca:"Els teus ulls estan a punt de mentir-te més de cinquanta vegades seguides. Ho faran molt bé.",
       en:"Your eyes are about to lie to you more than fifty times in a row. They will do it beautifully."},
 d:{es:"Sigue el recorrido parada a parada: cada número del suelo y de la pared se corresponde con una ficha de esta guía. Puedes ir en orden o saltar por salas.",
    ca:"Segueix el recorregut parada a parada: cada número del terra i de la paret es correspon amb una fitxa d'aquesta guia. Pots anar en ordre o saltar per sales.",
    en:"Follow the tour stop by stop: every number on the floor and the walls matches a card here. Go in order or jump around by room."},
 how:[{t:{es:"Carga la batería",ca:"Carrega la bateria",en:"Charge up"},
       s:{es:"Vas a hacer más fotos de las que crees.",ca:"Faràs més fotos de les que creus.",en:"You will take more photos than you expect."}},
      {t:{es:"Ve acompañado",ca:"Vés acompanyat",en:"Bring someone"},
       s:{es:"La mitad de las piezas necesitan a alguien al otro lado.",ca:"La meitat de les peces necessiten algú a l'altre costat.",en:"Half the pieces need someone on the other side."}}],
 quiz:{q:{es:"¿Cuánto se tarda en hacer el recorrido entero?",
          ca:"Quant es triga a fer el recorregut sencer?",
          en:"How long does the whole tour take?"},
       a:{es:"Sin prisa, alrededor de <b>90 minutos</b>. Son más de cincuenta piezas repartidas en <b>dos plantas y siete salas</b>, y casi todas piden que te pares a probarlas.",
          ca:"Sense pressa, al voltant de <b>90 minuts</b>. Són més de cinquanta peces repartides en <b>dues plantes i set sales</b>, i gairebé totes demanen que t'hi paris a provar-les.",
          en:"Unhurried, about <b>90 minutes</b>. There are more than fifty pieces across <b>two floors and seven rooms</b>, and nearly all of them ask you to stop and try them."}}},

{n:"52",r:"tienda",t:"Paradox Challenge",art:"balloon",
 hook:{es:"Parece que lo podrías apartar de un manotazo. Prueba a calcular dónde está exactamente: no vas a poder.",
       ca:"Sembla que el podries apartar d'una manotada. Prova de calcular on és exactament: no podràs.",
       en:"It looks like one swat would move it. Try working out exactly where it is: you cannot."},
 d:{es:"Sin referencias de tamaño alrededor, el cerebro no tiene con qué comparar. Usa la distancia para estimar el tamaño y el tamaño para estimar la distancia, y aquí las dos pistas se contradicen.",
    ca:"Sense referències de mida al voltant, el cervell no té amb què comparar. Fa servir la distància per estimar la mida i la mida per estimar la distància, i aquí les dues pistes es contradiuen.",
    en:"With no size cues around it, your brain has nothing to compare against. It uses distance to judge size and size to judge distance, and here the two cues contradict each other."},
 how:[{t:{es:"Ponte en la marca",ca:"Posa't a la marca",en:"Stand on the mark"},
       s:{es:"El punto del suelo es el único sitio donde cuadra.",ca:"El punt del terra és l'únic lloc on quadra.",en:"The floor marker is the only spot where it lines up."}},
      {t:{es:"Mano extendida",ca:"Mà estesa",en:"Hand out front"},
       s:{es:"Estira el brazo del todo hacia la cámara.",ca:"Estira el braç del tot cap a la càmera.",en:"Reach your arm fully toward the camera."}},
      {t:{es:"Cámara baja",ca:"Càmera baixa",en:"Camera low"},
       s:{es:"A la altura del pecho exagera el efecto.",ca:"A l'alçada del pit exagera l'efecte.",en:"Chest height exaggerates the effect."}}],
 quiz:{q:{es:"¿Qué pista engaña a tu cerebro: el tamaño o la distancia?",
          ca:"Quina pista enganya el teu cervell: la mida o la distància?",
          en:"Which cue fools your brain: size or distance?"},
       a:{es:"<b>Las dos a la vez.</b> El cerebro las usa en bucle, cada una para deducir la otra. Si le quitas los puntos de referencia, el bucle se queda sin suelo y acepta cualquier respuesta.",
          ca:"<b>Totes dues alhora.</b> El cervell les fa servir en bucle, cadascuna per deduir l'altra. Si li treus els punts de referència, el bucle es queda sense terra i accepta qualsevol resposta.",
          en:"<b>Both at once.</b> Your brain runs them in a loop, each one deducing the other. Remove the reference points and the loop has nothing to stand on, so it accepts any answer."}}},

{n:"",r:"s3",t:"Escape",art:"ring"},
{n:"02",r:"s3",t:"Cylinder PDX",art:"cyl",
 d:{es:"Un cilindro espejado en el centro de un dibujo deformado. Visto desde arriba el reflejo recompone la imagen: la deformación del papel y la curva del espejo se anulan entre sí.",
    ca:"Un cilindre mirallat al centre d'un dibuix deformat. Vist des de dalt el reflex recompon la imatge: la deformació del paper i la corba del mirall s'anul·len entre si.",
    en:"A mirrored cylinder at the centre of a distorted drawing. Seen from above the reflection rebuilds the image: the warped paper and the curved mirror cancel out."}},
{n:"03",r:"s3",t:"Paradox Rings",art:"ring",
 d:{es:"Dos aros que parecen atravesarse sin tocarse. El cerebro insiste en leerlos como objetos sólidos aunque la geometría que ve sea imposible.",
    ca:"Dos cèrcols que semblen travessar-se sense tocar-se. El cervell insisteix a llegir-los com a objectes sòlids encara que la geometria sigui impossible.",
    en:"Two rings that seem to pass through each other without touching. Your brain insists on reading them as solid objects even though the geometry is impossible."}},
{n:"",r:"s3",t:"Switch 10",art:"grid"},
{n:"04",r:"s3",t:"Moire Animation",art:"moire",
 d:{es:"Una lámina de rayas se desliza sobre un dibujo y lo pone en movimiento. No hay motor ni pantalla: es el efecto moiré, la interferencia entre dos patrones de líneas casi iguales.",
    ca:"Una làmina de ratlles llisca sobre un dibuix i el posa en moviment. No hi ha motor ni pantalla: és l'efecte moiré, la interferència entre dos patrons de línies gairebé iguals.",
    en:"A striped sheet slides over a drawing and sets it moving. No motor, no screen: the moiré effect, interference between two nearly identical line patterns."}},
{n:"05",r:"s3",t:"PDX Stick",art:"stick"},
{n:"06",r:"s3",t:"Shadow Freeze",art:"shadow",
 hook:{es:"Tienes tres segundos para elegir qué postura se va a quedar pegada a la pared. Elige bien.",
       ca:"Tens tres segons per triar quina postura es quedarà enganxada a la paret. Tria bé.",
       en:"You get three seconds to pick the pose that will stay stuck on the wall. Choose well."},
 d:{es:"Un flash potente sobre una pared fosforescente deja tu sombra congelada unos segundos. La pared sigue brillando donde le llegó la luz y se queda oscura justo donde estabas tú.",
    ca:"Un flaix potent sobre una paret fosforescent deixa la teva ombra congelada uns segons. La paret continua brillant on li va arribar la llum i es queda fosca just on eres tu.",
    en:"A bright flash against a phosphorescent wall freezes your shadow. The wall keeps glowing where the light hit it and stays dark exactly where you stood."},
 how:[{t:{es:"Pégate a la pared",ca:"Enganxa't a la paret",en:"Get close"},
       s:{es:"Cuanto más cerca, más nítido el contorno.",ca:"Com més a prop, més nítid el contorn.",en:"The closer you are, the sharper the outline."}},
      {t:{es:"Postura exagerada",ca:"Postura exagerada",en:"Go big"},
       s:{es:"Brazos y piernas abiertos se leen mucho mejor.",ca:"Braços i cames oberts es llegeixen molt millor.",en:"Arms and legs out read far better."}},
      {t:{es:"No te muevas",ca:"No et moguis",en:"Freeze"},
       s:{es:"Si te mueves en el flash, la sombra sale borrosa.",ca:"Si et mous en el flaix, l'ombra surt borrosa.",en:"Move during the flash and the shadow smears."}}],
 quiz:{q:{es:"La pared brilla. ¿Por qué tu silueta sale oscura y no al revés?",
          ca:"La paret brilla. Per què la teva silueta surt fosca i no a l'inrevés?",
          en:"The wall glows. Why does your silhouette come out dark instead of bright?"},
       a:{es:"Porque la pintura <b>guarda la luz que recibe</b> y la suelta poco a poco. Tú hiciste de paraguas: donde estabas no llegó nada de flash, así que esa zona no tiene nada que soltar.",
          ca:"Perquè la pintura <b>guarda la llum que rep</b> i la deixa anar a poc a poc. Tu vas fer de paraigua: on eres no hi va arribar gens de flaix, així que aquella zona no té res a deixar anar.",
          en:"Because the paint <b>stores the light it receives</b> and releases it slowly. You acted as an umbrella: no flash reached the wall behind you, so that patch has nothing to release."}}},

{n:"07",r:"s2",t:"Moire Animation",art:"moire"},
{n:"08",r:"s2",t:"Moire Animation",art:"moire"},
{n:"09",r:"s2",t:"Moire Animation",art:"moire"},
{n:"10",r:"s2",t:"Stroop Effect",art:"stroop",
 hook:{es:"Di el color de la tinta, no la palabra. Suena facilísimo. Vas a tropezar en la tercera.",
       ca:"Digues el color de la tinta, no la paraula. Sona facilíssim. Ensopegaràs a la tercera.",
       en:"Say the ink colour, not the word. Sounds trivial. You will stumble on the third one."},
 d:{es:"Leer es automático: llevas años haciéndolo sin decidirlo. Para decir el color tienes que frenar la lectura a propósito, y ese freno cuesta unas décimas de segundo que se notan.",
    ca:"Llegir és automàtic: fa anys que ho fas sense decidir-ho. Per dir el color has de frenar la lectura expressament, i aquest fre costa unes dècimes de segon que es noten.",
    en:"Reading is automatic: you have done it for years without choosing to. Naming the colour means overriding that on purpose, and the override costs a few tenths of a second you can feel."},
 how:[{t:{es:"Cronométrate",ca:"Cronometra't",en:"Time yourself"},
       s:{es:"Primero leyendo palabras, luego diciendo colores.",ca:"Primer llegint paraules, després dient colors.",en:"First read the words, then name the colours."}},
      {t:{es:"Reta a alguien",ca:"Repta algú",en:"Race someone"},
       s:{es:"Se nota mucho más cuando hay prisa.",ca:"Es nota molt més quan hi ha pressa.",en:"The effect is far louder under pressure."}}],
 quiz:{q:{es:"¿Le pasaría lo mismo a alguien que no sabe leer?",
          ca:"Li passaria el mateix a algú que no sap llegir?",
          en:"Would someone who cannot read have the same problem?"},
       a:{es:"<b>No.</b> Sin lectura automática no hay nada que frenar, así que dicen el color igual de rápido en los dos casos. El efecto aparece justo cuando aprendes a leer con soltura: es el precio de hacerlo sin esfuerzo.",
          ca:"<b>No.</b> Sense lectura automàtica no hi ha res a frenar, així que diuen el color igual de ràpid en tots dos casos. L'efecte apareix just quan aprens a llegir amb soltesa: és el preu de fer-ho sense esforç.",
          en:"<b>No.</b> With no automatic reading there is nothing to override, so they name the colour just as fast either way. The effect appears exactly when you become a fluent reader — it is the price of doing it effortlessly."}}},

{n:"11",r:"s4",t:"Infinity Dodecahedron",art:"dodeca",

    en:"A twelve-sided solid lined inside with mirrors and lights. Each face reflects the others and the room seems to carry on without end."}},

{n:"14",r:"s4",t:"Digital Form",art:"grid",
 d:{es:"Una superficie de piezas móviles que copia el relieve de lo que apoyes. Tu mano desaparece y vuelve convertida en un volumen de píxeles.",
    ca:"Una superfície de peces mòbils que copia el relleu del que hi recolzis. La teva mà desapareix i torna convertida en un volum de píxels.",
    en:"A surface of sliding pins that copies the relief of whatever you press into it. Your hand vanishes and returns as a volume made of pixels."}},

    ca:"Un pont sobre un buit que no existeix. Els miralls del terra i del sostre multipliquen els llums cap amunt i cap avall.",

{n:"17",r:"zg",t:"Zero Gravity",art:"gravity",
 d:{es:"La sala inclinada. El suelo está en pendiente pero las referencias visuales dicen que está recto, así que tu equilibrio se pelea con tus ojos.",
    ca:"La sala inclinada. El terra està en pendent però les referències visuals diuen que és recte, així que el teu equilibri es baralla amb els teus ulls.",
    en:"The tilted room. The floor slopes but every visual cue says it is level, so your balance argues with your eyes."}},
{n:"18",r:"zg",t:"Out of the Box",art:"box"},
{n:"19",r:"zg",t:"Infinity Room",art:"infroom",
 hook:{es:"Entra solo. En cuanto se cierre la puerta vas a ser muchísima gente.",
       ca:"Entra-hi sol. Quan es tanqui la porta seràs moltíssima gent.",
       en:"Go in alone. The moment the door shuts you will be an awful lot of people."},
 d:{es:"Una habitación hexagonal forrada de espejos. No hay paredes visibles ni suelo ni techo: sólo tú, repetido hasta donde alcanza la vista.",
    ca:"Una habitació hexagonal folrada de miralls. No hi ha parets visibles ni terra ni sostre: només tu, repetit fins on arriba la vista.",
    en:"A hexagonal room lined with mirrors. No visible walls, floor or ceiling: just you, repeated as far as you can see."},
 how:[{t:{es:"De uno en uno",ca:"D'un en un",en:"One at a time"},
       s:{es:"Con dos personas se rompe la simetría.",ca:"Amb dues persones es trenca la simetria.",en:"Two people break the symmetry."}},
      {t:{es:"Apunta a una esquina",ca:"Apunta a un racó",en:"Aim at a corner"},
       s:{es:"Es donde más lejos llega el reflejo.",ca:"És on més lluny arriba el reflex.",en:"That is where the reflection runs deepest."}},
      {t:{es:"Sin flash",ca:"Sense flaix",en:"No flash"},
       s:{es:"El flash rebota y arruina la foto.",ca:"El flaix rebota i espatlla la foto.",en:"Flash bounces straight back and ruins the shot."}}],
 quiz:{q:{es:"¿Hasta dónde llegan de verdad los reflejos?",
          ca:"Fins on arriben de debò els reflexos?",
          en:"How far do the reflections actually go?"},
       a:{es:"No llegan al infinito. Cada espejo devuelve algo menos del <b>95 % de la luz</b>, así que cada rebote es más oscuro que el anterior y lo que ves acaba perdiéndose en negro tras unas cuantas decenas de copias.",
          ca:"No arriben a l'infinit. Cada mirall retorna una mica menys del <b>95 % de la llum</b>, així que cada rebot és més fosc que l'anterior i el que veus acaba perdent-se en negre després d'unes quantes desenes de còpies.",
          en:"Not to infinity. Each mirror returns a little under <b>95% of the light</b>, so every bounce is dimmer than the last and what you see fades to black after a few dozen copies."}}},
{n:"21",r:"zg",t:"Yes / No Paradox",art:"yesno"},
{n:"22",r:"zg",t:"Silent Cords",art:"cords"},
{n:"23",r:"zg",t:"Piano",art:"piano"},
{n:"24",r:"zg",t:"Muro de ilusiones ópticas",art:"wall",
 list:["Fraser Spiral","Müller-Lyer","Bulging Squares","Shepard's Boxes","Ehrenstein",
       "Leaf Wave","Scintillating Grid","Floating Circle","Warped Dotted Surface",
       "Café Wall","Jastrow","Gradient Stripe"],
 d:{es:"Doce ilusiones clásicas en una sola pared. Ninguna se mueve, ninguna está torcida y ninguna cambia de tamaño: todo lo que ves de más lo pone tu propio sistema visual.",
    ca:"Dotze il·lusions clàssiques en una sola paret. Cap no es mou, cap no està torta i cap no canvia de mida: tot el que hi veus de més ho hi posa el teu propi sistema visual.",
    en:"Twelve classic illusions on one wall. None move, none are crooked, none change size: everything extra you see is added by your own visual system."}},

{n:"25",r:"s6",t:"PDX Turn",sub:"×3",art:"turn"},
{n:"26",r:"s6",t:"Tilted Room",art:"tilt"},
{n:"27",r:"s6",t:"PDX Ball",art:"ball",
 d:{es:"Una bola que sube sola por un raíl. En realidad baja: el raíl está diseñado para que su punto más bajo parezca el más alto.",
    ca:"Una bola que puja sola per un rail. En realitat baixa: el rail està dissenyat perquè el seu punt més baix sembli el més alt.",
    en:"A ball that rolls uphill by itself. In fact it rolls down: the rail is built so its lowest point looks like its highest."}},
{n:"28",r:"s6",t:"Clone Table",art:"clone"},
{n:"29",r:"s6",t:"Symmetry Room",art:"sym"},
{n:"30",r:"s6",t:"Moving Picture",art:"moire"},
{n:"",r:"s6",t:"Impossible Triangle",art:"tri",
 d:{es:"El triángulo de Penrose: tres barras que no pueden unirse en el espacio real y sin embargo ahí están. Desde un único punto exacto el truco se cierra.",
    ca:"El triangle de Penrose: tres barres que no es poden unir a l'espai real i tanmateix hi són. Des d'un únic punt exacte el truc es tanca.",
    en:"The Penrose triangle: three bars that cannot meet in real space and yet there they are. From one exact viewpoint the trick closes up."}},
{n:"31",r:"s6",t:"Face Blender",art:"face"},
{n:"32",r:"s6",t:"Ames Room",art:"ames",
 hook:{es:"Uno de los dos va a salir el doble de alto que el otro. Y ninguno se mueve del suelo.",
       ca:"Un dels dos sortirà el doble d'alt que l'altre. I cap no es mou del terra.",
       en:"One of you comes out twice the height of the other. Neither of you leaves the floor."},
 d:{es:"Por la mirilla parece un cubo normal, pero es un trapecio: una esquina está mucho más lejos que la otra. El cerebro da por hecho que la habitación es rectangular y prefiere deformar a las personas antes que deformar la sala.",
    ca:"Pel forat sembla un cub normal, però és un trapezi: un racó és molt més lluny que l'altre. El cervell dona per fet que l'habitació és rectangular i prefereix deformar les persones abans que deformar la sala.",
    en:"Through the peephole it looks like an ordinary cube, but it is a trapezoid: one corner is far further away. Your brain assumes the room is rectangular and would rather distort the people than distort the room."},
 how:[{t:{es:"Uno en cada esquina",ca:"Un a cada racó",en:"One per corner"},
       s:{es:"Es el contraste lo que hace la foto.",ca:"És el contrast el que fa la foto.",en:"The contrast is what makes the shot."}},
      {t:{es:"Sólo por la mirilla",ca:"Només pel forat",en:"Peephole only"},
       s:{es:"Desde cualquier otro ángulo se ve el truco.",ca:"Des de qualsevol altre angle es veu el truc.",en:"From any other angle the trick is visible."}},
      {t:{es:"Intercambiaos",ca:"Intercanvieu-vos",en:"Swap over"},
       s:{es:"La segunda foto es la que convence.",ca:"La segona foto és la que convenç.",en:"The second photo is the convincing one."}}],
 quiz:{q:{es:"¿Por qué el cerebro deforma a la persona y no a la habitación?",
          ca:"Per què el cervell deforma la persona i no l'habitació?",
          en:"Why does your brain distort the person and not the room?"},
       a:{es:"Porque llevas toda la vida en habitaciones rectangulares y <b>ninguna en habitaciones trapezoidales</b>. Entre dos explicaciones posibles, el cerebro elige siempre la que ha visto un millón de veces, aunque eso le obligue a hacer gigante a tu amigo.",
          ca:"Perquè portes tota la vida en habitacions rectangulars i <b>cap en habitacions trapezoïdals</b>. Entre dues explicacions possibles, el cervell tria sempre la que ha vist un milió de vegades, encara que això l'obligui a fer gegant el teu amic.",
          en:"Because you have spent your whole life in rectangular rooms and <b>none at all in trapezoidal ones</b>. Given two possible explanations, your brain always picks the one it has seen a million times, even if that means turning your friend into a giant."}}},

{n:"34",r:"s7",t:"Infinity Well",art:"well"},
{n:"36",r:"s7",t:"Mirror",art:"mirror"},
{n:"37",r:"s7",t:"True Mirror",art:"mirror",
 d:{es:"Dos espejos en ángulo recto anulan la inversión. Por primera vez te ves como te ve el resto, y casi nadie se reconoce a la primera.",
    ca:"Dos miralls en angle recte anul·len la inversió. Per primera vegada et veus com et veu la resta, i gairebé ningú es reconeix a la primera.",
    en:"Two mirrors at right angles cancel the flip. For the first time you see yourself as everyone else does, and almost nobody recognises it at first."}},
{n:"38",r:"s7",t:"Upside Down Mirror",art:"mirror"},
{n:"39",r:"s7",t:"Camouflage Wall",art:"camo"},
{n:"41",r:"s7",t:"Colored Shadow Room",art:"shadowcol",
 d:{es:"Tres focos de colores distintos y una sola persona: tres sombras, y ninguna negra. Cada sombra tiene el color de la luz que esa sombra no bloquea.",
    ca:"Tres focus de colors diferents i una sola persona: tres ombres, i cap de negra. Cada ombra té el color de la llum que aquella ombra no bloqueja.",
    en:"Three differently coloured lamps and one person: three shadows, none of them black. Each takes the colour of the light that shadow does not block."}},
{n:"42",r:"s7",t:"PDX Sofa",art:"sofa"},
{n:"43",r:"s7",t:"PDX Table",art:"table"},

{n:"46",r:"s7",t:"PDX Spinner",art:"spin"},
{n:"47",r:"s7",t:"Beuchet Chair",art:"chair",
 hook:{es:"El asiento y las patas están a varios metros el uno del otro. Tú te vas a sentar igualmente.",
       ca:"El seient i les potes són a diversos metres l'un de l'altre. Tu t'hi asseuràs igualment.",
       en:"The seat and the legs are metres apart. You are going to sit on it anyway."},
 d:{es:"Son dos piezas separadas, pintadas del mismo color y colocadas a distancias distintas. Desde la marca del suelo se superponen y el cerebro las monta como una sola silla, así que encoge a quien se sienta para que encaje.",
    ca:"Són dues peces separades, pintades del mateix color i col·locades a distàncies diferents. Des de la marca del terra se superposen i el cervell les munta com una sola cadira, així que encongeix qui s'hi asseu perquè encaixi.",
    en:"Two separate pieces, painted the same colour and placed at different distances. From the floor marker they overlap and your brain assembles them into one chair, so it shrinks whoever sits down to make them fit."},
 how:[{t:{es:"Uno sentado, otro de pie",ca:"Un assegut, l'altre dret",en:"One sits, one stands"},

 "Ames Room": {
  "d": {
   "en": "Growing and shrinking in a room of distorted perspective may remind you of a scene from Lewis Carroll's Alice in Wonderland or in the Lord of the Rings trilogy, this trick is used to make the hobbits appear smaller than humans. The Ames room principle was widely used in TV and movie productions for special effects, to show actors in giant sizes next to actors in small sizes.\n\nIn the late 19th century, a gentleman named Hermann von Helmholtz had a great idea! What if a room could be distorted in some way but at the same time look like a completely normal rectangular room? In 1935, an ophthalmologist named Adelbert Ames had a similar idea and created the first-ever Ames room. Ames went beyond Helmholtz's concept and was the first to discover the impact of experience on perception.\n\nAnd so, the Ames room is built with both the floor and ceiling at an angle, which creates forced perspective and tricks the eye into thinking both sides of the room are the same. The actual shape of the room is a trapezium. This special shape is thought to remove all distance and not allow proper scaling of object size. The room creates the illusion of it being a dramatic disparity in size. The illusion leads the viewer to believe that the two people are in the same field of view when, in fact, the subject is much closer.\n\nIn the Paradox Ames Room exhibit, what is occurring is a mismatch between the physical stimuli and the perception of the individual. The mismatch is caused by an incorrect interpretation of information received by sensory organs. The moment light meets the retina, the process of seeing begins. The information from the retina - in the form of electrical signals - is sent via the optic nerve to other parts of the brain which process the image and allow us to see.\n\nWhat's kinda spookie is that the effect isn't always as obvious to those who are familiar with the person in the room; for example, a married couple may see less size distortion. This is called the Honi Phenomenon, named after a woman who observed both a stranger and her husband and observed a size distortion when it came to the stranger, but not when she observed her husband!",
   "es": "Crecer y encogerse en una habitación de perspectiva distorsionada puede recordarte a alguna escena de Alicia en el País de las Maravillas, de Lewis Carroll, o a una de la trilogía de El Señor de los Anillos, donde se utiliza este truco para hacer que los hobbits parezcan más pequeños que los humanos. El principio de la habitación de Ames se utilizó mucho en producciones televisivas y cinematográficas para efectos especiales, con el fin de mostrar actores de tallas gigantes junto a actores de tallas pequeñas.\n\nA finales del siglo XIX, un caballero llamado Hermann von Helmholtz tuvo una gran idea. ¿Qué pasaría si una habitación pudiera distorsionarse de alguna forma, pero al mismo tiempo parecer una habitación rectangular completamente normal? En 1935, un oftalmólogo llamado Adelbert Ames tuvo una idea similar y creó la primera sala Ames de la historia. Ames fue más allá del concepto de Helmholtz y fue el primero en descubrir el impacto de la experiencia en la percepción.\n\nAsí, la Habitación Ames está construida con el suelo y el techo en ángulo, lo que crea una perspectiva falsa y hace que el ojo piense que ambos lados de la habitación son iguales. La forma real de la sala es un trapecio. Se cree que esta forma especial elimina toda distancia y no permite ajustar correctamente el tamaño de los objetos. La habitación crea la ilusión de que su tamaño es muy dispar. La ilusión lleva al espectador a creer que las dos personas están en el mismo campo de visión cuando, en realidad, el sujeto está mucho más cerca.\n\nEn la Habitación Ames de Paradox, lo que se produce es un desajuste entre los estímulos físicos y la percepción del individuo. El desajuste se debe a una interpretación incorrecta de la información recibida por los órganos sensoriales. En el momento en que la luz entra en contacto con la retina, comienza el proceso de la visión. La información de la retina (en forma de señales eléctricas) se envía a través del nervio óptico a otras partes del cerebro que procesan la imagen y nos permiten ver.\n\nLo curioso es que el efecto no siempre es tan obvio para quienes están familiarizados con la persona que está en la habitación; por ejemplo, un matrimonio puede ver menos distorsión de tamaño. Es lo que se conoce como el Fenómeno Honi, llamado así por una mujer que observó tanto a un desconocido como a su marido y observó una distorsión de tamaño cuando se trataba del desconocido, ¡pero no cuando observaba a su marido!",
   "ca": "Créixer i encongir-se en una habitació de perspectiva distorsionada pot recordar-te a alguna escena d'Alícia al País de les Meravelles, de Lewis Carroll, o a una de la trilogia del Senyor dels Anells, on s'utilitza aquest truc per a fer que els hobbits semblin més petits que els humans. El principi de l'habitació d'Ames es va utilitzar molt en produccions televisives i cinematogràfiques per a efectes especials, amb la finalitat de mostrar actors de talles gegants al costat d'actors de talles petites.\n\nA la fi del segle XIX, un cavaller anomenat Hermann von Helmholtz va tenir una gran idea. Què passaria si una habitació pogués distorsionar-se d'alguna forma, però al mateix temps semblar una habitació rectangular completament normal? En 1935, un oftalmòleg anomenat Adelbert Ames va tenir una idea similar i va crear la primera sala Ames de la història. Ames va anar més enllà del concepte de Helmholtz i va ser el primer a descobrir l'impacte de l'experiència en la percepció.\n\nAixí, l'Habitació d'Ames està construïda amb el sòl i el sostre en angle, la qual cosa crea una perspectiva falsa i fa que l'ull pensi que tots dos costats de l'habitació són iguals. La forma real de la sala és un trapezi. Es creu que aquesta forma especial elimina tota distància i no permet ajustar correctament la grandària dels objectes. L'habitació crea la il·lusió que la seva grandària és molt dispar. La il·lusió porta a l'espectador a creure que les dues persones estan en el mateix camp de visió quan, en realitat, el subjecte està molt més a prop.\n\nA l'Habitació Ames de Paradox, el que es produeix és un desajustament entre els estímuls físics i la percepció de l'individu. El desajustament es deu a una interpretació incorrecta de la informació rebuda pels òrgans sensorials. En el moment en què la llum entra en contacte amb la retina, comença el procés de la visió. La informació de la retina (en forma de senyals elèctrics) s'envia a través del nervi òptic a altres parts del cervell que processen la imatge i ens permeten veure.\n\nEl curiós és que l'efecte no sempre és tan obvi per als qui estan familiaritzats amb la persona que és a l'habitació; per exemple, un matrimoni pot veure menys distorsió de grandària. És el que es coneix com el Fenomen Honi, dit així per una dona que va observar tant a un desconegut com al seu marit i va observar una distorsió de grandària quan es tractava del desconegut, però no quan observava al seu marit!"

 "Clone Table": {
  "d": {
   "en": "Imagine talking to someone who knows you best, understands you completely, never opposes you, appreciates you, and cherishes your existence. Now picture sitting at a table with the most beautiful, intelligent, fascinating, and intriguing person you know. We know that no one fits this description better than - you!\n\nThe Paradox Clone Table exhibit gives you the serene pleasure of being in the company of you, yourself and I. No arguments, debates or misunderstandings. But wait, is this fun or downright boring? Maybe five copies of yourself is a bit too much, but don't worry it's actually not you. What looks like a big round table is a wedge reflecting itself into a full circle with the help of two mirrors placed at a 60-degree angle.\n\nTake a moment to think about how many angles are all around us everyday. We form angles with our lips as we speak, and the hands of a clock create various angles throughout the day. When a clock strikes 2, the angle formed by its hands is 60 degrees.\n\nAccording to some estimates, it would cost around $1.7 million to clone a person, while some scientists claim that clones potentially face serious health problems. This exhibit gives you the opportunity to experience what it would feel like to meet your clones, while saving you a lot of money and discomfort!",
   "es": "Imagínate hablando con alguien que te conoce mejor que nadie, que te entiende perfectamente, que nunca te lleva la contraria, que te aprecia y que valora tu existencia. Ahora imagínate sentado en una mesa con la persona más bella, inteligente, fascinante e intrigante que conoces. Sabemos que nadie encaja mejor en esta descripción que… ¡tú!\n\nLa exposición de la mesa de los clones te ofrece el agradable placer de estar en compañía de ti mismo. Sin discusiones, debates ni malentendidos. Pero espera, ¿es divertido o aburrido? Puede que cinco copias de ti mismo sea demasiado, pero no te preocupes, en realidad no eres tú. Lo que parece una gran mesa redonda es una cuña que se refleja en un círculo completo con la ayuda de dos espejos colocados en un ángulo de 60 grados.\n\nTómate un momento para pensar en la cantidad de ángulos que nos rodean cada día. Formamos ángulos con los labios al hablar y las agujas de un reloj crean varios ángulos a lo largo del día. Cuando un reloj da las 2, el ángulo formado por sus agujas es de 60 grados.\n\nSegún algunas estimaciones, clonar a una persona costaría alrededor de 1,7 millones de dólares y algunos científicos afirman que los clones podrían sufrir graves problemas de salud. Esta exposición te da la oportunidad de experimentar lo que sentirías al conocer a tus clones, ¡ahorrándote mucho dinero y molestias!",
   "ca": "Imagina't parlant amb algú que et coneix millor que ningú, que t'entén perfectament, que mai et porta la contrària, que t'aprecia i que valora la teva existència. Ara imagina't assegut en una taula amb la persona més bella, intel·ligent, fascinant i intrigant que coneixes. Sabem que ningú encaixa millor en aquesta descripció que… tu!\n\nL'exposició de la taula dels clons t'ofereix l'agradable plaer d'estar en companyia de tu mateix. Sense discussions, debats ni malentesos. Però espera, és divertit o avorrit? Pot ser que cinc còpies de tu mateix sigui massa, però no et preocupis, en realitat no ets tu. El que sembla una gran taula rodona és un tascó que es reflecteix en un cercle complet amb l'ajuda de dos miralls col·locats en un angle de 60 graus.\n\nPren-te un moment per a pensar en la quantitat d'angles que ens envolten cada dia. Formem angles amb els llavis en parlar i les agulles d'un rellotge creen diversos angles al llarg del dia. Quan un rellotge dona les 2, l'angle format per les seves agulles és de 60 graus.\n\nSegons algunes estimacions, clonar a una persona costaria al voltant d'1,7 milions de dòlars i alguns científics afirmen que els clons podrien sofrir greus problemes de salut. Aquesta exposició et dona l'oportunitat d'experimentar el que sentiries en conèixer als teus clons, estalviant-te molts diners i molèsties!"
  },

 "Face Blender": {
  "d": {
   "en": "Have you ever wondered what you'd look like with your friend's nose? This exhibit gives you a real life opportunity to do just that. If you're visiting the museum with a group of friends, then you can try out a variety of noses too!\n\nYou can always try an online software that allows you to adapt your uploaded photos; using this kind of software makes it fun to see what you and your partner's baby would look like or what would happen when you morph your photo with a celebrity's.\n\nThe Paradox Face Blender exhibit is a real-time morphing moment! Play around with the exhibit to see what funny ways you can make yourself look different. Maybe you'll like it, but maybe you'll also see that your nose actually really suits your own face perfectly!",
   "es": "¿Te has preguntado alguna vez qué aspecto tendrías con la nariz de tu amigo? Esta exhibición te da la oportunidad de hacerlo en la vida real. Si visitas el museo con un grupo de amigos, ¡también puedes probar varias narices!\n\nSiempre puedes probar un programa informático online que te permita adaptar las fotos que subas. Con este tipo de programas es divertido ver qué aspecto tendría tu bebé y el de tu pareja o qué pasaría si combinaras tu foto con la de un famoso.\n\nLa exhibición Paradox Mezcla de Caras es un momento de transformación en tiempo real. Juega con la exhibición para ver de qué formas tan divertidas puedes cambiar tu aspecto. Puede que te guste, pero también puede que veas que tu nariz se adapta perfectamente a tu cara.",
   "ca": "T'has preguntat alguna vegada quin aspecte tindries amb el nas del teu amic? Aquesta exhibició et dona l'oportunitat de fer-ho en la vida real. Si visites el museu amb un grup d'amics, també pots provar diversos nassos!\n\nSempre pots provar un programa informàtic en línia que et permeti adaptar les fotos que pugis. Amb aquesta mena de programes és divertit veure quin aspecte tindria el teu bebè i el de la teva parella o què passaria si combinessis la teva foto amb la d'un famós.\n\nL'exhibició Paradox Mescla de Cares és un moment de transformació en temps real. Juga amb l'exhibició per a veure de quines formes tan divertides pots canviar el teu aspecte. Pot ser que t'agradi, però també pot ser que vegis que el teu nas s'adapta perfectament a la teva cara."

 "Kaleidoscope": {
  "d": {
   "en": "The word Kaleidoscope combines three Greek words: 'kalos' meaning beautiful, 'eidos' meaning shape, and 'skopos' meaning watcher or thing looked at. So kaleidoscope literally means 'beautiful shapes to look at.'\n\nThe first kaleidoscope was invented by Sir David Brewster around 1816. It was mainly sold as a toy for entertainment, but it has also been a creative tool for many designers and artists. The kaleidoscope's design changes endlessly by rotating the section containing the loose fragments; it produces a range of colors and patterns which over the years has inspired people to create several design items like rugs, clothes, stained glass, jewelry, architectural patterns, wallpaper, woven tapestries, and much more!\n\nThe Paradox Kaleidoscope is everyone's favorite toy turned into an exhibit! Instead of colorful papers and pearls, the inspirational patterns are created by the visitors themselves. This freestanding exhibit works on the principle of multiple reflections seen when observing the exhibit. It consists of three equal mirrors set in the shape of a three-sided prism. This triangular prism is a 3D shape with two identical faces in the shape of a triangle connected by three rectangular faces.\n\nInside, the reflection of the objects move and combine with each other in a symmetrical dance forming a constantly changing pattern. We like to think of it as a metaphor for a lovely life that is continuously changing, and continuously challenged to see things from another perspective!",
   "es": "La palabra Caleidoscopio combina tres palabras griegas: 'kalos' que significa bello, 'eidos' que significa forma, y 'skopos' que significa observador o cosa observada. Así que caleidoscopio significa literalmente «formas bellas para mirar».\n\nEl primer caleidoscopio lo inventó Sir David Brewster hacia 1816. Se vendía principalmente como juguete de entretenimiento, pero también ha sido una herramienta creativa para muchos diseñadores y artistas. El diseño del caleidoscopio cambia infinitamente al girar la sección que contiene los fragmentos sueltos; produce una gama de colores y patrones que, a lo largo de los años, ha inspirado a la gente a crear varios artículos de diseño como alfombras, ropa, vidrieras, joyas, patrones arquitectónicos, papel pintado, tapices tejidos, ¡y mucho más!\n\nEl Caleidoscopio Paradox es el juguete favorito de todos convertido en exhibición. En lugar de papeles de colores y perlas, los propios visitantes son los que crean los patrones que sirven de inspiración. Esta exhibición independiente funciona según el principio de los múltiples reflejos que se ven al observarla. Consta de tres espejos iguales colocados en forma de prisma de tres lados. Este prisma triangular es una forma tridimensional con dos caras idénticas en forma de triángulo conectadas por tres caras rectangulares.\n\nEn su interior, los reflejos de los objetos se mueven y combinan entre sí en una danza simétrica formando un patrón que cambia constantemente. Nos gusta pensar que es una metáfora de una vida llena de encanto, en continuo cambio, ¡y que continuamente nos desafía a ver las cosas desde otra perspectiva!",
   "ca": "La paraula Calidoscopi combina tres paraules gregues: 'kalos' que significa bell, 'eidos' que significa forma, i 'skopos' que significa observador o cosa observada. Així que calidoscopi significa literalment «formes belles per a mirar».\n\nEl primer calidoscopi ho va inventar Sir David Brewster cap a 1816. Es venia principalment com a joguina d'entreteniment, però també ha estat una eina creativa per a molts dissenyadors i artistes. El disseny del calidoscopi canvia infinitament en girar la secció que conté els fragments solts; produeix una gamma de colors i patrons que, al llarg dels anys, ha inspirat a la gent a crear diversos articles de disseny com a catifes, roba, vidrieres, joies, patrons arquitectònics, paper pintat, tapissos teixits, i molt més!\n\nEl Calidoscopi Paradox és la joguina favorita de tots convertit en exhibició. En lloc de papers de colors i perles, els propis visitants són els que creen els patrons que serveixen d'inspiració. Aquesta exhibició independent funciona segons el principi dels múltiples reflexos que es veuen en observar-la. Consta de tres miralls iguals col·locats en forma de prisma de tres costats. Aquest prisma triangular és una forma tridimensional amb dues cares idèntiques en forma de triangle connectades per tres cares rectangulars.\n\nEn el seu interior, els reflexos dels objectes es mouen i combinen entre si en una dansa simètrica formant un patró que canvia constantment. Ens agrada pensar que és una metàfora d'una vida plena d'encant, en continu canvi, i que contínuament ens desafia a veure les coses des d'una altra perspectiva!"
  },

   "es": "Mete la cabeza dentro. La flor simétrica que se forma ahí dentro eres tú.",
   "ca": "Fica-hi el cap. La flor simètrica que es forma allà dins ets tu.",
   "en": "Put your head inside. The symmetrical flower that forms in there is you."

 "Beuchet Chair": {
  "d": {
   "en": "Who would have thought that the perceived size of a person depends on the context suggested by its surrounding objects!? There are numerous theories and tools that attempt to shift people's perceptions or ideas, and the Beuchet Chair is one of them.\n\nThe concept was first introduced by psychologist Jean Beuchet in 1963, providing incredible insight into persuasion methods. This world-famous chair uses two pieces of apparatus to make people appear smaller - an oversized chair seat and four normal sized chair legs. The seat is positioned further away from the legs, but from a particular point, the parts appear as a whole. When someone sits on the seat, the observer automatically assumes they're close, even though they're farther away.\n\nThe Paradox Beuchet's Chair is an experientially fun way to explore the laws of perception and play with the notion of size ratios. Believe it or not, the Beuchet Chair can demystify marketing campaigns, improve brand perception, and even gain support for social campaigns!",
   "es": "¿Quién pensaría que el tamaño que se percibe de una persona depende del contexto sugerido por los objetos que la rodean? Existen numerosas teorías y herramientas que intentan alterar las percepciones o ideas de las personas, y la Silla de Beuchet es una de ellas.\n\nEl concepto fue introducido por primera vez por el psicólogo Jean Beuchet en 1963, aportando una visión increíble de los métodos de persuasión. Esta silla mundialmente famosa utiliza dos aparatos para hacer que las personas parezcan más pequeñas: un asiento de gran tamaño y cuatro patas de tamaño normal. El asiento está situado más lejos de las patas, pero desde un punto determinado, las piezas aparecen como un todo. Cuando alguien se sienta en el asiento, el observador asume automáticamente que está cerca, aunque esté más lejos.\n\nLa Silla de Beuchet es una forma divertida de explorar las leyes de la percepción y jugar con la noción de las proporciones de tamaño. Lo creas o no, la Silla de Beuchet puede desmitificar campañas de marketing, mejorar la percepción de la marca e incluso conseguir apoyo para campañas sociales.",
   "ca": "Qui pensaria que la grandària que es percep d'una persona depèn del context suggerit pels objectes que l'envolten? Existeixen nombroses teories i eines que intenten alterar les percepcions o idees de les persones, i la Cadira de Beuchet és una d'elles.\n\nEl concepte va ser introduït per primera vegada pel psicòleg Jean Beuchet en 1963, aportant una visió increïble dels mètodes de persuasió. Aquesta cadira mundialment famosa utilitza dos aparells per a fer que les persones semblin més petites: un seient de gran grandària i quatre potes de grandària normal. El seient està situat més lluny de les potes, però des d'un punt determinat, les peces apareixen com un tot. Quan algú se senti en el seient, l'observador assumeix automàticament que és a prop, encara que estigui més lluny.\n\nLa Cadira de Beuchet és una forma divertida d'explorar les lleis de la percepció i jugar amb la noció de les proporcions de grandària. Ho creguis o no, la Cadira de Beuchet pot desmitificar campanyes de màrqueting, millorar la percepció de la marca i fins i tot aconseguir suport per a campanyes socials."
  }
 },
 "PDX Sofa": {
  "d": {
   "en": "A glitch in the matrix comes from the movie 'The Matrix' where a 'glitch' drew someone's attention to the fact that they were in a simulation. Glitches are events that can only make sense if we accept the fact that our current reality is a kind of simulation.\n\nReal-life glitches are happening more and more often recently, making us feel like we are inside a movie. These bizarre incidents evoke the feeling that the world is not as we envision it to be. For example, objects vanish and then reappear. Sometimes they are never seen again. Sometimes they reappear in the same location; sometimes they reappear in broad daylight, in a place where they could have been easily seen. Or people are seen by different witnesses at different locations at the same time, or they are not seen at places where they should be. People have even vanished, only to reappear and claim they never left the location. Some reports may be the result of memory errors or the effects of drugs or carbon monoxide poisoning, but multiple witnesses have confirmed the facts of such experiences.\n\nIn the Paradox Sofa exhibit, the visitor hides part of their body in the specially designed holes of a sofa, so the lower part of the visitor is sitting on the right, whereas the torso and head appear to be sitting a meter away. It introduces the visitors to a paradoxical world where they look like a real-world glitch, but the truth is, although the photo will tell everyone otherwise, they are just two people with hidden parts of their bodies.\n\nNo conspiracy theories are involved here, just 'vegging out' mindlessly in safe, sedentary comfort, having fun with 'partners in crime.'",
   "es": "Un error en la matriz proviene de la película «Matrix», en la que un «fallo» llama la atención de alguien sobre el hecho de que se encuentra en una simulación. Los «fallos» son sucesos que solo tienen sentido si aceptamos que nuestra realidad actual es una especie de simulación.\n\nÚltimamente, los fallos en la vida real son cada vez más frecuentes y nos hacen sentir como si estuviéramos dentro de una película. Estos extraños incidentes evocan la sensación de que el mundo no es como lo imaginamos. Por ejemplo, los objetos desaparecen y vuelven a aparecer. A veces no se vuelven a ver. A veces reaparecen en el mismo lugar; a veces reaparecen a plena luz del día, en un lugar donde podrían haber sido vistos fácilmente. O son vistos por diferentes testigos en diferentes lugares al mismo tiempo, o no son vistos en lugares donde deberían estar. Incluso ha habido personas que han desaparecido para reaparecer y afirmar que nunca habían abandonado el lugar. Algunos informes pueden ser el resultado de errores de memoria o de los efectos de drogas o intoxicación por monóxido de carbono, pero múltiples testigos han confirmado los hechos de tales experiencias.\n\nEn la exhibición del Sofá Paradójico, el visitante oculta parte de su cuerpo en los huecos especialmente diseñados de un sofá, de modo que la parte inferior del visitante está sentada a la derecha, mientras que el torso y la cabeza parecen estar sentados a un metro de distancia. Introduce a los visitantes en un mundo paradójico en el que parecen un fallo del mundo real, pero la verdad es que, aunque la foto diga lo contrario a todo el mundo, no son más que dos personas con partes de su cuerpo ocultas.\n\nNo se trata de ninguna teoría conspiratoria, sino simplemente de «vaguear» sin pensar, en una cómoda y segura vida sedentaria, disfrutando junto a tu «compañero de fechorías».",
   "ca": "Un error en la matriu prové de la pel·lícula «Matrix», en la qual una «fallada» crida l'atenció d'algú sobre el fet que es troba en una simulació. Les «fallades» són successos que només tenen sentit si acceptem que la nostra realitat actual és una espècie de simulació.\n\nÚltimament, les fallades a la vida real són cada vegada més freqüents i ens fan sentir com si estiguéssim dins d'una pel·lícula. Aquests estranys incidents evoquen la sensació que el món no és com l'imaginem. Per exemple, els objectes desapareixen i tornen a aparèixer. A vegades no es tornen a veure. A vegades reapareixen en el mateix lloc; a vegades reapareixen a plena llum del dia, en un lloc on podrien haver estat vistos fàcilment. O són vistos per diferents testimonis en diferents llocs al mateix temps, o no són vistos en llocs on haurien d'estar. Fins i tot hi ha hagut persones que han desaparegut per a reaparèixer i afirmar que mai havien abandonat el lloc. Alguns informes poden ser el resultat d'errors de memòria o dels efectes de drogues o intoxicació per monòxid de carboni, però múltiples testimonis han confirmat els fets de tals experiències.\n\nEn l'exhibició del Sofà Paradoxal, el visitant oculta part del seu cos en els buits especialment dissenyats d'un sofà, de manera que la part inferior del visitant està asseguda a la dreta, mentre que el tors i el cap semblen estar asseguts a un metre de distància. Introdueix als visitants en un món paradoxal en el qual semblen una fallada del món real, però la veritat és que, encara que la foto digui el contrari a tothom, no són més que dues persones amb parts del seu cos ocultes.\n\nNo es tracta de cap teoria conspiratòria, sinó simplement de «gandulejar» sense pensar, en una còmoda i segura vida sedentària, gaudint al costat del teu «company de malifetes»."

 "Yes / No Paradox": {
  "d": {
   "en": "Yes! No! Maybe! I don't know! Can you repeat the question? This raises the notion of whether people are decisive or if their decisions are influenced by different perspectives?\n\nPerspective is the appearance of objects with respect to their relative distances and positions; it is how one looks at something. In psychological terms, your perspective is the way you have chosen to see the world. It includes the way you see yourself and those around you. And in this way, even if you think your thoughts about your life and the people you know are 'facts,' they actually aren't.\n\nThe Yes/No Paradox exhibit is an anamorphic sculpture, a distorted projection with opposing textual statements, yes and no. The visual illusion changes when the visitor changes perspective. The body of the sculpture does not change, only how we see it from different perspectives does. According to the angle, attitude, or viewpoint - physical or emotional - it's very easy to trick our brain into seeing the same sculpture differently.",

   "ca": "Sí! No! Potser! No ho sé! Pots repetir la pregunta? Això planteja la qüestió de si les persones són decisives o si les seves decisions estan influïdes per diferents perspectives.\n\nLa perspectiva és l'aparença dels objectes respecte a les seves distàncies i posicions relatives; és com es mira alguna cosa. En termes psicològics, la teva perspectiva és la forma que has triat de veure el món. Inclou la forma en què et veus a tu mateix i als quals t'envolten. I d'aquesta manera, encara que creguis que els teus pensaments sobre la teva vida i la gent que coneixes són «fets», en realitat no ho són.\n\nL'exposició de la paradoxa de sí o no és una escultura anamòrfica, una projecció distorsionada amb afirmacions textuals oposades, sí i no. La il·lusió visual canvia quan el visitant canvia de perspectiva. El cos de l'escultura no canvia, sinó com la veiem des de diferents perspectives. Segons l'angle, l'actitud o el punt de vista (físic o emocional), és molt fàcil enganyar el nostre cervell perquè vegi la mateixa escultura de manera diferent."

   case "welcome": return `<circle cx="60" cy="45" r="30" fill="none" stroke="${c}" stroke-width="2"/>
     <circle cx="60" cy="45" r="19" fill="none" stroke="${c}" stroke-width="2"/>
     <circle cx="60" cy="45" r="9" fill="${c}"/>`;

     <path d="M60 62 l-4 6 h8 z" fill="${c}"/>

   case "ring": return `<circle cx="47" cy="45" r="23" fill="none" stroke="${c}" stroke-width="5"/>

   case "cyl": return `<rect x="52" y="20" width="16" height="50" fill="${c}"/>

     <path d="M20 82 q40 -34 80 0" stroke="${c}" stroke-width="2.6" fill="none"/>`;

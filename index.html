<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3737FF" id="themeColor">
<meta name="description" content="Audioguía interactiva del Paradox Museum Barcelona: el recorrido exhibición por exhibición, en castellano, català y English.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paradox">
<style>
/* Jokker, la tipografía de la marca, servida desde la propia guía. */
@font-face{font-family:Jokker;src:url("fonts/jokker-400.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Jokker;src:url("fonts/jokker-600.woff2") format("woff2");
  font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Jokker;src:url("fonts/jokker-700.woff2") format("woff2");
  font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:Jokker;src:url("fonts/jokker-800.woff2") format("woff2");
  font-weight:800;font-style:normal;font-display:swap}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* ── cámara integrada ───────────────────────────────────────── */
#cam{position:fixed;inset:0;z-index:70;background:#05051a;display:flex;flex-direction:column}
#cam[hidden]{display:none}
#cam .camtop{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(11px + env(safe-area-inset-top,0px)) 14px 11px}
#cam .camtop b{font-size:13.5px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cam .camtop button{width:34px;height:34px;border-radius:999px;background:#ffffff1f;
  display:grid;place-items:center;font-size:15px;color:#fff;flex:0 0 auto}
#cam .camstage{flex:1;position:relative;overflow:hidden;background:#000;
  display:grid;place-items:center}
#cam video,#cam .shotimg{width:100%;height:100%;object-fit:cover;display:block}
#cam video.flip{transform:scaleX(-1)}
#cam .guide{position:absolute;left:14px;right:14px;bottom:14px;background:#05051ac2;
  border-radius:16px;padding:11px 13px;backdrop-filter:blur(7px)}
#cam .guide p{font-size:13.5px;line-height:1.4;font-weight:600;margin:0}
#cam .guide .rot{display:inline-flex;align-items:center;gap:5px;margin-bottom:7px;
  background:var(--acc);color:var(--accink);border-radius:999px;padding:3px 9px;
  font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.07em}
#cam .cambar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:24px;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#cam .shutter{width:68px;height:68px;border-radius:999px;background:var(--acc);
  border:4px solid #05051a;box-shadow:0 0 0 3px var(--acc);flex:0 0 auto}
#cam .shutter:active{transform:scale(.93)}
#cam .after{display:flex;gap:9px;width:100%}
#cam .after button{flex:1;border-radius:999px;padding:14px 10px;font-size:14px;font-weight:800}
#cam .after .keep{background:var(--acc);color:var(--accink)}
#cam .after .redo{background:#ffffff1f;color:#fff}
#cam .camerr{position:absolute;inset:14px;display:grid;place-items:center;text-align:center}
#cam .camerr p{font-size:14.5px;line-height:1.55;color:#ffffffd6;max-width:30ch}

/* botón de cámara dentro de la ficha */
.camcta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--acc);color:var(--accink);border-radius:999px;padding:15px 16px;
  font-size:15px;font-weight:800;letter-spacing:-.01em}
.camcta:active{transform:scale(.985)}
.camwrap{padding:4px max(16px,env(safe-area-inset-left,0px)) 0}
.camwrap .hint{display:block;margin-top:8px;text-align:center;font-family:var(--f-mono);
  font-size:9.5px;color:var(--muted);letter-spacing:.05em}
/* ── Castaween ──────────────────────────────────────────────── */
.castwrap{padding:18px 0 24px}
.casthero{border-radius:24px;padding:26px 20px 24px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#FF4C2A 0%,#FB48C4 58%,#3737FF 100%)}
.casthero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,#ffffff14 0 11px,transparent 11px 22px)}
.casthero>*{position:relative;z-index:1}
.castkick{display:inline-block;font-family:var(--f-mono);font-size:8.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;background:var(--acc);color:var(--accink);
  border-radius:999px;padding:4px 11px}
.casthero h2{margin:14px 0 0;font-size:clamp(34px,11vw,46px);font-weight:800;
  letter-spacing:-.045em;line-height:.92;color:#fff}
.castlead{margin:14px 0 0;font-size:15px;line-height:1.55;color:#ffffffeb}
.castlink{color:var(--acc);font-weight:800;text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:2px}
.castcta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;
  background:var(--acc);color:var(--accink);border-radius:999px;padding:15px 16px;
  font-size:15px;font-weight:800;letter-spacing:-.01em;text-decoration:none}
.castcta:active{transform:scale(.985)}
/* ── tarjeta de bienvenida ──────────────────────────────────── */
.stop.bienvenida{background:none;border-radius:26px;overflow:hidden;margin:2px 0 14px;
  position:relative;padding:0}
.bvbox{display:block;position:relative;border-radius:26px;overflow:hidden;
  background:linear-gradient(152deg,#FF4C2A 0%,#FB48C4 34%,#3737FF 68%,#00D9A0 100%);
  padding:26px 20px 23px;text-align:left}
/* Franjas que se desplazan muy despacio: un guiño al moiré del museo. */
.bvbox::before{content:"";position:absolute;inset:-20% -60%;
  background:repeating-linear-gradient(104deg,#ffffff1f 0 10px,transparent 10px 21px);
  animation:bvdrift 19s linear infinite}
.bvbox::after{content:"";position:absolute;inset:0;
  background:radial-gradient(118% 82% at 12% 6%,#ffffff2e,transparent 58%),
             linear-gradient(transparent 44%,#0b0b2b4d)}
@keyframes bvdrift{to{transform:translateX(21px)}}
@media (prefers-reduced-motion: reduce){.bvbox::before{animation:none}}
.bvbox>*{position:relative;z-index:1}
.bvkick{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);
  font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  background:var(--acc);color:var(--accink);border-radius:999px;padding:4px 11px}
.bvbox h2{margin:14px 0 0;font-size:clamp(30px,9.2vw,40px);font-weight:800;
  letter-spacing:-.045em;line-height:.9;color:#fff;text-wrap:balance}
.bvbox h2 em{font-style:normal;color:var(--acc);display:block}
.bvbox p{margin:12px 0 0;font-size:14px;line-height:1.48;color:#ffffffe8;max-width:34ch}
.bvgo{display:inline-flex;align-items:center;gap:9px;margin-top:20px;
  background:var(--acc);color:var(--accink);border-radius:999px;padding:13px 20px;
  font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.bvstats{display:flex;gap:7px;margin-top:17px;flex-wrap:wrap}
.bvstats span{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.07em;
  background:#0b0b2b5c;border-radius:999px;padding:5px 10px;color:#fff}
.stop.bienvenida.done .bvbox{opacity:.72}
/* el juego de campaña ocupa toda la pantalla, dentro de la guía */
main.castmode{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.castpane{flex:1;display:flex;flex-direction:column;min-height:0;padding:16px 0 0}
.castframe{flex:1;min-height:320px;margin-top:16px;border-radius:20px;overflow:hidden;
  background:#0b0b2b;border:1px solid var(--line)}
.castframe iframe{width:100%;height:100%;border:0;display:block;background:#0b0b2b}
.castout{display:block;padding:11px 0 14px;text-align:center;font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:.06em;color:var(--muted);text-decoration:none}
.castwhen{display:inline-block;margin-top:8px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.07em;background:var(--acc);color:var(--accink);border-radius:999px;
  padding:4px 11px}
.castlead b{color:var(--acc)}
/* ── reseña al terminar el recorrido ────────────────────────── */
.revbox{background:#ffffff14;border-radius:22px;padding:22px 18px 20px;text-align:center}
.revbox h3{margin:11px 0 0;font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.revbox p{margin:9px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.stars{display:flex;gap:6px;justify-content:center;margin-top:18px}
.stars button{font-size:38px;line-height:1;color:#ffffff3d;transition:transform .12s,color .12s}
.stars button.on{color:var(--acc)}
.stars button:active{transform:scale(.88)}
.revcta{display:block;margin-top:18px;background:var(--acc);color:var(--accink);
  border-radius:999px;padding:14px;font-size:14.5px;font-weight:800;text-align:center;
  text-decoration:none}
.revcta:active{transform:scale(.985)}
/* el juego de campaña, a pantalla completa dentro de la guía */
main.castmode{padding:0}
.castfull{position:relative;height:100%;background:#0b0b2b}
.castfull iframe{width:100%;height:100%;border:0;display:block;background:#0b0b2b}
.castesc{position:absolute;top:10px;right:10px;z-index:2;width:30px;height:30px;
  border-radius:999px;background:#05051ab0;color:#fff;display:grid;place-items:center;
  font-size:14px;text-decoration:none;backdrop-filter:blur(6px)}
/* ── Misión Castaween ───────────────────────────────────────── */
.cjuego{padding:16px 0 0}
.cjhero{display:flex;align-items:center;gap:13px}
.cjbruja{flex:0 0 auto;width:104px;height:104px;border-radius:20px;display:block;
  object-fit:cover;box-shadow:0 10px 26px #0b0b2b5c}
.cjhead{flex:1;min-width:0}
.cjhead h2{margin:10px 0 0;font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1}
.cjuego>.cjhero+.cjbar{margin-top:16px}
.cjhero+.cjbar::before{content:""}
.cjintro{margin:13px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}

.cjbar{display:flex;align-items:center;gap:11px;margin-top:15px}
.cjpips{flex:1;display:flex;gap:5px}
.cjpips i{flex:1;height:6px;border-radius:999px;background:#ffffff26;transition:background .25s}
.cjpips i.on{background:var(--acc)}
.cjbar b{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.07em;
  color:var(--muted)}

.cjform{display:flex;gap:8px;margin-top:15px}
.cjform input{flex:1;min-width:0;background:#ffffff14;border:1px solid var(--line);
  border-radius:999px;padding:14px 18px;color:#fff;font-family:var(--f-mono);
  font-size:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.cjform input::placeholder{letter-spacing:.06em;text-transform:none;color:#ffffff6b;
  font-size:13px;font-weight:400}
.cjform input:focus{outline:none;border-color:var(--acc)}
.cjform button{flex:0 0 auto;background:var(--acc);color:var(--accink);border-radius:999px;
  padding:14px 20px;font-size:14.5px;font-weight:800}
.cjmsg{margin-top:11px;font-size:13.5px;line-height:1.45;color:var(--muted);text-align:center}
.cjmsg.bien{color:var(--acc);font-weight:700}
.cjmsg.mal{color:#FF9B86}

.cjgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cjcard{position:relative;background:#ffffff14;border-radius:18px;padding:12px 10px 13px;
  text-align:center;overflow:hidden}
.cjph{display:block;height:98px}
.cjph img{width:100%;height:100%;display:block;object-fit:contain;
  filter:brightness(0) opacity(.22);transition:filter .45s}
.cjcard.on .cjph img{filter:none}
.cjcard b{display:block;margin-top:9px;font-size:12.5px;font-weight:800;line-height:1.2;
  letter-spacing:-.01em;color:var(--muted)}
.cjcard.on b{color:#fff}
.cjtick{position:absolute;top:9px;right:9px;width:21px;height:21px;border-radius:999px;
  background:var(--acc);color:var(--accink);display:grid;place-items:center;
  font-size:11px;font-weight:700}
.cjcard.recien{animation:cjpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes cjpop{0%{transform:scale(.88)}60%{transform:scale(1.05)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.cjcard.recien{animation:none}}

.cjfin{margin-top:16px;border-radius:20px;padding:20px 17px;text-align:center;
  background:linear-gradient(145deg,#FF4C2A,#FB48C4 58%,#3737FF)}
.cjfin h3{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.cjfin p{margin-top:9px;font-size:14px;line-height:1.5;color:#ffffffeb}
.cjreset{margin-top:15px;background:#0b0b2b5c;color:#fff;border-radius:999px;
  padding:11px 18px;font-size:12.5px;font-weight:700}
</style>
<title>Paradox Audioguía</title>
<link rel="preload" href="fonts/jokker-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jokker-400.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* Black ground so all five brand colours keep their punch (the brand book's
   own black page proves it); flat colour blocks, hard edges, no gradients and
   no rounded bubbles — corporate, not a kids' app. */
:root{
  --blue:#3737FF; --mint:#00FFB9; --yellow:#FFDB00; --magenta:#FB48C4;
  --orange:#FF4C2A; --grey:#D2D3D4; --black:#000000; --white:#FFFFFF;
  --bg:#3737FF; --panel2:#2A2ADB; --line:#ffffff33;
  --fg:#fff; --muted:#ffffffab;
  --acc:#FFDB00; --accink:#14141c;   /* amarillo protagonista */
  color-scheme:dark;
  --f-ui:Jokker,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:Jokker,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
.lbl,.num,.sechead em,.cjbar b,.progress span,.dtop .count,.cjform input,
.castkick,.bvstats span,.stop .meta span,.cambadge,.castwhen{font-variant-numeric:tabular-nums}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  position:relative;background:var(--bg);overflow:hidden}
@media (min-width:600px){#app{border-inline:1px solid var(--line)}}
.lbl{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase}

header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:9px;z-index:5}
.top{display:flex;align-items:center;gap:12px}
.top img{height:25px;width:auto;display:block}
.fl{display:inline-block;width:21px;height:14px;flex:0 0 auto;line-height:0;
  box-shadow:0 0 0 1px #00000033}
.fl svg{width:100%;height:100%;display:block}
.langbtn{margin-left:auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);
  padding:5px 8px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em}
.langbtn i{font-style:normal;font-size:9px;opacity:.7}
.langmenu{position:absolute;top:46px;right:max(16px,env(safe-area-inset-right,0px));z-index:30;
  background:var(--panel2);border:1px solid var(--line);min-width:172px;
  box-shadow:0 14px 34px #0006}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;
  font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line)}
.langmenu button:last-child{border-bottom:none}
.langmenu button[aria-current="true"]{background:var(--acc);color:var(--accink)}
.tabs{display:flex;gap:22px}
.tabs button{padding:0 0 9px;font-size:13px;font-weight:700;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--acc)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 26px max(16px,env(safe-area-inset-right,0px))}

.progress{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.bar{flex:1;height:3px;background:#ffffff1a;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.progress span{color:var(--muted);font-variant-numeric:tabular-nums}
.progress button{color:var(--muted)}
.progress button:hover{color:var(--orange)}

.sechead{display:flex;align-items:center;gap:8px;padding:19px 0 9px;position:sticky;top:0;
  background:linear-gradient(var(--bg) 74%,transparent);z-index:2}
.sechead b{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:5px 11px;border-radius:999px}
.sechead em{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);font-style:normal}

/* Tarjeta póster: una cápsula por exhibición, sin líneas separadoras. */
.stop{display:block;width:100%;text-align:left;background:#ffffff14;border-radius:19px;
  overflow:hidden;margin-bottom:9px;transition:transform .12s}
.stop:active{transform:scale(.985)}
.thumb{position:relative;display:block;aspect-ratio:2/1;background:#ffffff14}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover;transition:opacity .15s}
.thumb.art{aspect-ratio:16/5;background:#2A2ADB;display:flex;align-items:center;
  justify-content:center}
.thumb.art svg{width:auto;height:100%;padding:11px 0;opacity:.6}
.num{position:absolute;left:9px;bottom:9px;min-width:22px;height:20px;padding:0 7px;
  display:grid;place-items:center;border-radius:7px;font-family:var(--f-mono);font-size:10.5px;
  font-weight:600;color:var(--accink);background:var(--acc)}
.tick{position:absolute;right:9px;top:9px;width:24px;height:24px;border-radius:999px;
  background:#0b0b2bb5;display:grid;place-items:center;font-size:11px;color:#ffffff5c;
  transition:.12s}
.stop .cambadge{position:absolute;right:9px;bottom:9px;display:flex;align-items:center;gap:5px;
  background:#0b0b2bb5;border-radius:999px;padding:4px 9px;font-family:var(--f-mono);
  font-size:8.5px;font-weight:600;letter-spacing:.07em;color:var(--acc)}
.stop .meta{display:block;padding:9px 13px 11px}
.stop .meta b{display:block;font-size:15px;font-weight:800;line-height:1.18;
  letter-spacing:-.02em}
.stop .meta span{display:block;font-size:9.5px;color:var(--muted);margin-top:5px;
  font-family:var(--f-mono);letter-spacing:.06em}
.stop.done .thumb svg,.stop.done .thumb img{opacity:.55}
.stop.done .tick{background:var(--acc);color:var(--accink)}
.stop.done .meta b{color:var(--muted)}

.roomcard{display:block;width:100%;border:1px solid var(--line);padding:15px 16px;margin-top:9px}
.roomcard b{display:inline-block;font-size:14px;font-weight:800;letter-spacing:-.01em;
  padding:4px 9px}
.roomcard span{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.roomcard .pips{display:flex;gap:3px;flex-wrap:wrap;margin-top:11px}
.roomcard .pips i{width:14px;height:4px}

#detail{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;
  flex-direction:column;transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);padding-top:env(safe-area-inset-top,0px)}
#detail.open{transform:none}
.dtop{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:11px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.dtop .back{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
  color:var(--muted)}
.dtop .count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.dbody{flex:1;overflow-y:auto;overscroll-behavior:contain}

.hero{position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden}
.hero svg,.hero img{width:100%;height:100%;display:block;object-fit:cover}
.hero .tag{position:absolute;left:0;bottom:0;background:#0b0b2bd9;padding:6px 10px;color:#fff}
.dtext{padding:20px max(16px,env(safe-area-inset-left,0px)) 10px}
.droom{display:inline-block;padding:4px 9px}
.dtext h1{margin:12px 0 0;font-size:27px;font-weight:800;line-height:1.08;
  letter-spacing:-.025em;text-wrap:balance;color:var(--acc)}
.dtext h1 .hn{font-family:var(--f-mono);font-size:19px;font-weight:600;
  color:#ffffff8f;margin-right:9px;letter-spacing:0}

.block{padding:0 max(16px,env(safe-area-inset-left,0px));margin-top:26px}
.block > .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:10px}
.block > .lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.lead{margin:0;font-size:16px;line-height:1.6;max-width:62ch}
.lead + .lead{margin-top:15px}
.hook{margin:0;font-size:19px;line-height:1.42;font-weight:700;letter-spacing:-.015em;
  max-width:46ch;color:var(--fg)}
.sub{margin:10px 0 0;font-size:13.5px;line-height:1.6;color:var(--grey);max-width:62ch}

.gal{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.gal img{flex:0 0 auto;height:190px;width:auto;max-width:none;display:block;
  border:1px solid var(--line)}
.howrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.howcard{flex:0 0 150px}
.howcard .ph{aspect-ratio:3/4;background:var(--panel2);border:1px solid var(--line);
  position:relative;overflow:hidden}
.howcard .ph svg,.howcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.howcard .ph em{position:absolute;inset:auto 0 0 0;background:#0b0b2bd9;padding:4px 6px;
  font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;text-align:center}
.howcard b{display:block;margin-top:8px;font-size:12.5px;font-weight:700;line-height:1.35}
.howcard span{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);line-height:1.4}
.howstep{position:absolute;top:6px;left:6px;width:22px;height:22px;background:var(--acc);
  color:var(--accink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;
  font-weight:700;line-height:1;z-index:2}

.quiz{background:#ffffff1f;padding:18px 16px;margin:0 max(16px,env(safe-area-inset-left,0px))}
.quiz .lbl{color:var(--yellow)}
.quiz p{margin:9px 0 0;font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.quiz .reveal{margin-top:14px;background:var(--yellow);color:#000;padding:11px 14px;
  width:100%;font-size:13.5px;font-weight:800;text-align:center}
.quiz .ans{margin:13px 0 0;font-size:14.5px;line-height:1.55;color:#fff;font-weight:400}
.quiz .ans b{color:var(--mint)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);padding:6px 9px;font-size:11.5px;color:var(--grey)}
.pending{border:1px dashed var(--line);padding:13px 14px;font-size:12.5px;color:var(--muted);
  line-height:1.5}

.dfoot{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:10px max(16px,env(safe-area-inset-left,0px));
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--bg)}
.nextrow{display:flex;gap:8px}
.nextrow .prev{flex:0 0 52px;height:54px;border:1px solid var(--line);display:grid;
  place-items:center;font-size:18px;color:var(--grey)}
.nextrow .prev:disabled{opacity:.25;cursor:default}
.nextrow .next{flex:1;height:54px;background:var(--acc);color:var(--accink);display:flex;
  align-items:center;justify-content:space-between;padding:0 16px;font-size:15px;
  font-weight:800;letter-spacing:-.01em;min-width:0}
.nextrow .next:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.nextrow .next i{font-style:normal;font-size:19px;flex:0 0 auto;padding-left:10px}
.nextrow .next span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seenbtn{height:40px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--grey)}
.seenbtn[data-on="1"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}

#gate{position:absolute;inset:0;z-index:40;background:var(--blue);display:flex;
  flex-direction:column;overflow-y:auto;padding:0 max(22px,env(safe-area-inset-left,0px))}
#gate.hide{display:none}
#gate .inner{margin:auto 0;padding:34px 0}
#gate img{width:min(270px,72%);height:auto;display:block}
#gate h1{margin:30px 0 0;font-size:41px;font-weight:800;line-height:.98;
  letter-spacing:-.035em;color:var(--acc)}
#gate h1 em{font-style:normal;color:#fff}
#gate p{margin:16px 0 0;font-size:14.5px;line-height:1.55;color:#fff;max-width:32ch}
#gate .pick{margin-top:30px;color:#ffffffb3}
#gate .opts{display:flex;flex-direction:column;gap:7px;margin-top:11px}
#gate .opts button{display:flex;align-items:center;gap:12px;background:#ffffff14;
  border:1px solid #ffffff38;padding:15px 16px;font-size:15.5px;font-weight:700}
#gate .opts button u{text-decoration:none;margin-left:auto;font-family:var(--f-mono);
  font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--acc)}
#gate .opts .fl{width:26px;height:17px}
#gate .opts button:hover{background:var(--acc);border-color:var(--acc);color:var(--accink)}
#gate .opts button:hover u{color:#000}
#gate .foot{margin-top:24px;color:#ffffff80}

.styleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.styleGrid button{border:1px solid var(--line);padding:0;overflow:hidden}
.styleGrid button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.styleGrid .sv{display:block;aspect-ratio:1/1;background:var(--panel2)}
.styleGrid .sv svg{width:100%;height:100%;display:block}
.styleGrid b{display:block;padding:8px 8px 0;font-size:11.5px;font-weight:700}
.styleGrid span{display:block;padding:4px 8px 9px;font-size:10.5px;color:var(--muted);
  line-height:1.35}
.note{margin-top:16px;border-left:2px solid var(--yellow);padding:2px 0 2px 12px;
  font-size:12.5px;color:var(--grey);line-height:1.55}


/* visor de fotos a pantalla completa */
.hero,.gal img,.howcard .ph{cursor:zoom-in}
#lightbox{position:fixed;inset:0;z-index:60;background:#070722f2;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  padding:max(16px,env(safe-area-inset-left,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  backdrop-filter:blur(3px)}
#lightbox img{grid-column:2;max-width:100%;max-height:82vh;width:auto;height:auto;
  margin:0 auto;display:block;object-fit:contain}
#lightbox button{width:44px;height:44px;display:grid;place-items:center;font-size:19px;
  color:#fff;background:#ffffff1c;border:1px solid #ffffff38}
#lightbox button:disabled{opacity:.25}
#lbClose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
  right:calc(14px + env(safe-area-inset-right,0px));z-index:2}
#lbCount{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  text-align:center;color:#ffffffa8}
@media (max-width:520px){
  #lightbox{grid-template-columns:1fr}
  #lbPrev,#lbNext{position:absolute;bottom:calc(44px + env(safe-area-inset-bottom,0px))}
  #lbPrev{left:calc(16px + env(safe-area-inset-left,0px))}
  #lbNext{right:calc(16px + env(safe-area-inset-right,0px))}
  #lightbox img{grid-column:1}
}

@media (prefers-reduced-motion:reduce){#detail{transition:none}.bar i{transition:none}}
</style>

<body>
<div id="app">
  <header>
    <div class="top">
      <img id="logo" alt="Paradox Museum">
      <button class="langbtn" id="langbtn" aria-haspopup="true" aria-expanded="false">
        <span class="fl" id="langflag"></span><span id="langcode">ES</span><i>▾</i></button>
      <div class="langmenu" id="langmenu" hidden role="menu"></div>
    </div>
    <div class="tabs" role="tablist">
      <button data-tab="route" role="tab" aria-selected="true" id="tabRoute">Recorrido</button>
      <button data-tab="rooms" role="tab" aria-selected="false" id="tabRooms">Salas</button>
      <button data-tab="cast" role="tab" aria-selected="false" id="tabCast">Castaween</button>
    </div>
  </header>

  <main id="main"></main>

  <section id="detail" aria-hidden="true">
    <div class="dtop">
      <button class="back" id="back">← <span id="backTxt">Recorrido</span></button>
      <span class="count lbl" id="dcount"></span>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="dfoot">
      <button class="seenbtn" id="done"></button>
      <div class="nextrow">
        <button class="prev" id="prev" aria-label="Anterior">←</button>
        <button class="next" id="next"><span id="nextTxt"></span><i>→</i></button>
      </div>
    </div>
  </section>

  <section id="gate">
    <div class="inner">
      <img id="gateLogo" alt="Paradox Museum">
      <h1>¡Bienvenidos!<br><em>Benvinguts!</em><br>Welcome!</h1>
      <p>Aquí dentro nada es lo que parece. Esta guía te acompaña exhibición
         por exhibición y te cuenta cómo sacarles partido.</p>
      <div class="lbl pick">Elige idioma · Tria idioma · Choose language</div>
      <div class="opts" id="gateopts"></div>
      <div class="lbl foot">Paradox Museum Barcelona</div>
    </div>
  </section>

  <div id="cam" hidden aria-modal="true" role="dialog">
    <div class="camtop">
      <b id="camTitle"></b>
      <button id="camFlip" type="button" aria-label="Cambiar de cámara">⇄</button>
      <button id="camClose" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="camstage">
      <video id="camVid" playsinline autoplay muted></video>
      <img id="camImg" class="shotimg" alt="" hidden>
      <div class="guide" id="camGuide"></div>
      <div class="camerr" id="camErr" hidden><p></p></div>
    </div>
    <div class="cambar" id="camBar"></div>
  </div>

  <div id="lightbox" hidden aria-modal="true" role="dialog">
    <button id="lbClose" aria-label="Cerrar">✕</button>
    <button id="lbPrev" aria-label="Anterior">←</button>
    <img id="lbImg" alt="">
    <button id="lbNext" aria-label="Siguiente">→</button>
    <div id="lbCount" class="lbl"></div>
  </div>
</div>

{n:"",r:"entrada",t:"Bienvenido · Benvingut · Welcome",art:"welcome",
 hook:{es:"Tus ojos están a punto de mentirte más de cincuenta veces seguidas. Lo van a hacer muy bien.",
       ca:"Els teus ulls estan a punt de mentir-te més de cinquanta vegades seguides. Ho faran molt bé.",
       en:"Your eyes are about to lie to you more than fifty times in a row. They will do it beautifully."},
 d:{es:"Sigue el recorrido parada a parada: cada número del suelo y de la pared se corresponde con una ficha de esta guía. Puedes ir en orden o saltar por salas.",
    ca:"Segueix el recorregut parada a parada: cada número del terra i de la paret es correspon amb una fitxa d'aquesta guia. Pots anar en ordre o saltar per sales.",
    en:"Follow the tour stop by stop: every number on the floor and the walls matches a card here. Go in order or jump around by room."},
 how:[{t:{es:"Carga la batería",ca:"Carrega la bateria",en:"Charge up"},
       s:{fr:"Formes pleines, aucune ombre. C'est le style de la marque.",it:"Forme piene, zero ombre. È lo stile del marchio.",de:"Massive Formen, keine Schatten. Der Stil der Marke.",es:"Vas a hacer más fotos de las que crees.",ca:"Faràs més fotos de les que creus.",en:"You will take more photos than you expect."}},
      {t:{es:"Ve acompañado",ca:"Vés acompanyat",en:"Bring someone"},
       s:{fr:"Contour seul. Plus technique et plus sobre.",it:"Solo contorno. Più tecnico e più sobrio.",de:"Nur Umriss. Technischer und zurückhaltender.",es:"La mitad de las piezas necesitan a alguien al otro lado.",ca:"La meitat de les peces necessiten algú a l'altre costat.",en:"Half the pieces need someone on the other side."}}],
 quiz:{q:{es:"¿Cuánto se tarda en hacer el recorrido entero?",
          ca:"Quant es triga a fer el recorregut sencer?",
          en:"How long does the whole tour take?"},
       a:{es:"Sin prisa, alrededor de <b>90 minutos</b>. Son más de cincuenta piezas repartidas en <b>dos plantas y siete salas</b>, y casi todas piden que te pares a probarlas.",
          ca:"Sense pressa, al voltant de <b>90 minuts</b>. Són més de cinquanta peces repartides en <b>dues plantes i set sales</b>, i gairebé totes demanen que t'hi paris a provar-les.",
          en:"Unhurried, about <b>90 minutes</b>. There are more than fifty pieces across <b>two floors and seven rooms</b>, and nearly all of them ask you to stop and try them."}}},

{n:"52",r:"tienda",t:"Paradox Challenge",art:"balloon",
 hook:{es:"Parece que lo podrías apartar de un manotazo. Prueba a calcular dónde está exactamente: no vas a poder.",
       ca:"Sembla que el podries apartar d'una manotada. Prova de calcular on és exactament: no podràs.",
       en:"It looks like one swat would move it. Try working out exactly where it is: you cannot."},
 d:{es:"Sin referencias de tamaño alrededor, el cerebro no tiene con qué comparar. Usa la distancia para estimar el tamaño y el tamaño para estimar la distancia, y aquí las dos pistas se contradicen.",
    ca:"Sense referències de mida al voltant, el cervell no té amb què comparar. Fa servir la distància per estimar la mida i la mida per estimar la distància, i aquí les dues pistes es contradiuen.",
    en:"With no size cues around it, your brain has nothing to compare against. It uses distance to judge size and size to judge distance, and here the two cues contradict each other."},
 how:[{t:{es:"Ponte en la marca",ca:"Posa't a la marca",en:"Stand on the mark"},
       s:{fr:"Trame de points façon sérigraphie. Plus graphique.",it:"Trama di punti tipo serigrafia. Più grafico.",de:"Punktraster wie im Siebdruck. Grafischer.",es:"El punto del suelo es el único sitio donde cuadra.",ca:"El punt del terra és l'únic lloc on quadra.",en:"The floor marker is the only spot where it lines up."}},
      {t:{es:"Mano extendida",ca:"Mà estesa",en:"Hand out front"},
       s:{es:"Estira el brazo del todo hacia la cámara.",ca:"Estira el braç del tot cap a la càmera.",en:"Reach your arm fully toward the camera."}},
      {t:{es:"Cámara baja",ca:"Càmera baixa",en:"Camera low"},
       s:{es:"A la altura del pecho exagera el efecto.",ca:"A l'alçada del pit exagera l'efecte.",en:"Chest height exaggerates the effect."}}],
 quiz:{q:{es:"¿Qué pista engaña a tu cerebro: el tamaño o la distancia?",
          ca:"Quina pista enganya el teu cervell: la mida o la distància?",
          en:"Which cue fools your brain: size or distance?"},
       a:{es:"<b>Las dos a la vez.</b> El cerebro las usa en bucle, cada una para deducir la otra. Si le quitas los puntos de referencia, el bucle se queda sin suelo y acepta cualquier respuesta.",
          ca:"<b>Totes dues alhora.</b> El cervell les fa servir en bucle, cadascuna per deduir l'altra. Si li treus els punts de referència, el bucle es queda sense terra i accepta qualsevol resposta.",
          en:"<b>Both at once.</b> Your brain runs them in a loop, each one deducing the other. Remove the reference points and the loop has nothing to stand on, so it accepts any answer."}}},

{n:"",r:"s3",t:"Escape",art:"ring"},
{n:"02",r:"s3",t:"Cylinder PDX",art:"cyl",
 d:{es:"Un cilindro espejado en el centro de un dibujo deformado. Visto desde arriba el reflejo recompone la imagen: la deformación del papel y la curva del espejo se anulan entre sí.",
    ca:"Un cilindre mirallat al centre d'un dibuix deformat. Vist des de dalt el reflex recompon la imatge: la deformació del paper i la corba del mirall s'anul·len entre si.",
    en:"A mirrored cylinder at the centre of a distorted drawing. Seen from above the reflection rebuilds the image: the warped paper and the curved mirror cancel out."}},
{n:"03",r:"s3",t:"Paradox Rings",art:"ring",
 d:{es:"Dos aros que parecen atravesarse sin tocarse. El cerebro insiste en leerlos como objetos sólidos aunque la geometría que ve sea imposible.",
    ca:"Dos cèrcols que semblen travessar-se sense tocar-se. El cervell insisteix a llegir-los com a objectes sòlids encara que la geometria sigui impossible.",
    en:"Two rings that seem to pass through each other without touching. Your brain insists on reading them as solid objects even though the geometry is impossible."}},

{n:"04",r:"s3",t:"Moire Animation",art:"moire",
 d:{es:"Una lámina de rayas se desliza sobre un dibujo y lo pone en movimiento. No hay motor ni pantalla: es el efecto moiré, la interferencia entre dos patrones de líneas casi iguales.",
    ca:"Una làmina de ratlles llisca sobre un dibuix i el posa en moviment. No hi ha motor ni pantalla: és l'efecte moiré, la interferència entre dos patrons de línies gairebé iguals.",
    en:"A striped sheet slides over a drawing and sets it moving. No motor, no screen: the moiré effect, interference between two nearly identical line patterns."}},
{n:"05",r:"s3",t:"PDX Stick",art:"stick"},
{n:"06",r:"s3",t:"Shadow Freeze",art:"shadow",
 hook:{es:"Tienes tres segundos para elegir qué postura se va a quedar pegada a la pared. Elige bien.",
       ca:"Tens tres segons per triar quina postura es quedarà enganxada a la paret. Tria bé.",
       en:"You get three seconds to pick the pose that will stay stuck on the wall. Choose well."},
 d:{es:"Un flash potente sobre una pared fosforescente deja tu sombra congelada unos segundos. La pared sigue brillando donde le llegó la luz y se queda oscura justo donde estabas tú.",
    ca:"Un flaix potent sobre una paret fosforescent deixa la teva ombra congelada uns segons. La paret continua brillant on li va arribar la llum i es queda fosca just on eres tu.",
    en:"A bright flash against a phosphorescent wall freezes your shadow. The wall keeps glowing where the light hit it and stays dark exactly where you stood."},
 how:[{t:{es:"Pégate a la pared",ca:"Enganxa't a la paret",en:"Get close"},
       s:{es:"Cuanto más cerca, más nítido el contorno.",ca:"Com més a prop, més nítid el contorn.",en:"The closer you are, the sharper the outline."}},
      {t:{es:"Postura exagerada",ca:"Postura exagerada",en:"Go big"},
       s:{es:"Brazos y piernas abiertos se leen mucho mejor.",ca:"Braços i cames oberts es llegeixen molt millor.",en:"Arms and legs out read far better."}},
      {t:{es:"No te muevas",ca:"No et moguis",en:"Freeze"},
       s:{es:"Si te mueves en el flash, la sombra sale borrosa.",ca:"Si et mous en el flaix, l'ombra surt borrosa.",en:"Move during the flash and the shadow smears."}}],
 quiz:{q:{es:"La pared brilla. ¿Por qué tu silueta sale oscura y no al revés?",
          ca:"La paret brilla. Per què la teva silueta surt fosca i no a l'inrevés?",
          en:"The wall glows. Why does your silhouette come out dark instead of bright?"},
       a:{es:"Porque la pintura <b>guarda la luz que recibe</b> y la suelta poco a poco. Tú hiciste de paraguas: donde estabas no llegó nada de flash, así que esa zona no tiene nada que soltar.",
          ca:"Perquè la pintura <b>guarda la llum que rep</b> i la deixa anar a poc a poc. Tu vas fer de paraigua: on eres no hi va arribar gens de flaix, així que aquella zona no té res a deixar anar.",
          en:"Because the paint <b>stores the light it receives</b> and releases it slowly. You acted as an umbrella: no flash reached the wall behind you, so that patch has nothing to release."}}},

{n:"07",r:"s2",t:"Moire Animation",art:"moire"},
{n:"08",r:"s2",t:"Moire Animation",art:"moire"},
{n:"09",r:"s2",t:"Moire Animation",art:"moire"},
{n:"10",r:"s2",t:"Stroop Effect",art:"stroop",
 hook:{es:"Di el color de la tinta, no la palabra. Suena facilísimo. Vas a tropezar en la tercera.",
       ca:"Digues el color de la tinta, no la paraula. Sona facilíssim. Ensopegaràs a la tercera.",
       en:"Say the ink colour, not the word. Sounds trivial. You will stumble on the third one."},
 d:{es:"Leer es automático: llevas años haciéndolo sin decidirlo. Para decir el color tienes que frenar la lectura a propósito, y ese freno cuesta unas décimas de segundo que se notan.",
    ca:"Llegir és automàtic: fa anys que ho fas sense decidir-ho. Per dir el color has de frenar la lectura expressament, i aquest fre costa unes dècimes de segon que es noten.",
    en:"Reading is automatic: you have done it for years without choosing to. Naming the colour means overriding that on purpose, and the override costs a few tenths of a second you can feel."},
 how:[{t:{es:"Cronométrate",ca:"Cronometra't",en:"Time yourself"},
       s:{es:"Primero leyendo palabras, luego diciendo colores.",ca:"Primer llegint paraules, després dient colors.",en:"First read the words, then name the colours."}},
      {t:{es:"Reta a alguien",ca:"Repta algú",en:"Race someone"},
       s:{es:"Se nota mucho más cuando hay prisa.",ca:"Es nota molt més quan hi ha pressa.",en:"The effect is far louder under pressure."}}],
 quiz:{q:{es:"¿Le pasaría lo mismo a alguien que no sabe leer?",
          ca:"Li passaria el mateix a algú que no sap llegir?",
          en:"Would someone who cannot read have the same problem?"},
       a:{es:"<b>No.</b> Sin lectura automática no hay nada que frenar, así que dicen el color igual de rápido en los dos casos. El efecto aparece justo cuando aprendes a leer con soltura: es el precio de hacerlo sin esfuerzo.",
          ca:"<b>No.</b> Sense lectura automàtica no hi ha res a frenar, així que diuen el color igual de ràpid en tots dos casos. L'efecte apareix just quan aprens a llegir amb soltesa: és el preu de fer-ho sense esforç.",
          en:"<b>No.</b> With no automatic reading there is nothing to override, so they name the colour just as fast either way. The effect appears exactly when you become a fluent reader — it is the price of doing it effortlessly."}}},

{n:"11",r:"s4",t:"Infinity Dodecahedron",art:"dodeca",

    ca:"Un políedre de dotze cares folrat de miralls i llums per dins. Cada cara reflecteix les altres i la sala sembla prolongar-se sense final.",
    en:"A twelve-sided solid lined inside with mirrors and lights. Each face reflects the others and the room seems to carry on without end."}},

    ca:"Una superfície de peces mòbils que copia el relleu del que hi recolzis. La teva mà desapareix i torna convertida en un volum de píxels.",
    en:"A surface of sliding pins that copies the relief of whatever you press into it. Your hand vanishes and returns as a volume made of pixels."}},

{n:"17",r:"zg",t:"Zero Gravity",art:"gravity",
 d:{es:"La sala inclinada. El suelo está en pendiente pero las referencias visuales dicen que está recto, así que tu equilibrio se pelea con tus ojos.",
    ca:"La sala inclinada. El terra està en pendent però les referències visuals diuen que és recte, així que el teu equilibri es baralla amb els teus ulls.",
    en:"The tilted room. The floor slopes but every visual cue says it is level, so your balance argues with your eyes."}},
{n:"18",r:"zg",t:"Out of the Box",art:"box"},
{n:"19",r:"zg",t:"Infinity Room",art:"infroom",
 hook:{es:"Entra solo. En cuanto se cierre la puerta vas a ser muchísima gente.",
       ca:"Entra-hi sol. Quan es tanqui la porta seràs moltíssima gent.",
       en:"Go in alone. The moment the door shuts you will be an awful lot of people."},
 d:{es:"Una habitación hexagonal forrada de espejos. No hay paredes visibles ni suelo ni techo: sólo tú, repetido hasta donde alcanza la vista.",
    ca:"Una habitació hexagonal folrada de miralls. No hi ha parets visibles ni terra ni sostre: només tu, repetit fins on arriba la vista.",
    en:"A hexagonal room lined with mirrors. No visible walls, floor or ceiling: just you, repeated as far as you can see."},
 how:[{t:{es:"De uno en uno",ca:"D'un en un",en:"One at a time"},
       s:{es:"Con dos personas se rompe la simetría.",ca:"Amb dues persones es trenca la simetria.",en:"Two people break the symmetry."}},
      {t:{es:"Apunta a una esquina",ca:"Apunta a un racó",en:"Aim at a corner"},
       s:{es:"Es donde más lejos llega el reflejo.",ca:"És on més lluny arriba el reflex.",en:"That is where the reflection runs deepest."}},
      {t:{es:"Sin flash",ca:"Sense flaix",en:"No flash"},
       s:{es:"El flash rebota y arruina la foto.",ca:"El flaix rebota i espatlla la foto.",en:"Flash bounces straight back and ruins the shot."}}],
 quiz:{q:{es:"¿Hasta dónde llegan de verdad los reflejos?",
          ca:"Fins on arriben de debò els reflexos?",
          en:"How far do the reflections actually go?"},
       a:{es:"No llegan al infinito. Cada espejo devuelve algo menos del <b>95 % de la luz</b>, así que cada rebote es más oscuro que el anterior y lo que ves acaba perdiéndose en negro tras unas cuantas decenas de copias.",
          ca:"No arriben a l'infinit. Cada mirall retorna una mica menys del <b>95 % de la llum</b>, així que cada rebot és més fosc que l'anterior i el que veus acaba perdent-se en negre després d'unes quantes desenes de còpies.",
          en:"Not to infinity. Each mirror returns a little under <b>95% of the light</b>, so every bounce is dimmer than the last and what you see fades to black after a few dozen copies."}}},

{n:"24",r:"zg",t:"Muro de ilusiones ópticas",art:"wall",
 list:["Fraser Spiral","Müller-Lyer","Bulging Squares","Shepard's Boxes","Ehrenstein",
       "Leaf Wave","Scintillating Grid","Floating Circle","Warped Dotted Surface",
       "Café Wall","Jastrow","Gradient Stripe"],
 d:{es:"Doce ilusiones clásicas en una sola pared. Ninguna se mueve, ninguna está torcida y ninguna cambia de tamaño: todo lo que ves de más lo pone tu propio sistema visual.",
    ca:"Dotze il·lusions clàssiques en una sola paret. Cap no es mou, cap no està torta i cap no canvia de mida: tot el que hi veus de més ho hi posa el teu propi sistema visual.",
    en:"Twelve classic illusions on one wall. None move, none are crooked, none change size: everything extra you see is added by your own visual system."}},

{n:"25",r:"s6",t:"PDX Turn",sub:"×3",art:"turn"},
{n:"26",r:"s6",t:"Tilted Room",art:"tilt"},
{n:"27",r:"s6",t:"PDX Ball",art:"ball",
 d:{es:"Una bola que sube sola por un raíl. En realidad baja: el raíl está diseñado para que su punto más bajo parezca el más alto.",
    ca:"Una bola que puja sola per un rail. En realitat baixa: el rail està dissenyat perquè el seu punt més baix sembli el més alt.",
    en:"A ball that rolls uphill by itself. In fact it rolls down: the rail is built so its lowest point looks like its highest."}},
{n:"28",r:"s6",t:"Clone Table",art:"clone"},
{n:"29",r:"s6",t:"Symmetry Room",art:"sym"},
{n:"30",r:"s6",t:"Moving Picture",art:"moire"},
{n:"",r:"s6",t:"Impossible Triangle",art:"tri",
 d:{es:"El triángulo de Penrose: tres barras que no pueden unirse en el espacio real y sin embargo ahí están. Desde un único punto exacto el truco se cierra.",
    ca:"El triangle de Penrose: tres barres que no es poden unir a l'espai real i tanmateix hi són. Des d'un únic punt exacte el truc es tanca.",
    en:"The Penrose triangle: three bars that cannot meet in real space and yet there they are. From one exact viewpoint the trick closes up."}},
{n:"31",r:"s6",t:"Face Blender",art:"face"},
{n:"32",r:"s6",t:"Ames Room",art:"ames",
 hook:{es:"Uno de los dos va a salir el doble de alto que el otro. Y ninguno se mueve del suelo.",
       ca:"Un dels dos sortirà el doble d'alt que l'altre. I cap no es mou del terra.",
       en:"One of you comes out twice the height of the other. Neither of you leaves the floor."},
 d:{es:"Por la mirilla parece un cubo normal, pero es un trapecio: una esquina está mucho más lejos que la otra. El cerebro da por hecho que la habitación es rectangular y prefiere deformar a las personas antes que deformar la sala.",
    ca:"Pel forat sembla un cub normal, però és un trapezi: un racó és molt més lluny que l'altre. El cervell dona per fet que l'habitació és rectangular i prefereix deformar les persones abans que deformar la sala.",
    en:"Through the peephole it looks like an ordinary cube, but it is a trapezoid: one corner is far further away. Your brain assumes the room is rectangular and would rather distort the people than distort the room."},
 how:[{t:{es:"Uno en cada esquina",ca:"Un a cada racó",en:"One per corner"},
       s:{es:"Es el contraste lo que hace la foto.",ca:"És el contrast el que fa la foto.",en:"The contrast is what makes the shot."}},
      {t:{es:"Sólo por la mirilla",ca:"Només pel forat",en:"Peephole only"},
       s:{es:"Desde cualquier otro ángulo se ve el truco.",ca:"Des de qualsevol altre angle es veu el truc.",en:"From any other angle the trick is visible."}},
      {t:{es:"Intercambiaos",ca:"Intercanvieu-vos",en:"Swap over"},
       s:{es:"La segunda foto es la que convence.",ca:"La segona foto és la que convenç.",en:"The second photo is the convincing one."}}],
 quiz:{q:{es:"¿Por qué el cerebro deforma a la persona y no a la habitación?",
          ca:"Per què el cervell deforma la persona i no l'habitació?",
          en:"Why does your brain distort the person and not the room?"},
       a:{es:"Porque llevas toda la vida en habitaciones rectangulares y <b>ninguna en habitaciones trapezoidales</b>. Entre dos explicaciones posibles, el cerebro elige siempre la que ha visto un millón de veces, aunque eso le obligue a hacer gigante a tu amigo.",
          ca:"Perquè portes tota la vida en habitacions rectangulars i <b>cap en habitacions trapezoïdals</b>. Entre dues explicacions possibles, el cervell tria sempre la que ha vist un milió de vegades, encara que això l'obligui a fer gegant el teu amic.",
          en:"Because you have spent your whole life in rectangular rooms and <b>none at all in trapezoidal ones</b>. Given two possible explanations, your brain always picks the one it has seen a million times, even if that means turning your friend into a giant."}}},

{n:"47",r:"s7",t:"Beuchet Chair",art:"chair",
 hook:{es:"El asiento y las patas están a varios metros el uno del otro. Tú te vas a sentar igualmente.",
       ca:"El seient i les potes són a diversos metres l'un de l'altre. Tu t'hi asseuràs igualment.",
       en:"The seat and the legs are metres apart. You are going to sit on it anyway."},
 d:{es:"Son dos piezas separadas, pintadas del mismo color y colocadas a distancias distintas. Desde la marca del suelo se superponen y el cerebro las monta como una sola silla, así que encoge a quien se sienta para que encaje.",
    ca:"Són dues peces separades, pintades del mateix color i col·locades a distàncies diferents. Des de la marca del terra se superposen i el cervell les munta com una sola cadira, així que encongeix qui s'hi asseu perquè encaixi.",
    en:"Two separate pieces, painted the same colour and placed at different distances. From the floor marker they overlap and your brain assembles them into one chair, so it shrinks whoever sits down to make them fit."},
 how:[{t:{es:"Uno sentado, otro de pie",ca:"Un assegut, l'altre dret",en:"One sits, one stands"},
       s:{es:"El de pie da la escala real.",ca:"El dret dona l'escala real.",en:"The standing one supplies the real scale."}},
      {t:{es:"Cámara en la marca",ca:"Càmera a la marca",en:"Camera on the mark"},
       s:{es:"Un palmo fuera y la silla se parte en dos.",ca:"Un pam fora i la cadira es parteix en dos.",en:"A hand's width off and the chair splits in two."}},
      {t:{es:"Pies colgando",ca:"Peus penjant",en:"Feet dangling"},
       s:{es:"Vende muchísimo el tamaño de juguete.",ca:"Ven moltíssim la mida de joguina.",en:"Really sells the toy-sized look."}}],
 quiz:{q:{es:"¿Qué pasa si te mueves un paso a la derecha?",
          ca:"Què passa si et mous un pas a la dreta?",
          en:"What happens if you step one pace to the right?"},
       a:{es:"La silla <b>se desmonta</b>. El truco depende de un único punto de vista: fuera de él, el asiento y las patas vuelven a ser dos objetos sin relación separados por media sala.",
          ca:"La cadira <b>es desmunta</b>. El truc depèn d'un únic punt de vista: fora d'ell, el seient i les potes tornen a ser dos objectes sense relació separats per mitja sala.",
          en:"The chair <b>falls apart</b>. The trick depends on one single viewpoint: step off it and the seat and the legs go back to being two unrelated objects half a room apart."}}},

{n:"50",r:"s1",t:"Kaleidoscope",art:"kaleido",
 d:{es:"Tres espejos en triángulo multiplican cualquier cosa que entre hasta formar una flor simétrica. Mete la cabeza y la flor serás tú.",
    ca:"Tres miralls en triangle multipliquen qualsevol cosa que hi entri fins a formar una flor simètrica. Fica-hi el cap i la flor seràs tu.",

{n:"51",r:"s1",t:"Anamorphic Paradox",art:"anamorph",
 d:{es:"Un dibujo estirado por el suelo y la pared que sólo se recompone desde la marca. La misma técnica que usaban los pintores del Renacimiento para esconder figuras en sus cuadros.",
    ca:"Un dibuix estirat pel terra i la paret que només es recompon des de la marca. La mateixa tècnica que feien servir els pintors del Renaixement per amagar figures als seus quadres.",
    en:"A drawing stretched across floor and wall that only resolves from the marker. The same technique Renaissance painters used to hide figures in their pictures."}},

{n:"",r:"salida",t:"Gracias · Gràcies · Thank you",art:"welcome",
 hook:{es:"Lo has visto todo. Ahora vuelve y míralo otra vez: casi todo funciona mejor cuando ya sabes dónde está el truco.",

 "Shadow Freeze": {

   "ca": "Entra a la sala fosca i prem l'interruptor. Tanca la cortina perquè no hi entri llum. Posa't davant de la paret blanca i tanca els ulls: el flaix es dispara als 10 segons i imprimeix la teva ombra a la paret. Fes totes les fotos que vulguis abans d'obrir la cortina.",

 },
 "Stroop Effect": {
  "todo": {
   "es": "Lee lo que está escrito. Ahora intenta decir el color de cada palabra. No es tan fácil como parece.",
   "ca": "Llegeix el que hi ha escrit. Ara intenta dir el color de cada paraula. No és tan fàcil com sembla.",
   "en": "Read what's written. Then try to name the colour of each word. Not as easy as it seems.",
   "fr": "Lisez ce qui est écrit. Essayez ensuite de nommer la couleur de chaque mot. Ce n'est pas si simple.",
   "it": "Leggi quello che c'è scritto. Ora prova a dire il colore di ogni parola. Non è così facile come sembra.",
   "de": "Lies, was dasteht. Versuche nun, die Farbe jedes Wortes zu benennen. Nicht so leicht, wie es aussieht."
  },
  "info": {
   "es": "El efecto Stroop es el retraso en el tiempo de reacción entre estímulos congruentes e incongruentes. Aparece cuando hay un desajuste entre el nombre de un color y el color de la tinta con la que está impreso: por ejemplo, la palabra «rojo» escrita en tinta azul. Al pedirte que digas el color, tardas más y cometes más errores. Es simplemente tu cerebro tomándose más tiempo para procesar la información.",
   "ca": "L'efecte Stroop és el retard en el temps de reacció entre estímuls congruents i incongruents. Apareix quan hi ha un desajustament entre el nom d'un color i el color de la tinta amb què està imprès: per exemple, la paraula «vermell» escrita en tinta blava. En demanar-te que diguis el color, trigues més i comets més errors. És simplement el teu cervell prenent-se més temps per processar la informació.",
   "en": "The Stroop effect is the delay in reaction time between congruent and incongruent stimuli. It occurs when there is a mismatch between the name of a colour and the colour it is printed in (for example, the word 'red' printed in blue ink instead of red ink). When asked to name the colour of the word it takes longer and is more prone to errors. It's just our brain being slow and taking more time to process given information.",
   "fr": "L'effet Stroop est le ralentissement du temps de réaction entre stimuli congruents et incongruents. Il apparaît quand le nom d'une couleur ne correspond pas à l'encre dans laquelle il est imprimé : par exemple le mot « rouge » écrit en bleu. Nommer la couleur devient plus lent et plus sujet aux erreurs. C'est simplement le cerveau qui met plus de temps à traiter l'information.",
   "it": "L'effetto Stroop è il ritardo nel tempo di reazione tra stimoli congruenti e incongruenti. Si verifica quando il nome di un colore non corrisponde all'inchiostro con cui è stampato: per esempio la parola «rosso» scritta in blu. Nel dire il colore si impiega più tempo e si sbaglia più spesso. È semplicemente il cervello che impiega più tempo a elaborare l'informazione.",
   "de": "Der Stroop-Effekt ist die verlängerte Reaktionszeit bei widersprüchlichen Reizen. Er tritt auf, wenn der Name einer Farbe nicht zur Druckfarbe passt – etwa das Wort „rot“ in blauer Tinte. Soll man die Farbe nennen, dauert es länger und man macht mehr Fehler. Das Gehirn braucht schlicht mehr Zeit, um die Information zu verarbeiten."
  }
 },

   "fr": "L'astuce fonctionne parce que la vitre avant est à la fois partiellement transparente et partiellement réfléchissante, tandis que la vitre du fond est un simple miroir. Bien que l'installation ne fasse que 25 cm de profondeur, la combinaison des deux verres crée la sensation d'infini : la lumière rebondit et les reflets se répètent dans une profondeur exagérée.",
   "it": "Il trucco funziona perché il vetro frontale è insieme parzialmente trasparente e parzialmente riflettente, mentre quello di fondo è un semplice specchio. Anche se l'installazione è profonda solo 25 cm, unendo i due tipi di vetro si ottiene la sensazione di infinito: la luce rimbalza e i riflessi si ripetono in una profondità esagerata.",

 },

   "de": "An dem Punkt, an dem die Kugel ruhig hängt, treffen sich die vom Spiegel zurückgeworfenen Lichtstrahlen nie – ein scharfes Bild kann nicht entstehen. Nähert sich die Kugel dem Spiegel, sind Kugel und Spiegelbild gleich; entfernt sie sich, wirkt das Bild größer. Schwingt sie aber über ihren Ruhepunkt hinaus, kippt das Bild plötzlich um: Am Hohlspiegel kreuzen sich die Strahlen im Brennpunkt und erzeugen ein kopfstehendes Bild."
  }
 },
 "Clone Table": {
  "todo": {
   "es": "Siéntate a la mesa y observa a la gente que te rodea. ¿Notas algo raro? Mira a quienes están sentados contigo: verás que estás en muy buena compañía. Consejo: para que salga perfecta, quien haga la foto debe ponerse en el punto marcado y «esconderse» detrás de ti.",
   "ca": "Seu a la taula i observa la gent del teu voltant. Notes alguna cosa estranya? Mira qui seu amb tu: veuràs que estàs en molt bona companyia. Consell: perquè surti perfecta, qui faci la foto s'ha de posar al punt marcat i «amagar-se» darrere teu.",
   "en": "Sit down at the table and observe the crowd around you. Do you notice anything strange? Now look at the people sitting with you — you'll see that you're in good company! Tip: for the best result, the person taking the photo should stand on the photo point and 'hide' behind you.",
   "fr": "Asseyez-vous à la table et observez les gens autour de vous. Rien d'étrange ? Regardez ceux qui sont assis avec vous : vous êtes en excellente compagnie. Astuce : pour un résultat parfait, la personne qui photographie doit se placer sur le point marqué et se « cacher » derrière vous.",
   "it": "Siediti al tavolo e osserva le persone intorno a te. Noti qualcosa di strano? Guarda chi è seduto con te: sei in ottima compagnia. Consiglio: per una foto perfetta, chi scatta deve mettersi sul punto segnato e «nascondersi» dietro di te.",
   "de": "Setz dich an den Tisch und sieh dir die Runde an. Fällt dir etwas auf? Schau, wer da mit dir sitzt – du bist in bester Gesellschaft. Tipp: Für das beste Ergebnis stellt sich die fotografierende Person auf den markierten Punkt und „versteckt“ sich hinter dir."
  },
  "info": {
   "es": "Lo que parece una mesa redonda con una lámpara flotando encima es en realidad un segmento de mesa con espejos colocados estratégicamente, que crean el efecto paradójico de una mesa completa.",
   "ca": "El que sembla una taula rodona amb un llum flotant a sobre és en realitat un segment de taula amb miralls col·locats estratègicament, que creen l'efecte paradoxal d'una taula sencera.",
   "en": "What looks like a round table with a lamp floating above is simply a segment of a table with strategically positioned mirrors creating the paradoxical effect of a round table.",
   "fr": "Ce qui ressemble à une table ronde surmontée d'une lampe flottante n'est qu'un segment de table entouré de miroirs bien placés, qui créent l'effet paradoxal d'une table entière.",
   "it": "Quello che sembra un tavolo rotondo con una lampada sospesa è solo un segmento di tavolo con specchi posizionati ad arte, che creano l'effetto paradossale di un tavolo intero.",
   "de": "Was wie ein runder Tisch mit schwebender Lampe aussieht, ist nur ein Tischsegment mit geschickt platzierten Spiegeln, die den paradoxen Eindruck eines ganzen Tisches erzeugen."
  }
 },
 "Symmetry Room": {
  "todo": {
   "es": "Ve hasta la pared del fondo y usa la escalerilla escondida para que parezca que levitas. También puedes aparentar que tienes dos cabezas si alguien te hace la foto desde el punto marcado.",
   "ca": "Ves fins a la paret del fons i fes servir l'escaleta amagada perquè sembli que levites. També pots aparentar que tens dos caps si algú et fa la foto des del punt marcat.",
   "en": "Go to the back wall and use the hidden ladder to create the appearance that levitation is possible. You can also look like you have two heads when someone takes a photo from the photo point.",
   "fr": "Allez au mur du fond et servez-vous de l'échelle cachée pour donner l'impression de léviter. Vous pouvez aussi sembler avoir deux têtes si quelqu'un vous photographie depuis le point marqué.",
   "it": "Vai alla parete di fondo e usa la scaletta nascosta per sembrare che levitino. Puoi anche sembrare di avere due teste se qualcuno ti fotografa dal punto segnato.",
   "de": "Geh zur Rückwand und nutze die versteckte Leiter, damit es aussieht, als würdest du schweben. Du kannst auch zwei Köpfe zu haben scheinen, wenn jemand vom Fotopunkt aus auslöst."
  },
  "info": {
   "es": "Esta sala juega con un reflejo sencillo. Al principio ves una habitación vacía, pero al entrar te das cuenta de que una de las paredes no está realmente ahí: es un reflejo en el espejo. Al fondo, un pequeño hueco te permite esconderte en parte. Las partes del cuerpo que no quedan ocultas se reflejan, y eso te da todo tipo de posibilidades para jugar mientras te mueves.",
   "ca": "Aquesta sala juga amb un reflex senzill. Al principi veus una habitació buida, però en entrar t'adones que una de les parets no hi és realment: és un reflex al mirall. Al fons, un petit buit et permet amagar-te en part. Les parts del cos que no queden ocultes es reflecteixen, i això et dona tota mena de possibilitats per jugar mentre et mous.",
   "en": "This room plays with a simple reflection. At first, you see an empty room, but stepping inside, you realize that one of the walls is actually not there. It's just a reflection in the mirror. At the end of the room, a small niche gives you the opportunity to partially hide. The parts of the body that are not hidden are reflected, giving you all kinds of possibilities to play with as you move around.",
   "fr": "Cette salle joue avec un simple reflet. Au début, vous voyez une pièce vide, mais en entrant vous comprenez que l'un des murs n'existe pas : c'est un reflet. Au fond, une petite niche permet de se cacher en partie. Les parties du corps non cachées se reflètent, ce qui ouvre toutes sortes de possibilités de jeu.",
   "it": "Questa sala gioca con un semplice riflesso. All'inizio vedi una stanza vuota, ma entrando capisci che una delle pareti non c'è: è un riflesso nello specchio. In fondo, una piccola nicchia ti permette di nasconderti in parte. Le parti del corpo che restano scoperte si riflettono, e questo apre ogni genere di possibilità mentre ti muovi.",
   "de": "Dieser Raum spielt mit einer einfachen Spiegelung. Zuerst siehst du ein leeres Zimmer, doch beim Hineingehen merkst du: Eine der Wände ist gar nicht da, sie ist nur ein Spiegelbild. Am Ende des Raums kannst du dich in einer kleinen Nische teilweise verstecken. Die nicht verborgenen Körperteile werden gespiegelt – das eröffnet allerlei Spielraum, während du dich bewegst."
  }
 },

 "Face Blender": {
  "todo": {
   "es": "Coge a alguien y poneos a los dos lados del espejo. Alinead vuestras caras para ver qué aspecto tendrías con la nariz de la otra persona. ¡Y ahora la foto! Consejo: sale mejor si os la hace un tercero desde un lado.",
   "ca": "Agafa algú i poseu-vos als dos costats del mirall. Alineeu les vostres cares per veure quin aspecte tindries amb el nas de l'altra persona. I ara la foto! Consell: surt millor si us la fa un tercer des d'un costat.",
   "en": "Take a friend and stand on opposite sides of the mirror. Align your faces to see how you'd look with your friend's nose. Now, take a picture! Tip: it's easier to have someone else take the photo of you from an angle.",
   "fr": "Placez-vous de part et d'autre du miroir avec quelqu'un. Alignez vos visages pour voir de quoi vous auriez l'air avec le nez de l'autre. Et maintenant, la photo ! Astuce : c'est plus facile si une troisième personne la prend de côté.",
   "it": "Mettetevi ai due lati dello specchio con qualcuno. Allineate i volti per vedere come sareste con il naso dell'altro. E ora la foto! Consiglio: viene meglio se la scatta una terza persona di lato.",
   "de": "Stellt euch zu zweit auf beide Seiten des Spiegels. Richtet eure Gesichter so aus, dass ihr seht, wie ihr mit der Nase des anderen ausseht. Und jetzt das Foto! Tipp: Besser, wenn jemand Drittes seitlich auslöst."
  },
  "info": {
   "es": "El mezclador de caras está hecho de espejos en forma de tiras colocadas a intervalos iguales. En los espejos ves tu reflejo, pero por los huecos ves lo que hay detrás de la pieza. Te vas a quedar de piedra con lo que pasa cuando otra persona se pone al otro lado.",
   "ca": "El barrejador de cares està fet de miralls en forma de tires col·locades a intervals iguals. Als miralls hi veus el teu reflex, però pels buits hi veus el que hi ha darrere de la peça. Et quedaràs de pedra amb el que passa quan una altra persona es posa a l'altre costat.",
   "en": "The face blender consists of strip-shaped mirrors arranged in equal intervals. In the mirrors, you see your reflection, but through the gaps you see whatever is behind the exhibit. You'll be amazed at what happens when another person stands on the other side!",
   "fr": "Le mélangeur de visages est fait de miroirs en bandes disposées à intervalles réguliers. Dans les miroirs, vous voyez votre reflet ; entre les bandes, vous voyez ce qui se trouve derrière. L'effet est saisissant quand quelqu'un se place de l'autre côté.",
   "it": "Il miscelatore di volti è fatto di specchi a strisce disposte a intervalli uguali. Negli specchi vedi il tuo riflesso, ma attraverso le fessure vedi ciò che sta dietro. L'effetto è sorprendente quando qualcuno si mette dall'altra parte.",
   "de": "Der Face Blender besteht aus streifenförmigen Spiegeln in gleichmäßigen Abständen. In den Spiegeln siehst du dein eigenes Bild, durch die Lücken dagegen, was hinter dem Exponat liegt. Was passiert, wenn jemand auf der anderen Seite steht, wird dich umhauen."
  }
 },
 "Ames Room": {

   "it": "La prima persona si mette nell'angolo sinistro della stanza, la seconda a destra. Guardate lo schermo all'interno e notate la differenza. La terza scatta le foto dalla finestra, dal punto segnato all'esterno. Questa stanza sembra normale vista dalla finestra?",

   "en": "When you enter, you can see that one back corner is farther away than the other and that the floor and ceiling are sloped. The room appears to be cubic when viewed from the marked spot, and objects inside seem to be bigger and smaller than they are as they move through the space.",

  }
 },
 "Infinity Well": {
  "todo": {
   "es": "Mira dentro del pozo. ¿Qué profundidad tiene? ¿Te atreves a ponerte encima?",
   "ca": "Mira dins del pou. Quina profunditat té? T'atreveixes a posar-t'hi a sobre?",
   "en": "Look inside the well. How deep is it? Do you dare stand on it?",
   "fr": "Regardez dans le puits. Quelle profondeur fait-il ? Osez-vous marcher dessus ?",
   "it": "Guarda dentro il pozzo. Quanto è profondo? Hai il coraggio di salirci sopra?",
   "de": "Schau in den Brunnen. Wie tief ist er? Traust du dich, darauf zu stehen?"
  },
  "info": {
   "es": "Ponerte sobre el pozo puede resultar muy incómodo por la sensación de profundidad. Sin embargo, el pozo sólo tiene 40 cm de hondo. La combinación de dos superficies de cristal planas distintas crea la ilusión de profundidad: el cristal exterior, parcialmente transparente y parcialmente reflectante, deja pasar sólo una parte de la luz, mientras que el interior es un espejo. Esas dos láminas producen el efecto paradójico de profundidad infinita.",
   "ca": "Posar-te sobre el pou pot resultar molt incòmode per la sensació de profunditat. Tanmateix, el pou només té 40 cm de fondària. La combinació de dues superfícies de vidre planes diferents crea la il·lusió de profunditat: el vidre exterior, parcialment transparent i parcialment reflectant, deixa passar només una part de la llum, mentre que l'interior és un mirall. Aquestes dues làmines produeixen l'efecte paradoxal de profunditat infinita.",
   "en": "Standing on the well can make you feel very uncomfortable because of the feeling of depth. However, the well is only 16 inches (40 cm) deep. A combination of two different planar glass surfaces creates the illusion of depth. The partly transparent and partly reflective outer glass allows only a certain amount of light to pass, while the inside glass is a mirror. These two glass sheets create the paradoxical effect of infinite depth.",
   "fr": "Se tenir sur le puits peut être très déstabilisant à cause de la sensation de profondeur. Pourtant, il ne fait que 40 cm. La combinaison de deux surfaces de verre planes crée cette illusion : le verre extérieur, partiellement transparent et réfléchissant, ne laisse passer qu'une partie de la lumière, tandis que le verre intérieur est un miroir. Ces deux plaques produisent l'effet paradoxal d'une profondeur infinie.",
   "it": "Stare sul pozzo può essere molto scomodo per la sensazione di profondità. Eppure il pozzo è profondo solo 40 cm. La combinazione di due superfici di vetro piane crea l'illusione: il vetro esterno, in parte trasparente e in parte riflettente, lascia passare solo una parte della luce, mentre quello interno è uno specchio. Queste due lastre producono l'effetto paradossale di profondità infinita.",
   "de": "Auf dem Brunnen zu stehen kann wegen des Tiefengefühls sehr unangenehm sein. Dabei ist er nur 40 cm tief. Die Illusion entsteht durch zwei verschiedene ebene Glasflächen: Das äußere Glas ist teils durchlässig, teils spiegelnd und lässt nur einen Teil des Lichts hindurch, das innere ist ein Spiegel. Zusammen erzeugen sie den paradoxen Eindruck unendlicher Tiefe."
  }
 },

 "True Mirror": {

   "en": "Look at the mirror in front of you and raise your right hand. Notice something weird? Try spinning the mirror and see what happens.",
   "fr": "Regardez le miroir devant vous et levez la main droite. Rien d'étrange ? Essayez de faire tourner le miroir et observez.",
   "it": "Guarda lo specchio davanti a te e alza la mano destra. Noti qualcosa di strano? Prova a girare lo specchio e osserva.",

  "info": {
   "es": "Un espejo verdadero (o espejo no inversor) muestra a su sujeto desde el punto de vista del propio espejo, sin ninguna inversión. A diferencia de un espejo normal, si levantas la mano derecha la verás en el lado opuesto del reflejo. Se consigue uniendo dos espejos en ángulo de 90 grados.",
   "ca": "Un mirall veritable (o mirall no inversor) mostra el seu subjecte des del punt de vista del mateix mirall, sense cap inversió. A diferència d'un mirall normal, si aixeques la mà dreta la veuràs al costat oposat del reflex. S'aconsegueix unint dos miralls en angle de 90 graus.",
   "en": "A true mirror (or non-reversing mirror) presents its subject from the mirror's point of view without any reversals. Unlike a regular mirror, if you hold up your right hand, you will see it on the opposite side of the reflection. This is achieved by joining two mirrors at a 90-degree angle.",
   "fr": "Un vrai miroir (ou miroir non inverseur) montre son sujet du point de vue du miroir, sans aucune inversion. Contrairement à un miroir ordinaire, si vous levez la main droite, vous la verrez du côté opposé. On l'obtient en joignant deux miroirs à 90 degrés.",
   "it": "Uno specchio vero (o specchio non invertente) mostra il soggetto dal punto di vista dello specchio, senza inversioni. A differenza di uno specchio normale, se alzi la mano destra la vedrai dal lato opposto del riflesso. Si ottiene unendo due specchi a 90 gradi.",
   "de": "Ein echter Spiegel (nicht umkehrender Spiegel) zeigt sein Gegenüber aus Sicht des Spiegels, ganz ohne Seitenverkehrung. Anders als im normalen Spiegel siehst du die erhobene rechte Hand auf der gegenüberliegenden Seite. Möglich macht das die Verbindung zweier Spiegel im 90-Grad-Winkel."
  }
 },

 "Colored Shadow Room": {
  "todo": {
   "es": "Asómate: ¿de qué color es la pared? Ahora mira al lado contrario y verás tres focos. ¿De qué colores son? Entra en la sala, ponte delante del foco mirando a la pared de proyección. ¿Y ahora qué ves?",
   "ca": "Treu el cap: de quin color és la paret? Ara mira al costat contrari i veuràs tres focus. De quins colors són? Entra a la sala, posa't davant del focus mirant a la paret de projecció. I ara què hi veus?",
   "en": "Take a look inside — what colour is the wall? Now look on the opposite side and you'll see three spotlights. What colours are they? Enter the room and stand in front of the spotlight, facing the projection wall, and what do you see now?",
   "fr": "Jetez un œil : de quelle couleur est le mur ? Regardez maintenant du côté opposé, vous verrez trois projecteurs. De quelles couleurs sont-ils ? Entrez, placez-vous devant le projecteur face au mur de projection : que voyez-vous ?",
   "it": "Dai un'occhiata: di che colore è la parete? Ora guarda dal lato opposto e vedrai tre fari. Di che colore sono? Entra, mettiti davanti al faro rivolto verso la parete di proiezione: che cosa vedi adesso?",
   "de": "Schau hinein: Welche Farbe hat die Wand? Blick nun zur anderen Seite – dort stehen drei Scheinwerfer. Welche Farben haben sie? Geh hinein, stell dich vor den Scheinwerfer mit Blick zur Projektionswand. Was siehst du jetzt?"

  "info": {
   "es": "La luz se compone de tres colores: rojo, verde y azul. Si tres focos de esos colores enfocan el mismo punto con la misma intensidad, los haces se combinan en un único haz blanco. Pero si bloqueas uno de los colores, los otros dos forman una sombra de un color secundario mezclado.",
   "ca": "La llum es compon de tres colors: vermell, verd i blau. Si tres focus d'aquests colors enfoquen el mateix punt amb la mateixa intensitat, els feixos es combinen en un únic feix blanc. Però si bloqueges un dels colors, els altres dos formen una ombra d'un color secundari barrejat.",
   "en": "Light consists of three colours: red, green, and blue. If three spotlights of these colours focus on the same point with the same intensity, the beam will come together into one white beam. But if you block one of the colours, the other two form a shadow in a mixed secondary colour.",
   "fr": "La lumière se compose de trois couleurs : rouge, vert et bleu. Si trois projecteurs de ces couleurs éclairent le même point avec la même intensité, les faisceaux se combinent en un faisceau blanc. Mais si vous bloquez l'une des couleurs, les deux autres forment une ombre d'une couleur secondaire mélangée.",
   "it": "La luce è composta da tre colori: rosso, verde e blu. Se tre fari di questi colori illuminano lo stesso punto con la stessa intensità, i fasci si uniscono in un unico fascio bianco. Ma se blocchi uno dei colori, gli altri due formano un'ombra di un colore secondario misto.",
   "de": "Licht besteht aus drei Farben: Rot, Grün und Blau. Richten drei Scheinwerfer dieser Farben mit gleicher Stärke auf denselben Punkt, ergeben die Strahlen zusammen weißes Licht. Blockierst du eine Farbe, bilden die beiden anderen einen Schatten in einer gemischten Sekundärfarbe."
  }
 },
 "PDX Sofa": {
  "todo": {
   "es": "¿Ves los huecos del sofá? La primera persona mete las piernas por el agujero de la izquierda. La segunda mete la cabeza y el torso en el de la derecha. Y la tercera hace las fotos más locas.",
   "ca": "Veus els buits del sofà? La primera persona fica les cames pel forat de l'esquerra. La segona fica el cap i el tors al de la dreta. I la tercera fa les fotos més boges.",

   "it": "Vedi i fori del divano? La prima persona infila le gambe nel foro di sinistra. La seconda infila testa e busto in quello di destra. La terza scatta le foto più assurde.",
   "de": "Siehst du die Öffnungen im Sofa? Person eins steckt die Beine durch die linke Öffnung, Person zwei Kopf und Oberkörper durch die rechte. Person drei macht die verrücktesten Fotos."

   "ca": "Un gest tan simple com amagar part del cos als buits dissenyats d'un sofà pot portar-te a un món paradoxal en què sembles una fallada de la matriu. La part de baix està asseguda a la dreta, mentre el tors i el cap semblen estar asseguts a un metre. En realitat són dues persones amagant parts del seu cos al sofà, donant la impressió que una s'ha fet trossos.",
   "en": "A simple action such as hiding part of your body in the specially designed holes of a sofa can lead to a paradoxical world where you look like a glitch in the matrix. The lower part of you is sitting on the right, whereas your torso and head appear to be sitting a meter away. In reality, two people are hiding parts of their bodies in the sofa, giving the impression that one person has gone to pieces!",
   "fr": "Un geste aussi simple que cacher une partie de son corps dans les ouvertures d'un canapé suffit à créer un monde paradoxal où l'on ressemble à un bug de la matrice. Le bas du corps est assis à droite, tandis que le torse et la tête semblent assis un mètre plus loin. En réalité, deux personnes cachent des parties de leur corps dans le canapé, donnant l'impression que quelqu'un est tombé en morceaux.",
   "it": "Un gesto semplice come nascondere parte del corpo nei fori di un divano può portarti in un mondo paradossale in cui sembri un errore della matrice. La parte inferiore è seduta a destra, mentre busto e testa sembrano seduti un metro più in là. In realtà sono due persone che nascondono parti del corpo nel divano, dando l'impressione che una sia andata in pezzi.",
   "de": "Eine so einfache Handlung wie das Verstecken von Körperteilen in den eigens gestalteten Öffnungen eines Sofas führt in eine paradoxe Welt, in der man wie ein Fehler in der Matrix aussieht. Der Unterkörper sitzt rechts, Oberkörper und Kopf scheinen einen Meter weiter zu sitzen. In Wirklichkeit verstecken zwei Personen Teile ihres Körpers im Sofa – es wirkt, als wäre jemand in Stücke zerfallen."
  }
 },

 "PDX Box": {
  "todo": {

   "en": "Look into the magic box from both sides. Notice any differences in its appearance? Have you ever heard of Schrödinger's cat?",

   "de": "Schau von beiden Seiten in die Zauberkiste. Fällt dir ein Unterschied auf? Hast du schon vom Schrödingers Kater gehört?"

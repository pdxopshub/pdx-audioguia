   case "mirror": return `<rect x="30" y="13" width="60" height="64" fill="none" stroke="${c}" stroke-width="2.6"/>
     <path d="M37 71 L83 19 M50 71 L83 34" stroke="${c}" stroke-width="2"/>`;
   case "camo": return Array.from({length:12},(_,i)=>
     (i%2?`<ellipse cx="${(i*37)%112+6}" cy="${(i*53)%78+6}" rx="${10+(i%3)*5}" ry="${8+(i%4)*4}" fill="${c}"/>`
         :`<ellipse cx="${(i*37)%112+6}" cy="${(i*53)%78+6}" rx="${10+(i%3)*5}" ry="${8+(i%4)*4}" fill="none" stroke="${c}" stroke-width="2"/>`)).join("");
   case "sofa": return `<rect x="22" y="44" width="76" height="22" fill="${c}"/>
     <rect x="22" y="29" width="14" height="22" fill="none" stroke="${c}" stroke-width="2.2"/>
     <rect x="84" y="29" width="14" height="22" fill="none" stroke="${c}" stroke-width="2.2"/>`;
   case "table": return `<rect x="18" y="31" width="84" height="7" fill="${c}"/>
     <path d="M28 38 L21 75 M92 38 L105 75" stroke="${c}" stroke-width="3.6" fill="none"/>`;
   case "cat": return `<rect x="33" y="33" width="54" height="41" fill="none" stroke="${c}" stroke-width="2.6"/>
     <path d="M33 33 L46 19 L74 19 L87 33" fill="none" stroke="${c}" stroke-width="2.6"/>
     <circle cx="51" cy="53" r="4" fill="${c}"/><circle cx="69" cy="53" r="4" fill="${c}"/>`;
   case "rev": return `<path d="M15 73 L105 73 L88 23 L32 23 Z" fill="none" stroke="${c}" stroke-width="2.6"/>
     <rect x="46" y="23" width="28" height="16" fill="${c}"/>`;
   case "chair": return `<rect x="29" y="23" width="27" height="27" fill="${c}"/>
     <path d="M72 46 L72 77 M97 46 L97 77 M68 46 L101 46" stroke="${c}" stroke-width="3.2" fill="none"/>`;
   case "zoe": return `<ellipse cx="60" cy="45" rx="40" ry="26" fill="none" stroke="${c}" stroke-width="2.6"/>
     ${Array.from({length:9},(_,i)=>`<rect x="${(23+i*8.6).toFixed(1)}" y="27" width="2.8" height="36" fill="${c}"/>`).join("")}`;
   case "kaleido": return Array.from({length:6},(_,i)=>{
     const p=`60,45 ${(60+34*Math.cos(i*Math.PI/3)).toFixed(1)},${(45+28*Math.sin(i*Math.PI/3)).toFixed(1)} ${(60+34*Math.cos((i+1)*Math.PI/3)).toFixed(1)},${(45+28*Math.sin((i+1)*Math.PI/3)).toFixed(1)}`;
     return i%2?`<polygon points="${p}" fill="${c}"/>`
               :`<polygon points="${p}" fill="none" stroke="${c}" stroke-width="2"/>`;}).join("");
   case "anamorph": return `<path d="M8 82 q34 -62 104 -54" stroke="${c}" stroke-width="3.4" fill="none"/>
     <path d="M20 87 q34 -50 92 -42" stroke="${c}" stroke-width="3.4" fill="none"/>
     <circle cx="97" cy="25" r="5" fill="${c}"/>`;
   default: return `<circle cx="60" cy="45" r="24" fill="${c}"/>`;
  }
}

let drawStyle="bloque";
let htSeq=0;
function art(kind,c,style){
  const st=style||drawStyle;
  let s=shapes(kind,c), defs="";
  if(st==="linea"){
    s=s.replace(/fill="(?!none)[^"]*"/g,`fill="none" stroke="${c}" stroke-width="2.2"`);
  }else if(st==="duo"){
    const id="ht"+(++htSeq);
    defs=`<defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="${c}"/><circle cx="2.5" cy="2.5" r="1.75" fill="${BG}"/>
      </pattern></defs>`;
    let flip=false;
    s=s.replace(/fill="(?!none)[^"]*"/g,()=>{flip=!flip;
      return flip?`fill="url(#${id})"`:`fill="${c}"`;});
  }
  return `<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg" role="img">${defs}<rect width="120" height="90" fill="${BG}"/>${s}</svg>`;
}

/* ── state ──────────────────────────────────────────────────── */
let lang="es", tab="route", idx=-1, seen=new Set();
const el=id=>document.getElementById(id);
const L=()=>UI[lang];
const rm=s=>ROOMS[s.r];
const esc=t=>String(t).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const store={
  get(k,d){try{const v=localStorage.getItem("pdx2:"+k);return v===null?d:JSON.parse(v);}catch(_){return d;}},
  set(k,v){try{localStorage.setItem("pdx2:"+k,JSON.stringify(v));}catch(_){}}
};

/* ── render ─────────────────────────────────────────────────── */
function renderRoute(){
  let h=`<div class="progress lbl">
      <div class="bar"><i style="width:${seen.size/S.length*100}%"></i></div>
      <span>${seen.size}/${S.length} ${L().visited}</span>
      ${seen.size?`<button id="reset" class="lbl">${L().reset}</button>`:""}
    </div>`;
  let cur=null;
  S.forEach((s,i)=>{
    if(s.r!==cur){
      cur=s.r;
      const k=S.filter(x=>x.r===cur).length;
      h+=`<div class="sechead"><b style="background:${ROOMS[cur].c};color:${ROOMS[cur].ink}">${ROOMS[cur].n[lang]}</b>
          <i></i><em class="lbl">${k} ${L().stops}</em></div>`;
    }
    h+=`<button class="stop${seen.has(i)?" done":""}" data-i="${i}">
          <span class="thumb">${s.img?`<img src="${s.img}" alt="" loading="lazy" decoding="async">`:art(s.art,rm(s).tc)}</span>
          <span class="num"${s.n?"":` style="background:${rm(s).tc}"`}>${s.n||"·"}</span>
          <span class="meta"><b>${esc(s.t)}</b>
            <span>${ROOMS[s.r].n[lang]}${s.sub?" · "+esc(s.sub):""}</span></span>
          <span class="tick">✓</span>
        </button>`;
  });
  el("main").innerHTML=h;
}

function renderRooms(){
  const order=[...new Set(S.map(s=>s.r))];
  let h=`<div style="height:10px"></div>`;
  order.forEach(rid=>{
    const list=S.filter(s=>s.r===rid), named=list.filter(s=>s.n).map(s=>s.n);
    h+=`<button class="roomcard" data-room="${rid}">
          <b style="background:${ROOMS[rid].c};color:${ROOMS[rid].ink}">${ROOMS[rid].n[lang]}</b>
          <span>${list.length} ${L().stops}${named.length?" · "+named.join(" · "):""}</span>
          <span class="pips">${list.map(()=>`<i style="background:${ROOMS[rid].c}"></i>`).join("")}</span>
        </button>`;
  });
  el("main").innerHTML=h;
}

const STYLES=[
  {id:"bloque", n:{es:"Bloques planos",ca:"Blocs plans",en:"Flat blocks"},
   s:{es:"Formas macizas, cero sombras. Es el estilo de la marca.",
      ca:"Formes massisses, zero ombres. És l'estil de la marca.",
      en:"Solid shapes, no shading. The brand's own style."}},
  {id:"linea", n:{es:"Línea",ca:"Línia",en:"Line"},
   s:{es:"Sólo contorno. Más técnico y más sobrio.",
      ca:"Només contorn. Més tècnic i més sobri.",
      en:"Outline only. More technical, more restrained."}},
  {id:"duo", n:{es:"Semitono",ca:"Semitò",en:"Halftone"},
   s:{es:"Trama de puntos tipo serigrafía. Más gráfico.",
      ca:"Trama de punts tipus serigrafia. Més gràfic.",
      en:"Screen-print dot texture. More graphic."}}
];
function photoSlot(){return `<svg viewBox="0 0 60 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="80" fill="#15151c"/><rect x="19" y="33" width="22" height="17" fill="none" stroke="#ffffff30" stroke-width="1.4"/><circle cx="30" cy="41.5" r="5" fill="none" stroke="#ffffff30" stroke-width="1.4"/><rect x="25" y="29" width="10" height="4" fill="none" stroke="#ffffff30" stroke-width="1.4"/></svg>`;}
const PAL=[["#FFDB00","102"],["#FB48C4","813"],["#3737FF","2728"],
           ["#00FFB9","3385"],["#FF4C2A","Warm Red"]];

function renderStyle(){
  let h=`<div style="height:18px"></div>
    <h2 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em">${L().styleTitle}</h2>
    <p style="margin:10px 0 0;font-size:13.5px;line-height:1.55;color:var(--grey);max-width:50ch">${L().styleIntro}</p>
    <div class="styleGrid">`;
  STYLES.forEach(st=>{
    h+=`<button data-style="${st.id}" aria-pressed="${drawStyle===st.id}">
        <span class="sv">${art("balloon",C.yellow,st.id)}</span>
        <b>${st.n[lang]}</b><span>${st.s[lang]}</span></button>`;
  });
  h+=`</div><div class="note">${L().styleNote}</div>
    <div style="height:26px"></div>
    <div class="lbl" style="color:var(--muted)">${L().palette}</div>
    <div style="display:flex;margin-top:10px;height:54px">
      ${PAL.map(([c])=>`<div style="flex:1;background:${c}"></div>`).join("")}</div>
    <div style="display:flex;margin-top:6px;gap:0">
      ${PAL.map(([c,p])=>`<div class="lbl" style="flex:1;color:var(--muted);font-size:8.5px">${p}</div>`).join("")}</div>
    <div style="height:20px"></div>`;
  el("main").innerHTML=h;
}

function render(){
  el("tabRoute").textContent=L().route;
  el("tabRooms").textContent=L().rooms;
  el("tabStyle").textContent=L().style;
  el("backTxt").textContent=L().route;
  tab==="route"?renderRoute():tab==="rooms"?renderRooms():renderStyle();
}

function openStop(i){
  idx=Math.max(0,Math.min(S.length-1,i));
  const s=S[idx], R=rm(s), last=idx===S.length-1;
  el("dcount").textContent=`${idx+1} ${L().of} ${S.length}`;

  const how = s.how
    ? `<div class="howrow">${s.how.map((x,k)=>`
        <div class="howcard">
          <div class="ph"><span class="howstep">${k+1}</span>
            ${x.img?`<img src="${x.img}" alt="" loading="lazy" decoding="async">`:photoSlot()}
            <em>${L().photoPend}</em></div>
          <b>${esc(x.t[lang])}</b><span>${esc(x.s[lang])}</span>
        </div>`).join("")}</div>`
    : `<div class="pending">${L().pendHow}</div>`;

  el("dbody").innerHTML=`
    <div class="hero">
      ${s.img?`<img src="${s.img}" alt="" loading="lazy" decoding="async">`:art(s.art,R.tc)}
      <span class="tag lbl">${s.img?"":L().photo}</span></div>

    <div class="dtext">
      <span class="droom lbl" style="background:${R.c};color:${R.ink}">${R.n[lang]}</span>
      <h1>${s.n?`<span class="hn">${s.n}</span>`:""}${esc(s.t)}</h1>
      ${s.sub?`<p class="sub">${esc(s.sub)}</p>`:""}
    </div>

    <div class="block"><div class="lbl">${L().lblHook}</div>
      ${s.hook?`<p class="hook">${esc(s.hook[lang])}</p>`
              :`<div class="pending">${L().pendHook}</div>`}</div>

    ${s.d?`<div class="block"><div class="lbl">${L().lblInfo}</div>
      ${s.d[lang].split("\n\n").map(p=>`<p class="lead">${esc(p)}</p>`).join("")}</div>`:""}

    ${s.list?`<div class="block"><div class="lbl">${L().lblIncl}</div>
      <div class="chips">${s.list.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`:""}

    ${s.fotos&&s.fotos.length?`<div class="block"><div class="lbl">${L().lblFotos}</div>
      <div class="gal">${s.fotos.map(f=>`<img src="${f}" alt="" loading="lazy" decoding="async">`).join("")}</div>
      </div>`:""}

    <div class="block"><div class="lbl">${L().lblHow}</div>${how}</div>

    ${s.quiz?`<div class="block"><div class="quiz">
        <div class="lbl">${L().lblQuiz}</div>
        <p>${esc(s.quiz.q[lang])}</p>
        <button class="reveal" id="reveal">${L().reveal}</button>
        <p class="ans" id="ans" hidden>${s.quiz.a[lang]}</p>
      </div></div>`:""}

    <div style="height:30px"></div>`;

  el("dbody").scrollTop=0;
  el("prev").disabled = idx===0;
  el("next").disabled = last;
  el("nextTxt").textContent = last ? L().end : L().next;
  syncDone();
  el("detail").classList.add("open");
  el("detail").setAttribute("aria-hidden","false");
  const rv=el("reveal");
  if(rv) rv.onclick=()=>{el("ans").hidden=false; rv.hidden=true;};
}
function syncDone(){
  const on=seen.has(idx), b=el("done");
  b.textContent = on ? L().undone : L().done;
  b.dataset.on = on?"1":"0";
}
function closeStop(){
  el("detail").classList.remove("open");
  el("detail").setAttribute("aria-hidden","true");
  render();
}

/* ── events ─────────────────────────────────────────────────── */
el("main").addEventListener("click",e=>{
  const st=e.target.closest(".stop"); if(st) return openStop(+st.dataset.i);
  const sy=e.target.closest("[data-style]");
  if(sy){ drawStyle=sy.dataset.style; store.set("style",drawStyle); render(); return; }
  const rc=e.target.closest(".roomcard");
  if(rc){
    tab="route";
    document.querySelectorAll(".tabs button").forEach(c=>
      c.setAttribute("aria-selected",String(c.dataset.tab==="route")));
    render();
    const first=S.findIndex(s=>s.r===rc.dataset.room);
    requestAnimationFrame(()=>{
      const n=document.querySelector(`.stop[data-i="${first}"]`);
      n&&n.scrollIntoView({block:"center",behavior:"smooth"});});
    return;
  }
  if(e.target.id==="reset"){ seen=new Set(); store.set("seen",[]); render(); }
});

document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  tab=b.dataset.tab;
  [...e.currentTarget.children].forEach(c=>c.setAttribute("aria-selected",String(c===b)));
  el("main").scrollTop=0; render();
});

function setLang(l){
  lang=l; store.set("lang",l);
  document.querySelectorAll("[data-l]").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.l===l)));
  render();
  if(el("detail").classList.contains("open")) openStop(idx);
}
el("langs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(b) setLang(b.dataset.l);
});
el("gate").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  setLang(b.dataset.l); store.set("gate",1); el("gate").classList.add("hide");
});

el("back").onclick=closeStop;
el("prev").onclick=()=>openStop(idx-1);
el("next").onclick=()=>{ if(idx<S.length-1) openStop(idx+1); };
el("done").onclick=()=>{
  seen.has(idx)?seen.delete(idx):seen.add(idx);
  store.set("seen",[...seen]); syncDone();
};
addEventListener("keydown",e=>{
  if(!el("detail").classList.contains("open")) return;
  if(e.key==="ArrowRight"&&idx<S.length-1) openStop(idx+1);
  if(e.key==="ArrowLeft"&&idx>0) openStop(idx-1);
  if(e.key==="Escape") closeStop();
});

/* ── visor de fotos ─────────────────────────────────────────── */
(function(){
  let fotos=[], n=0;
  const box=el("lightbox"), img=el("lbImg"), cuenta=el("lbCount");
  function pinta(){
    img.src=fotos[n];
    cuenta.textContent = fotos.length>1 ? (n+1)+" / "+fotos.length : "";
    el("lbPrev").disabled = n===0;
    el("lbNext").disabled = n===fotos.length-1;
    el("lbPrev").hidden = el("lbNext").hidden = fotos.length<2;
  }
  function abre(lista, i){ fotos=lista; n=i; pinta(); box.hidden=false; }
  function cierra(){ box.hidden=true; img.removeAttribute("src"); }

  el("dbody").addEventListener("click", e=>{
    const t=e.target.closest(".hero, .gal img, .howcard .ph");
    if(!t) return;
    const todas=[...el("dbody").querySelectorAll(".hero img, .gal img, .howcard .ph img")]
      .map(i=>i.getAttribute("src")).filter(Boolean);
    const esta=(t.tagName==="IMG"?t:t.querySelector("img"));
    const url=esta&&esta.getAttribute("src");
    if(!url) return;
    abre(todas, Math.max(0, todas.indexOf(url)));
  });

  el("lbClose").onclick=cierra;
  el("lbPrev").onclick=()=>{ if(n>0){n--;pinta();} };
  el("lbNext").onclick=()=>{ if(n<fotos.length-1){n++;pinta();} };
  box.addEventListener("click", e=>{ if(e.target===box||e.target===img) cierra(); });
  addEventListener("keydown", e=>{
    if(box.hidden) return;
    if(e.key==="Escape") cierra();
    if(e.key==="ArrowRight"&&n<fotos.length-1){n++;pinta();}
    if(e.key==="ArrowLeft"&&n>0){n--;pinta();}
  }, true);
})();

seen=new Set(store.get("seen",[]));
drawStyle=store.get("style","bloque");
const sl=store.get("lang",null);
if(sl && store.get("gate",0)){
  lang=sl; el("gate").classList.add("hide");
  document.querySelectorAll("[data-l]").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
}
render();
</script>

<script>
/* Caché para el sótano y para quien repita visita. */
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* La barra del navegador se tiñe: azul en la bienvenida, negra dentro de la guía. */
(function () {
  var meta = document.getElementById("themeColor"), gate = document.getElementById("gate");
  if (!meta || !gate) return;
  var sync = function () {
    meta.setAttribute("content", "#3737FF");
  };
  try { new MutationObserver(sync).observe(gate, {attributes: true, attributeFilter: ["class"]}); }
  catch (_) {}
  sync();
})();

/* "Añadir a pantalla de inicio": sólo se ofrece a partir de la segunda visita,
   para no molestar a quien entra una vez y se va. */
(function () {
  var KEY = "pdx2:visitas", prompt = null;
  var n = 0;
  try { n = parseInt(localStorage.getItem(KEY) || "0", 10) + 1; localStorage.setItem(KEY, n); } catch (_) {}
  addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); prompt = e;
    if (n < 2) return;
    var bar = document.createElement("button");
    bar.textContent = "Instalar la guía como app";
    bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:60;border:0;" +
      "background:#FFDB00;color:#000;font:700 14px/1 'Plus Jakarta Sans',system-ui,sans-serif;" +
      "padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer";
    bar.onclick = function () { bar.remove(); prompt.prompt(); prompt = null; };
    document.body.appendChild(bar);
    setTimeout(function () { bar.remove(); }, 12000);
  });
})();
</script>
</body>

  "info": {
   "es": "La paradoja se vive a través del gato de Schrödinger, que parece estar vivo y muerto a la vez según el lado desde el que mires la caja. Esto es posible gracias al uso inteligente de espejos colocados en diagonal, que crean el efecto paradójico de múltiples perspectivas: dos objetos distintos ocupando exactamente el mismo espacio.",
   "ca": "La paradoxa es viu a través del gat de Schrödinger, que sembla estar viu i mort alhora segons el costat des del qual miris la caixa. Això és possible gràcies a l'ús intel·ligent de miralls col·locats en diagonal, que creen l'efecte paradoxal de múltiples perspectives: dos objectes diferents ocupant exactament el mateix espai.",
   "en": "The paradox is experienced through the observation of Schrödinger's cat, which appears to be both alive and dead depending on which side of the box you observe it from. This paradox is made possible by the clever use of diagonally positioned mirrors that creates a paradoxical effect of multiple perspectives, showing two different objects occupying the exact same space.",
   "fr": "Le paradoxe s'éprouve à travers le chat de Schrödinger, qui semble à la fois vivant et mort selon le côté d'où on l'observe. Cela tient à des miroirs placés en diagonale, qui créent l'effet paradoxal de perspectives multiples : deux objets différents occupant exactement le même espace.",
   "it": "Il paradosso si vive attraverso il gatto di Schrödinger, che sembra vivo e morto insieme a seconda del lato da cui guardi la scatola. È possibile grazie all'uso sapiente di specchi disposti in diagonale, che creano l'effetto paradossale di prospettive multiple: due oggetti diversi che occupano esattamente lo stesso spazio.",
   "de": "Das Paradox erlebt man an Schrödingers Kater, der je nach Betrachtungsseite zugleich lebendig und tot wirkt. Möglich wird das durch geschickt diagonal angeordnete Spiegel, die den paradoxen Effekt mehrerer Perspektiven erzeugen: zwei verschiedene Objekte am exakt selben Ort."
  }
 },
 "Beuchet Chair": {
  "todo": {
   "es": "Para que la paradoja funcione hacen falta tres personas y una cámara. La primera se pone en el punto de foto con la silla dentro del encuadre. La segunda se sienta o se pone de pie sobre la silla. La tercera se coloca en la posición marcada entre ambas. Cuando todo el mundo esté en su sitio: pose y foto.",
   "ca": "Perquè la paradoxa funcioni calen tres persones i una càmera. La primera es posa al punt de foto amb la cadira dins l'enquadrament. La segona s'asseu o es posa dreta sobre la cadira. La tercera es col·loca a la posició marcada entre totes dues. Quan tothom sigui al seu lloc: pose i foto.",
   "en": "For this paradox to work, you will need three people and a camera. Person number one should stand on the photo spot with the chair inside the frame, person number two should sit or stand on the chair, and person number three must stand in the marked position between both people. Once everyone is in place, strike a pose and snap a picture!",
   "fr": "Pour que le paradoxe fonctionne, il faut trois personnes et un appareil photo. La première se place sur le point photo avec la chaise dans le cadre, la deuxième s'assoit ou se tient sur la chaise, et la troisième se place à l'endroit marqué entre les deux. Une fois tout le monde en place : pose et photo !",
   "it": "Perché il paradosso funzioni servono tre persone e una fotocamera. La prima si mette sul punto foto con la sedia nell'inquadratura, la seconda si siede o sale sulla sedia, la terza si posiziona nel punto segnato tra le due. Quando tutti sono a posto: posa e scatto!",
   "de": "Damit das Paradox funktioniert, braucht ihr drei Personen und eine Kamera. Person eins stellt sich auf den Fotopunkt, sodass der Stuhl im Bild ist, Person zwei setzt oder stellt sich auf den Stuhl, Person drei nimmt die markierte Position zwischen beiden ein. Wenn alle stehen: posieren und auslösen!"
  },
  "info": {
   "es": "La persona número dos parece mucho más pequeña que la número tres. Los objetos sueltos del espacio parecen desperdigados, pero desde ciertos ángulos crean la ilusión de una silla. La persona número dos parece mucho más pequeña por el contexto de los objetos y por cómo están colocados. Ahora que sabes lo que pasa, prueba a sentarte en la silla y a jugar con las leyes de la percepción y las proporciones.",
   "ca": "La persona número dos sembla molt més petita que la número tres. Els objectes solts de l'espai semblen escampats, però des de certs angles creen la il·lusió d'una cadira. La persona número dos sembla molt més petita pel context dels objectes i per com estan col·locats. Ara que saps què passa, prova de seure a la cadira i de jugar amb les lleis de la percepció i les proporcions.",
   "en": "Person number two looks much smaller than person number three. The free-standing objects in the space look like they're scattered, but from specific angles, they create the illusion of a chair. Visitor number two looks so much smaller because of the context of the objects and how they are positioned. Now that you know what's going on, try to sit on the chair and play around with the laws of perception and size ratio!",
   "fr": "La personne numéro deux paraît beaucoup plus petite que la numéro trois. Les objets posés dans l'espace semblent éparpillés, mais sous certains angles ils forment l'illusion d'une chaise. La personne numéro deux paraît si petite à cause du contexte des objets et de leur disposition. Maintenant que vous savez, asseyez-vous sur la chaise et jouez avec les lois de la perception et des proportions !",
   "it": "La persona numero due sembra molto più piccola della numero tre. Gli oggetti liberi nello spazio sembrano sparsi, ma da certe angolazioni creano l'illusione di una sedia. La persona numero due sembra così piccola per via del contesto degli oggetti e di come sono disposti. Ora che sai come funziona, prova a sederti sulla sedia e a giocare con le leggi della percezione e delle proporzioni!",
   "de": "Person zwei wirkt viel kleiner als Person drei. Die frei stehenden Objekte im Raum sehen verstreut aus, erzeugen aus bestimmten Winkeln aber die Illusion eines Stuhls. Person zwei wirkt nur deshalb so klein, weil der Zusammenhang der Objekte und ihre Anordnung es so erscheinen lassen. Jetzt, wo du es weißt: Setz dich auf den Stuhl und spiel mit den Gesetzen der Wahrnehmung und den Größenverhältnissen!"

 },

 "Infinity Park": {

   "ca": "El truc és possible gràcies a un vidre concret que deixa passar un percentatge de llum essent alhora parcialment transparent i parcialment reflectant. En posar aquest vidre a totes les cares del parc s'aconsegueix la sensació de profunditat infinita, i amb ella la impressió d'un espai sense límits dins d'una geometria limitada.",

const OFICIAL = {
 "Ames Room": {
  "d": {
   "en": "Growing and shrinking in a room of distorted perspective may remind you of a scene from Lewis Carroll's Alice in Wonderland or in the Lord of the Rings trilogy, this trick is used to make the hobbits appear smaller than humans. The Ames room principle was widely used in TV and movie productions for special effects, to show actors in giant sizes next to actors in small sizes.\n\nIn the late 19th century, a gentleman named Hermann von Helmholtz had a great idea! What if a room could be distorted in some way but at the same time look like a completely normal rectangular room? In 1935, an ophthalmologist named Adelbert Ames had a similar idea and created the first-ever Ames room. Ames went beyond Helmholtz's concept and was the first to discover the impact of experience on perception.\n\nAnd so, the Ames room is built with both the floor and ceiling at an angle, which creates forced perspective and tricks the eye into thinking both sides of the room are the same. The actual shape of the room is a trapezium. This special shape is thought to remove all distance and not allow proper scaling of object size. The room creates the illusion of it being a dramatic disparity in size. The illusion leads the viewer to believe that the two people are in the same field of view when, in fact, the subject is much closer.\n\nIn the Paradox Ames Room exhibit, what is occurring is a mismatch between the physical stimuli and the perception of the individual. The mismatch is caused by an incorrect interpretation of information received by sensory organs. The moment light meets the retina, the process of seeing begins. The information from the retina - in the form of electrical signals - is sent via the optic nerve to other parts of the brain which process the image and allow us to see.\n\nWhat's kinda spookie is that the effect isn't always as obvious to those who are familiar with the person in the room; for example, a married couple may see less size distortion. This is called the Honi Phenomenon, named after a woman who observed both a stranger and her husband and observed a size distortion when it came to the stranger, but not when she observed her husband!",
   "es": "Crecer y encogerse en una habitación de perspectiva distorsionada puede recordarte a alguna escena de Alicia en el País de las Maravillas, de Lewis Carroll, o a una de la trilogía de El Señor de los Anillos, donde se utiliza este truco para hacer que los hobbits parezcan más pequeños que los humanos. El principio de la habitación de Ames se utilizó mucho en producciones televisivas y cinematográficas para efectos especiales, con el fin de mostrar actores de tallas gigantes junto a actores de tallas pequeñas.\n\nA finales del siglo XIX, un caballero llamado Hermann von Helmholtz tuvo una gran idea. ¿Qué pasaría si una habitación pudiera distorsionarse de alguna forma, pero al mismo tiempo parecer una habitación rectangular completamente normal? En 1935, un oftalmólogo llamado Adelbert Ames tuvo una idea similar y creó la primera sala Ames de la historia. Ames fue más allá del concepto de Helmholtz y fue el primero en descubrir el impacto de la experiencia en la percepción.\n\nAsí, la Habitación Ames está construida con el suelo y el techo en ángulo, lo que crea una perspectiva falsa y hace que el ojo piense que ambos lados de la habitación son iguales. La forma real de la sala es un trapecio. Se cree que esta forma especial elimina toda distancia y no permite ajustar correctamente el tamaño de los objetos. La habitación crea la ilusión de que su tamaño es muy dispar. La ilusión lleva al espectador a creer que las dos personas están en el mismo campo de visión cuando, en realidad, el sujeto está mucho más cerca.\n\nEn la Habitación Ames de Paradox, lo que se produce es un desajuste entre los estímulos físicos y la percepción del individuo. El desajuste se debe a una interpretación incorrecta de la información recibida por los órganos sensoriales. En el momento en que la luz entra en contacto con la retina, comienza el proceso de la visión. La información de la retina (en forma de señales eléctricas) se envía a través del nervio óptico a otras partes del cerebro que procesan la imagen y nos permiten ver.\n\nLo curioso es que el efecto no siempre es tan obvio para quienes están familiarizados con la persona que está en la habitación; por ejemplo, un matrimonio puede ver menos distorsión de tamaño. Es lo que se conoce como el Fenómeno Honi, llamado así por una mujer que observó tanto a un desconocido como a su marido y observó una distorsión de tamaño cuando se trataba del desconocido, ¡pero no cuando observaba a su marido!",
   "ca": "Créixer i encongir-se en una habitació de perspectiva distorsionada pot recordar-te a alguna escena d'Alícia al País de les Meravelles, de Lewis Carroll, o a una de la trilogia del Senyor dels Anells, on s'utilitza aquest truc per a fer que els hobbits semblin més petits que els humans. El principi de l'habitació d'Ames es va utilitzar molt en produccions televisives i cinematogràfiques per a efectes especials, amb la finalitat de mostrar actors de talles gegants al costat d'actors de talles petites.\n\nA la fi del segle XIX, un cavaller anomenat Hermann von Helmholtz va tenir una gran idea. Què passaria si una habitació pogués distorsionar-se d'alguna forma, però al mateix temps semblar una habitació rectangular completament normal? En 1935, un oftalmòleg anomenat Adelbert Ames va tenir una idea similar i va crear la primera sala Ames de la història. Ames va anar més enllà del concepte de Helmholtz i va ser el primer a descobrir l'impacte de l'experiència en la percepció.\n\nAixí, l'Habitació d'Ames està construïda amb el sòl i el sostre en angle, la qual cosa crea una perspectiva falsa i fa que l'ull pensi que tots dos costats de l'habitació són iguals. La forma real de la sala és un trapezi. Es creu que aquesta forma especial elimina tota distància i no permet ajustar correctament la grandària dels objectes. L'habitació crea la il·lusió que la seva grandària és molt dispar. La il·lusió porta a l'espectador a creure que les dues persones estan en el mateix camp de visió quan, en realitat, el subjecte està molt més a prop.\n\nA l'Habitació Ames de Paradox, el que es produeix és un desajustament entre els estímuls físics i la percepció de l'individu. El desajustament es deu a una interpretació incorrecta de la informació rebuda pels òrgans sensorials. En el moment en què la llum entra en contacte amb la retina, comença el procés de la visió. La informació de la retina (en forma de senyals elèctrics) s'envia a través del nervi òptic a altres parts del cervell que processen la imatge i ens permeten veure.\n\nEl curiós és que l'efecte no sempre és tan obvi per als qui estan familiaritzats amb la persona que és a l'habitació; per exemple, un matrimoni pot veure menys distorsió de grandària. És el que es coneix com el Fenomen Honi, dit així per una dona que va observar tant a un desconegut com al seu marit i va observar una distorsió de grandària quan es tractava del desconegut, però no quan observava al seu marit!"

 "Clone Table": {
  "d": {
   "en": "Imagine talking to someone who knows you best, understands you completely, never opposes you, appreciates you, and cherishes your existence. Now picture sitting at a table with the most beautiful, intelligent, fascinating, and intriguing person you know. We know that no one fits this description better than - you!\n\nThe Paradox Clone Table exhibit gives you the serene pleasure of being in the company of you, yourself and I. No arguments, debates or misunderstandings. But wait, is this fun or downright boring? Maybe five copies of yourself is a bit too much, but don't worry it's actually not you. What looks like a big round table is a wedge reflecting itself into a full circle with the help of two mirrors placed at a 60-degree angle.\n\nTake a moment to think about how many angles are all around us everyday. We form angles with our lips as we speak, and the hands of a clock create various angles throughout the day. When a clock strikes 2, the angle formed by its hands is 60 degrees.\n\nAccording to some estimates, it would cost around $1.7 million to clone a person, while some scientists claim that clones potentially face serious health problems. This exhibit gives you the opportunity to experience what it would feel like to meet your clones, while saving you a lot of money and discomfort!",
   "es": "Imagínate hablando con alguien que te conoce mejor que nadie, que te entiende perfectamente, que nunca te lleva la contraria, que te aprecia y que valora tu existencia. Ahora imagínate sentado en una mesa con la persona más bella, inteligente, fascinante e intrigante que conoces. Sabemos que nadie encaja mejor en esta descripción que… ¡tú!\n\nLa exposición de la mesa de los clones te ofrece el agradable placer de estar en compañía de ti mismo. Sin discusiones, debates ni malentendidos. Pero espera, ¿es divertido o aburrido? Puede que cinco copias de ti mismo sea demasiado, pero no te preocupes, en realidad no eres tú. Lo que parece una gran mesa redonda es una cuña que se refleja en un círculo completo con la ayuda de dos espejos colocados en un ángulo de 60 grados.\n\nTómate un momento para pensar en la cantidad de ángulos que nos rodean cada día. Formamos ángulos con los labios al hablar y las agujas de un reloj crean varios ángulos a lo largo del día. Cuando un reloj da las 2, el ángulo formado por sus agujas es de 60 grados.\n\nSegún algunas estimaciones, clonar a una persona costaría alrededor de 1,7 millones de dólares y algunos científicos afirman que los clones podrían sufrir graves problemas de salud. Esta exposición te da la oportunidad de experimentar lo que sentirías al conocer a tus clones, ¡ahorrándote mucho dinero y molestias!",
   "ca": "Imagina't parlant amb algú que et coneix millor que ningú, que t'entén perfectament, que mai et porta la contrària, que t'aprecia i que valora la teva existència. Ara imagina't assegut en una taula amb la persona més bella, intel·ligent, fascinant i intrigant que coneixes. Sabem que ningú encaixa millor en aquesta descripció que… tu!\n\nL'exposició de la taula dels clons t'ofereix l'agradable plaer d'estar en companyia de tu mateix. Sense discussions, debats ni malentesos. Però espera, és divertit o avorrit? Pot ser que cinc còpies de tu mateix sigui massa, però no et preocupis, en realitat no ets tu. El que sembla una gran taula rodona és un tascó que es reflecteix en un cercle complet amb l'ajuda de dos miralls col·locats en un angle de 60 graus.\n\nPren-te un moment per a pensar en la quantitat d'angles que ens envolten cada dia. Formem angles amb els llavis en parlar i les agulles d'un rellotge creen diversos angles al llarg del dia. Quan un rellotge dona les 2, l'angle format per les seves agulles és de 60 graus.\n\nSegons algunes estimacions, clonar a una persona costaria al voltant d'1,7 milions de dòlars i alguns científics afirmen que els clons podrien sofrir greus problemes de salut. Aquesta exposició et dona l'oportunitat d'experimentar el que sentiries en conèixer als teus clons, estalviant-te molts diners i molèsties!"
  },

   "es": "Vas a sentarte a comer con cinco personas que te dan toda la razón. Las cinco eres tú.",
   "ca": "T'asseuràs a taula amb cinc persones que et donen tota la raó. Les cinc ets tu.",

 "Face Blender": {
  "d": {
   "en": "Have you ever wondered what you'd look like with your friend's nose? This exhibit gives you a real life opportunity to do just that. If you're visiting the museum with a group of friends, then you can try out a variety of noses too!\n\nYou can always try an online software that allows you to adapt your uploaded photos; using this kind of software makes it fun to see what you and your partner's baby would look like or what would happen when you morph your photo with a celebrity's.\n\nThe Paradox Face Blender exhibit is a real-time morphing moment! Play around with the exhibit to see what funny ways you can make yourself look different. Maybe you'll like it, but maybe you'll also see that your nose actually really suits your own face perfectly!",
   "es": "¿Te has preguntado alguna vez qué aspecto tendrías con la nariz de tu amigo? Esta exhibición te da la oportunidad de hacerlo en la vida real. Si visitas el museo con un grupo de amigos, ¡también puedes probar varias narices!\n\nSiempre puedes probar un programa informático online que te permita adaptar las fotos que subas. Con este tipo de programas es divertido ver qué aspecto tendría tu bebé y el de tu pareja o qué pasaría si combinaras tu foto con la de un famoso.\n\nLa exhibición Paradox Mezcla de Caras es un momento de transformación en tiempo real. Juega con la exhibición para ver de qué formas tan divertidas puedes cambiar tu aspecto. Puede que te guste, pero también puede que veas que tu nariz se adapta perfectamente a tu cara.",
   "ca": "T'has preguntat alguna vegada quin aspecte tindries amb el nas del teu amic? Aquesta exhibició et dona l'oportunitat de fer-ho en la vida real. Si visites el museu amb un grup d'amics, també pots provar diversos nassos!\n\nSempre pots provar un programa informàtic en línia que et permeti adaptar les fotos que pugis. Amb aquesta mena de programes és divertit veure quin aspecte tindria el teu bebè i el de la teva parella o què passaria si combinessis la teva foto amb la d'un famós.\n\nL'exhibició Paradox Mescla de Cares és un moment de transformació en temps real. Juga amb l'exhibició per a veure de quines formes tan divertides pots canviar el teu aspecte. Pot ser que t'agradi, però també pot ser que vegis que el teu nas s'adapta perfectament a la teva cara."

 "Kaleidoscope": {
  "d": {
   "en": "The word Kaleidoscope combines three Greek words: 'kalos' meaning beautiful, 'eidos' meaning shape, and 'skopos' meaning watcher or thing looked at. So kaleidoscope literally means 'beautiful shapes to look at.'\n\nThe first kaleidoscope was invented by Sir David Brewster around 1816. It was mainly sold as a toy for entertainment, but it has also been a creative tool for many designers and artists. The kaleidoscope's design changes endlessly by rotating the section containing the loose fragments; it produces a range of colors and patterns which over the years has inspired people to create several design items like rugs, clothes, stained glass, jewelry, architectural patterns, wallpaper, woven tapestries, and much more!\n\nThe Paradox Kaleidoscope is everyone's favorite toy turned into an exhibit! Instead of colorful papers and pearls, the inspirational patterns are created by the visitors themselves. This freestanding exhibit works on the principle of multiple reflections seen when observing the exhibit. It consists of three equal mirrors set in the shape of a three-sided prism. This triangular prism is a 3D shape with two identical faces in the shape of a triangle connected by three rectangular faces.\n\nInside, the reflection of the objects move and combine with each other in a symmetrical dance forming a constantly changing pattern. We like to think of it as a metaphor for a lovely life that is continuously changing, and continuously challenged to see things from another perspective!",
   "es": "La palabra Caleidoscopio combina tres palabras griegas: 'kalos' que significa bello, 'eidos' que significa forma, y 'skopos' que significa observador o cosa observada. Así que caleidoscopio significa literalmente «formas bellas para mirar».\n\nEl primer caleidoscopio lo inventó Sir David Brewster hacia 1816. Se vendía principalmente como juguete de entretenimiento, pero también ha sido una herramienta creativa para muchos diseñadores y artistas. El diseño del caleidoscopio cambia infinitamente al girar la sección que contiene los fragmentos sueltos; produce una gama de colores y patrones que, a lo largo de los años, ha inspirado a la gente a crear varios artículos de diseño como alfombras, ropa, vidrieras, joyas, patrones arquitectónicos, papel pintado, tapices tejidos, ¡y mucho más!\n\nEl Caleidoscopio Paradox es el juguete favorito de todos convertido en exhibición. En lugar de papeles de colores y perlas, los propios visitantes son los que crean los patrones que sirven de inspiración. Esta exhibición independiente funciona según el principio de los múltiples reflejos que se ven al observarla. Consta de tres espejos iguales colocados en forma de prisma de tres lados. Este prisma triangular es una forma tridimensional con dos caras idénticas en forma de triángulo conectadas por tres caras rectangulares.\n\nEn su interior, los reflejos de los objetos se mueven y combinan entre sí en una danza simétrica formando un patrón que cambia constantemente. Nos gusta pensar que es una metáfora de una vida llena de encanto, en continuo cambio, ¡y que continuamente nos desafía a ver las cosas desde otra perspectiva!",
   "ca": "La paraula Calidoscopi combina tres paraules gregues: 'kalos' que significa bell, 'eidos' que significa forma, i 'skopos' que significa observador o cosa observada. Així que calidoscopi significa literalment «formes belles per a mirar».\n\nEl primer calidoscopi ho va inventar Sir David Brewster cap a 1816. Es venia principalment com a joguina d'entreteniment, però també ha estat una eina creativa per a molts dissenyadors i artistes. El disseny del calidoscopi canvia infinitament en girar la secció que conté els fragments solts; produeix una gamma de colors i patrons que, al llarg dels anys, ha inspirat a la gent a crear diversos articles de disseny com a catifes, roba, vidrieres, joies, patrons arquitectònics, paper pintat, tapissos teixits, i molt més!\n\nEl Calidoscopi Paradox és la joguina favorita de tots convertit en exhibició. En lloc de papers de colors i perles, els propis visitants són els que creen els patrons que serveixen d'inspiració. Aquesta exhibició independent funciona segons el principi dels múltiples reflexos que es veuen en observar-la. Consta de tres miralls iguals col·locats en forma de prisma de tres costats. Aquest prisma triangular és una forma tridimensional amb dues cares idèntiques en forma de triangle connectades per tres cares rectangulars.\n\nEn el seu interior, els reflexos dels objectes es mouen i combinen entre si en una dansa simètrica formant un patró que canvia constantment. Ens agrada pensar que és una metàfora d'una vida plena d'encant, en continu canvi, i que contínuament ens desafia a veure les coses des d'una altra perspectiva!"
  },
  "hook": {
   "es": "Mete la cabeza dentro. La flor simétrica que se forma ahí dentro eres tú.",
   "ca": "Fica-hi el cap. La flor simètrica que es forma allà dins ets tu.",
   "en": "Put your head inside. The symmetrical flower that forms in there is you."

 "Beuchet Chair": {
  "d": {
   "en": "Who would have thought that the perceived size of a person depends on the context suggested by its surrounding objects!? There are numerous theories and tools that attempt to shift people's perceptions or ideas, and the Beuchet Chair is one of them.\n\nThe concept was first introduced by psychologist Jean Beuchet in 1963, providing incredible insight into persuasion methods. This world-famous chair uses two pieces of apparatus to make people appear smaller - an oversized chair seat and four normal sized chair legs. The seat is positioned further away from the legs, but from a particular point, the parts appear as a whole. When someone sits on the seat, the observer automatically assumes they're close, even though they're farther away.\n\nThe Paradox Beuchet's Chair is an experientially fun way to explore the laws of perception and play with the notion of size ratios. Believe it or not, the Beuchet Chair can demystify marketing campaigns, improve brand perception, and even gain support for social campaigns!",
   "es": "¿Quién pensaría que el tamaño que se percibe de una persona depende del contexto sugerido por los objetos que la rodean? Existen numerosas teorías y herramientas que intentan alterar las percepciones o ideas de las personas, y la Silla de Beuchet es una de ellas.\n\nEl concepto fue introducido por primera vez por el psicólogo Jean Beuchet en 1963, aportando una visión increíble de los métodos de persuasión. Esta silla mundialmente famosa utiliza dos aparatos para hacer que las personas parezcan más pequeñas: un asiento de gran tamaño y cuatro patas de tamaño normal. El asiento está situado más lejos de las patas, pero desde un punto determinado, las piezas aparecen como un todo. Cuando alguien se sienta en el asiento, el observador asume automáticamente que está cerca, aunque esté más lejos.\n\nLa Silla de Beuchet es una forma divertida de explorar las leyes de la percepción y jugar con la noción de las proporciones de tamaño. Lo creas o no, la Silla de Beuchet puede desmitificar campañas de marketing, mejorar la percepción de la marca e incluso conseguir apoyo para campañas sociales.",
   "ca": "Qui pensaria que la grandària que es percep d'una persona depèn del context suggerit pels objectes que l'envolten? Existeixen nombroses teories i eines que intenten alterar les percepcions o idees de les persones, i la Cadira de Beuchet és una d'elles.\n\nEl concepte va ser introduït per primera vegada pel psicòleg Jean Beuchet en 1963, aportant una visió increïble dels mètodes de persuasió. Aquesta cadira mundialment famosa utilitza dos aparells per a fer que les persones semblin més petites: un seient de gran grandària i quatre potes de grandària normal. El seient està situat més lluny de les potes, però des d'un punt determinat, les peces apareixen com un tot. Quan algú se senti en el seient, l'observador assumeix automàticament que és a prop, encara que estigui més lluny.\n\nLa Cadira de Beuchet és una forma divertida d'explorar les lleis de la percepció i jugar amb la noció de les proporcions de grandària. Ho creguis o no, la Cadira de Beuchet pot desmitificar campanyes de màrqueting, millorar la percepció de la marca i fins i tot aconseguir suport per a campanyes socials."
  }
 },
 "PDX Sofa": {
  "d": {
   "en": "A glitch in the matrix comes from the movie 'The Matrix' where a 'glitch' drew someone's attention to the fact that they were in a simulation. Glitches are events that can only make sense if we accept the fact that our current reality is a kind of simulation.\n\nReal-life glitches are happening more and more often recently, making us feel like we are inside a movie. These bizarre incidents evoke the feeling that the world is not as we envision it to be. For example, objects vanish and then reappear. Sometimes they are never seen again. Sometimes they reappear in the same location; sometimes they reappear in broad daylight, in a place where they could have been easily seen. Or people are seen by different witnesses at different locations at the same time, or they are not seen at places where they should be. People have even vanished, only to reappear and claim they never left the location. Some reports may be the result of memory errors or the effects of drugs or carbon monoxide poisoning, but multiple witnesses have confirmed the facts of such experiences.\n\nIn the Paradox Sofa exhibit, the visitor hides part of their body in the specially designed holes of a sofa, so the lower part of the visitor is sitting on the right, whereas the torso and head appear to be sitting a meter away. It introduces the visitors to a paradoxical world where they look like a real-world glitch, but the truth is, although the photo will tell everyone otherwise, they are just two people with hidden parts of their bodies.\n\nNo conspiracy theories are involved here, just 'vegging out' mindlessly in safe, sedentary comfort, having fun with 'partners in crime.'",
   "es": "Un error en la matriz proviene de la película «Matrix», en la que un «fallo» llama la atención de alguien sobre el hecho de que se encuentra en una simulación. Los «fallos» son sucesos que solo tienen sentido si aceptamos que nuestra realidad actual es una especie de simulación.\n\nÚltimamente, los fallos en la vida real son cada vez más frecuentes y nos hacen sentir como si estuviéramos dentro de una película. Estos extraños incidentes evocan la sensación de que el mundo no es como lo imaginamos. Por ejemplo, los objetos desaparecen y vuelven a aparecer. A veces no se vuelven a ver. A veces reaparecen en el mismo lugar; a veces reaparecen a plena luz del día, en un lugar donde podrían haber sido vistos fácilmente. O son vistos por diferentes testigos en diferentes lugares al mismo tiempo, o no son vistos en lugares donde deberían estar. Incluso ha habido personas que han desaparecido para reaparecer y afirmar que nunca habían abandonado el lugar. Algunos informes pueden ser el resultado de errores de memoria o de los efectos de drogas o intoxicación por monóxido de carbono, pero múltiples testigos han confirmado los hechos de tales experiencias.\n\nEn la exhibición del Sofá Paradójico, el visitante oculta parte de su cuerpo en los huecos especialmente diseñados de un sofá, de modo que la parte inferior del visitante está sentada a la derecha, mientras que el torso y la cabeza parecen estar sentados a un metro de distancia. Introduce a los visitantes en un mundo paradójico en el que parecen un fallo del mundo real, pero la verdad es que, aunque la foto diga lo contrario a todo el mundo, no son más que dos personas con partes de su cuerpo ocultas.\n\nNo se trata de ninguna teoría conspiratoria, sino simplemente de «vaguear» sin pensar, en una cómoda y segura vida sedentaria, disfrutando junto a tu «compañero de fechorías».",
   "ca": "Un error en la matriu prové de la pel·lícula «Matrix», en la qual una «fallada» crida l'atenció d'algú sobre el fet que es troba en una simulació. Les «fallades» són successos que només tenen sentit si acceptem que la nostra realitat actual és una espècie de simulació.\n\nÚltimament, les fallades a la vida real són cada vegada més freqüents i ens fan sentir com si estiguéssim dins d'una pel·lícula. Aquests estranys incidents evoquen la sensació que el món no és com l'imaginem. Per exemple, els objectes desapareixen i tornen a aparèixer. A vegades no es tornen a veure. A vegades reapareixen en el mateix lloc; a vegades reapareixen a plena llum del dia, en un lloc on podrien haver estat vistos fàcilment. O són vistos per diferents testimonis en diferents llocs al mateix temps, o no són vistos en llocs on haurien d'estar. Fins i tot hi ha hagut persones que han desaparegut per a reaparèixer i afirmar que mai havien abandonat el lloc. Alguns informes poden ser el resultat d'errors de memòria o dels efectes de drogues o intoxicació per monòxid de carboni, però múltiples testimonis han confirmat els fets de tals experiències.\n\nEn l'exhibició del Sofà Paradoxal, el visitant oculta part del seu cos en els buits especialment dissenyats d'un sofà, de manera que la part inferior del visitant està asseguda a la dreta, mentre que el tors i el cap semblen estar asseguts a un metre de distància. Introdueix als visitants en un món paradoxal en el qual semblen una fallada del món real, però la veritat és que, encara que la foto digui el contrari a tothom, no són més que dues persones amb parts del seu cos ocultes.\n\nNo es tracta de cap teoria conspiratòria, sinó simplement de «gandulejar» sense pensar, en una còmoda i segura vida sedentària, gaudint al costat del teu «company de malifetes»."
  },
  "hook": {
   "es": "En la foto vais a parecer un fallo del universo. Sois dos personas escondiendo media pierna.",
   "ca": "A la foto semblareu una fallada de l'univers. Sou dues persones amagant mitja cama.",
   "en": "In the photo you will look like a glitch in the universe. You are two people hiding half a leg."
  }
 },
 "Yes / No Paradox": {
  "d": {
   "en": "Yes! No! Maybe! I don't know! Can you repeat the question? This raises the notion of whether people are decisive or if their decisions are influenced by different perspectives?\n\nPerspective is the appearance of objects with respect to their relative distances and positions; it is how one looks at something. In psychological terms, your perspective is the way you have chosen to see the world. It includes the way you see yourself and those around you. And in this way, even if you think your thoughts about your life and the people you know are 'facts,' they actually aren't.\n\nThe Yes/No Paradox exhibit is an anamorphic sculpture, a distorted projection with opposing textual statements, yes and no. The visual illusion changes when the visitor changes perspective. The body of the sculpture does not change, only how we see it from different perspectives does. According to the angle, attitude, or viewpoint - physical or emotional - it's very easy to trick our brain into seeing the same sculpture differently.",
   "es": "¡Sí! ¡No! ¡Quizás! ¡No lo sé! ¿Puedes repetir la pregunta? Esto plantea la cuestión de si las personas son decisivas o si sus decisiones están influidas por diferentes perspectivas.\n\nLa perspectiva es la apariencia de los objetos con respecto a sus distancias y posiciones relativas; es cómo se mira algo. En términos psicológicos, tu perspectiva es la forma que has elegido de ver el mundo. Incluye la forma en que te ves a ti mismo y a los que te rodean. Y de este modo, aunque creas que tus pensamientos sobre tu vida y la gente que conoces son «hechos», en realidad no lo son.\n\nLa exposición de la paradoja de sí o no es una escultura anamórfica, una proyección distorsionada con afirmaciones textuales opuestas, sí y no. La ilusión visual cambia cuando el visitante cambia de perspectiva. El cuerpo de la escultura no cambia, sino cómo la vemos desde distintas perspectivas. Según el ángulo, la actitud o el punto de vista (físico o emocional), es muy fácil engañar a nuestro cerebro para que vea la misma escultura de forma diferente.",
   "ca": "Sí! No! Potser! No ho sé! Pots repetir la pregunta? Això planteja la qüestió de si les persones són decisives o si les seves decisions estan influïdes per diferents perspectives.\n\nLa perspectiva és l'aparença dels objectes respecte a les seves distàncies i posicions relatives; és com es mira alguna cosa. En termes psicològics, la teva perspectiva és la forma que has triat de veure el món. Inclou la forma en què et veus a tu mateix i als quals t'envolten. I d'aquesta manera, encara que creguis que els teus pensaments sobre la teva vida i la gent que coneixes són «fets», en realitat no ho són.\n\nL'exposició de la paradoxa de sí o no és una escultura anamòrfica, una projecció distorsionada amb afirmacions textuals oposades, sí i no. La il·lusió visual canvia quan el visitant canvia de perspectiva. El cos de l'escultura no canvia, sinó com la veiem des de diferents perspectives. Segons l'angle, l'actitud o el punt de vista (físic o emocional), és molt fàcil enganyar el nostre cervell perquè vegi la mateixa escultura de manera diferent."
  },

 }

 "Ames Room": {
  "d": {
   "fr": "Grandir et rétrécir dans une pièce à la perspective déformée peut rappeler une scène d'Alice au pays des merveilles de Lewis Carroll, ou de la trilogie du Seigneur des Anneaux, où ce procédé sert à faire paraître les hobbits plus petits que les humains. Le principe de la chambre d'Ames a beaucoup servi à la télévision et au cinéma pour montrer des acteurs géants à côté d'acteurs minuscules.\n\nÀ la fin du XIXe siècle, un certain Hermann von Helmholtz eut une grande idée : et si une pièce pouvait être déformée tout en paraissant parfaitement rectangulaire ? En 1935, l'ophtalmologue Adelbert Ames eut une intuition semblable et créa la toute première chambre d'Ames. Il alla plus loin que Helmholtz et fut le premier à découvrir l'influence de l'expérience sur la perception.\n\nLa chambre d'Ames est donc construite avec le sol et le plafond inclinés, ce qui crée une perspective forcée et trompe l'œil en lui faisant croire que les deux côtés de la pièce sont identiques. Sa forme réelle est un trapèze. Cette forme particulière supprime toute notion de distance et empêche d'évaluer correctement la taille des objets. La pièce crée l'illusion d'un écart de taille spectaculaire et fait croire que les deux personnes sont à la même distance alors que l'une est bien plus proche.\n\nDans la chambre d'Ames de Paradox, il se produit un décalage entre les stimuli physiques et la perception de l'individu, dû à une interprétation erronée des informations reçues par les organes sensoriels. Dès que la lumière atteint la rétine, la vision commence : l'information, sous forme de signaux électriques, part par le nerf optique vers les régions du cerveau qui traitent l'image et nous permettent de voir.\n\nLe plus troublant, c'est que l'effet est moins évident pour qui connaît bien la personne présente dans la pièce : un couple marié, par exemple, perçoit moins la déformation. C'est le phénomène Honi, nommé d'après une femme qui observait à la fois un inconnu et son mari et ne voyait la distorsion de taille que sur l'inconnu, jamais sur son mari.",
   "it": "Crescere e rimpicciolirsi in una stanza dalla prospettiva distorta può ricordare una scena di Alice nel Paese delle Meraviglie di Lewis Carroll, o della trilogia del Signore degli Anelli, dove questo trucco serve a far sembrare gli hobbit più piccoli degli umani. Il principio della stanza di Ames è stato usatissimo in televisione e al cinema per mostrare attori giganteschi accanto ad attori minuscoli.\n\nAlla fine dell'Ottocento un signore di nome Hermann von Helmholtz ebbe una grande idea: e se una stanza potesse essere distorta e allo stesso tempo sembrare perfettamente rettangolare? Nel 1935 l'oftalmologo Adelbert Ames ebbe un'intuizione simile e creò la prima stanza di Ames della storia. Andò oltre il concetto di Helmholtz e fu il primo a scoprire l'impatto dell'esperienza sulla percezione.\n\nLa stanza di Ames è costruita con pavimento e soffitto inclinati, il che crea una prospettiva forzata e inganna l'occhio facendogli credere che i due lati della stanza siano uguali. La forma reale è un trapezio. Questa forma particolare elimina ogni senso della distanza e impedisce di valutare correttamente la dimensione degli oggetti. La stanza crea l'illusione di una disparità di taglia clamorosa e porta a credere che le due persone siano alla stessa distanza, mentre una è molto più vicina.\n\nNella stanza di Ames di Paradox si produce un disallineamento tra gli stimoli fisici e la percezione dell'individuo, causato da un'interpretazione scorretta delle informazioni ricevute dagli organi di senso. Nel momento in cui la luce raggiunge la retina inizia il processo della visione: l'informazione, sotto forma di segnali elettrici, viaggia lungo il nervo ottico verso le aree del cervello che elaborano l'immagine e ci permettono di vedere.\n\nLa cosa più curiosa è che l'effetto non è sempre così evidente per chi conosce bene la persona nella stanza: una coppia sposata, per esempio, percepisce meno la distorsione. È il cosiddetto fenomeno Honi, chiamato così da una donna che osservava sia uno sconosciuto sia il marito e notava la distorsione di taglia solo sullo sconosciuto, mai sul marito.",
   "de": "In einem Raum mit verzerrter Perspektive zu wachsen und zu schrumpfen erinnert vielleicht an eine Szene aus Lewis Carrolls Alice im Wunderland oder aus der Herr-der-Ringe-Trilogie, wo dieser Trick die Hobbits kleiner wirken lässt als die Menschen. Das Prinzip des Ames-Raums wurde in Film und Fernsehen viel genutzt, um riesige Schauspieler neben winzigen zu zeigen.\n\nEnde des 19. Jahrhunderts hatte ein Herr namens Hermann von Helmholtz eine großartige Idee: Was wäre, wenn ein Raum verzerrt wäre und zugleich völlig rechtwinklig aussähe? 1935 kam der Augenarzt Adelbert Ames auf einen ähnlichen Gedanken und baute den allerersten Ames-Raum. Er ging über Helmholtz hinaus und entdeckte als Erster, wie stark Erfahrung die Wahrnehmung prägt.\n\nDer Ames-Raum ist also mit geneigtem Boden und geneigter Decke gebaut, was eine erzwungene Perspektive erzeugt und dem Auge vorgaukelt, beide Raumseiten seien gleich. Tatsächlich ist der Grundriss ein Trapez. Diese besondere Form nimmt jedes Gefühl für Entfernung und verhindert, Größen richtig einzuschätzen. Der Raum erzeugt die Illusion eines dramatischen Größenunterschieds und lässt glauben, beide Personen stünden gleich weit entfernt, obwohl eine viel näher ist.\n\nIm Ames-Raum von Paradox entsteht eine Diskrepanz zwischen den physikalischen Reizen und der Wahrnehmung – verursacht durch eine falsche Deutung der Information, die die Sinnesorgane liefern. Sobald Licht auf die Netzhaut trifft, beginnt das Sehen: Die Information wandert als elektrisches Signal über den Sehnerv zu jenen Hirnregionen, die das Bild verarbeiten.\n\nUnheimlich ist, dass der Effekt bei Menschen schwächer ausfällt, die die Person im Raum gut kennen: Ein Ehepaar etwa nimmt die Größenverzerrung weniger stark wahr. Das nennt man den Honi-Effekt, benannt nach einer Frau, die sowohl einen Fremden als auch ihren Mann beobachtete – und die Verzerrung nur beim Fremden sah, nie bei ihrem Mann."

 "Clone Table": {

   "it": "Ti sei mai chiesto che aspetto avresti con il naso del tuo amico? Questa installazione ti dà l'occasione di scoprirlo davvero. E se visiti il museo in gruppo, puoi provare tutta una serie di nasi!\n\nEsistono naturalmente programmi online che permettono di modificare le foto che carichi: spesso servono a immaginare il viso del futuro bambino di una coppia, o il risultato della fusione tra la tua foto e quella di una celebrità.\n\nIl miscelatore di volti di Paradox, invece, funziona in tempo reale. Divertiti a scoprire in quanti modi buffi puoi cambiare aspetto. Forse ti piacerà — o forse scoprirai che il tuo naso sta benissimo dov'è.",

 "Kaleidoscope": {
  "d": {
   "fr": "Le mot kaléidoscope réunit trois mots grecs : « kalos », beau, « eidos », forme, et « skopos », celui qui observe. Kaléidoscope signifie donc littéralement « belles formes à regarder ».\n\nLe premier kaléidoscope fut inventé par Sir David Brewster vers 1816. Vendu surtout comme jouet, il est aussi devenu un outil créatif pour de nombreux artistes et designers. Son motif change à l'infini quand on fait tourner la section contenant les fragments libres ; il produit une gamme de couleurs et de motifs qui a inspiré au fil des ans tapis, vêtements, vitraux, bijoux, motifs architecturaux, papiers peints, tapisseries et bien plus encore.\n\nLe kaléidoscope de Paradox, c'est le jouet préféré de tous devenu installation. À la place des papiers colorés et des perles, ce sont les visiteurs eux-mêmes qui créent les motifs. Cette pièce autoportante repose sur le principe des réflexions multiples. Elle est faite de trois miroirs identiques montés en prisme triangulaire : un volume à deux faces triangulaires identiques reliées par trois faces rectangulaires.\n\nÀ l'intérieur, les reflets des objets se déplacent et se combinent dans une danse symétrique qui forme un motif en perpétuel changement. Nous aimons y voir la métaphore d'une belle vie, toujours en mouvement, qui nous met sans cesse au défi de regarder les choses autrement.",
   "it": "La parola caleidoscopio unisce tre parole greche: «kalos», bello, «eidos», forma, e «skopos», chi osserva. Caleidoscopio significa dunque letteralmente «belle forme da guardare».\n\nIl primo caleidoscopio fu inventato da Sir David Brewster intorno al 1816. Venduto soprattutto come giocattolo, è diventato anche uno strumento creativo per molti artisti e designer. Il suo disegno cambia all'infinito ruotando la sezione che contiene i frammenti liberi; produce una gamma di colori e motivi che negli anni ha ispirato tappeti, vestiti, vetrate, gioielli, motivi architettonici, carte da parati, arazzi e molto altro.\n\nIl caleidoscopio di Paradox è il giocattolo preferito di tutti trasformato in installazione. Al posto di carte colorate e perline, sono i visitatori stessi a creare i motivi. Questa struttura autoportante si basa sul principio delle riflessioni multiple. È fatta di tre specchi uguali montati a prisma triangolare: un solido con due facce triangolari identiche unite da tre facce rettangolari.\n\nAll'interno, i riflessi degli oggetti si muovono e si combinano in una danza simmetrica che forma un motivo in continuo cambiamento. Ci piace vederci la metafora di una bella vita, sempre in movimento, che continuamente ci sfida a guardare le cose da un'altra prospettiva.",
   "de": "Das Wort Kaleidoskop vereint drei griechische Begriffe: „kalos“ – schön, „eidos“ – Form und „skopos“ – der Betrachter. Kaleidoskop heißt also wörtlich „schöne Formen zum Anschauen“.\n\nDas erste Kaleidoskop erfand Sir David Brewster um 1816. Verkauft wurde es vor allem als Spielzeug, doch es wurde auch zum kreativen Werkzeug vieler Gestalterinnen und Künstler. Sein Muster verändert sich endlos, wenn man den Abschnitt mit den losen Teilchen dreht; die entstehenden Farben und Muster haben über die Jahre Teppiche, Kleider, Glasfenster, Schmuck, Bauornamente, Tapeten, Wandteppiche und vieles mehr inspiriert.\n\nDas Kaleidoskop von Paradox ist das Lieblingsspielzeug aller, geworden zum Exponat. Statt bunter Papiere und Perlen erzeugen hier die Besucherinnen und Besucher selbst die Muster. Das frei stehende Objekt beruht auf dem Prinzip mehrfacher Spiegelung und besteht aus drei gleichen Spiegeln in Form eines dreiseitigen Prismas: ein Körper mit zwei identischen dreieckigen Flächen, verbunden durch drei rechteckige.\n\nIm Inneren bewegen sich die Spiegelbilder und verbinden sich in einem symmetrischen Tanz zu einem Muster, das sich unablässig wandelt. Wir sehen darin gern ein Bild für ein schönes Leben: ständig in Bewegung und immer wieder aufgefordert, die Dinge aus einer anderen Perspektive zu sehen."

 "Beuchet Chair": {
  "d": {
   "fr": "Qui aurait cru que la taille perçue d'une personne dépend du contexte suggéré par les objets qui l'entourent ? De nombreuses théories et de nombreux outils cherchent à infléchir nos perceptions, et la chaise de Beuchet en fait partie.\n\nLe concept fut présenté pour la première fois par le psychologue Jean Beuchet en 1963 et offrit un éclairage remarquable sur les méthodes de persuasion. Cette chaise mondialement connue utilise deux éléments pour faire paraître les gens plus petits : une assise surdimensionnée et quatre pieds de taille normale. L'assise est placée bien plus loin que les pieds, mais depuis un point précis, les deux parties semblent n'en former qu'une. Quand quelqu'un s'y assoit, l'observateur suppose automatiquement qu'il est proche, alors qu'il est bien plus loin.\n\nLa chaise de Beuchet de Paradox est une façon ludique d'explorer les lois de la perception et de jouer avec les rapports de taille. Croyez-le ou non, elle peut servir à décrypter des campagnes de marketing, à améliorer la perception d'une marque, voire à soutenir des campagnes sociales !",
   "it": "Chi avrebbe immaginato che la grandezza percepita di una persona dipenda dal contesto suggerito dagli oggetti che la circondano? Esistono molte teorie e molti strumenti che cercano di modificare le nostre percezioni, e la sedia di Beuchet è uno di questi.\n\nIl concetto fu introdotto per la prima volta dallo psicologo Jean Beuchet nel 1963, offrendo uno sguardo straordinario sui metodi di persuasione. Questa sedia famosa in tutto il mondo usa due elementi per far sembrare le persone più piccole: una seduta sovradimensionata e quattro gambe di misura normale. La seduta è collocata molto più lontano delle gambe, ma da un punto preciso le due parti sembrano un unico oggetto. Quando qualcuno vi si siede, l'osservatore dà automaticamente per scontato che sia vicino, mentre è molto più distante.\n\nLa sedia di Beuchet di Paradox è un modo divertente di esplorare le leggi della percezione e giocare con i rapporti di grandezza. Che tu ci creda o no, può aiutare a smontare campagne di marketing, a migliorare la percezione di un marchio e perfino a sostenere campagne sociali!",
   "de": "Wer hätte gedacht, dass die wahrgenommene Größe eines Menschen davon abhängt, welchen Zusammenhang die Dinge ringsum nahelegen? Es gibt zahlreiche Theorien und Werkzeuge, die unsere Wahrnehmung verschieben wollen – der Beuchet-Stuhl ist eines davon.\n\nVorgestellt wurde das Konzept erstmals 1963 vom Psychologen Jean Beuchet, mit bemerkenswerten Einsichten über Methoden der Überzeugung. Dieser weltbekannte Stuhl nutzt zwei Bauteile, um Menschen kleiner erscheinen zu lassen: eine übergroße Sitzfläche und vier Beine in normaler Größe. Die Sitzfläche steht viel weiter entfernt als die Beine, doch von einem bestimmten Punkt aus fügen sich beide Teile zu einem Ganzen. Setzt sich jemand darauf, nimmt der Betrachter automatisch an, die Person sei nah – obwohl sie viel weiter weg ist.\n\nDer Beuchet-Stuhl von Paradox ist eine vergnügliche Art, die Gesetze der Wahrnehmung zu erkunden und mit Größenverhältnissen zu spielen. Ob du es glaubst oder nicht: Er kann helfen, Werbekampagnen zu entzaubern, die Markenwahrnehmung zu verbessern und sogar soziale Anliegen zu unterstützen!"
  }
 },
 "PDX Sofa": {
  "d": {
   "fr": "Le « bug dans la matrice » vient du film Matrix, où un bug attire l'attention d'un personnage sur le fait qu'il se trouve dans une simulation. Les bugs sont des événements qui n'ont de sens que si l'on accepte l'idée que notre réalité est une sorte de simulation.\n\nCes bugs du réel semblent de plus en plus fréquents et nous donnent l'impression d'être dans un film. Ces incidents étranges font naître le sentiment que le monde n'est pas tel que nous l'imaginons. Des objets disparaissent puis réapparaissent ; parfois on ne les revoit jamais ; parfois ils réapparaissent au même endroit, ou en plein jour, là où on les aurait forcément vus. Des personnes sont aperçues par différents témoins à des endroits différents au même moment, ou manquent là où elles devraient être. Certaines ont même disparu avant de réapparaître en affirmant n'avoir jamais quitté les lieux. Certains récits s'expliquent par des erreurs de mémoire ou par l'effet de substances ou d'une intoxication au monoxyde de carbone, mais plusieurs témoins ont confirmé la réalité de telles expériences.\n\nDans le canapé Paradox, le visiteur cache une partie de son corps dans les ouvertures prévues : le bas du corps est assis à droite, tandis que le torse et la tête semblent assis un mètre plus loin. Cela plonge les visiteurs dans un monde paradoxal où ils ressemblent à un bug du réel ; en vérité, malgré ce que dira la photo, ce ne sont que deux personnes dont une partie du corps est cachée.\n\nAucune théorie du complot là-dedans : juste le plaisir de paresser tranquillement, confortablement installé, en s'amusant avec ses complices.",
   "it": "Il «bug nella matrice» viene dal film Matrix, dove un errore fa notare a un personaggio di trovarsi dentro una simulazione. I bug sono eventi che hanno senso solo se accettiamo l'idea che la nostra realtà sia una specie di simulazione.\n\nQuesti errori della vita reale sembrano sempre più frequenti e ci fanno sentire dentro un film. Questi episodi bizzarri fanno nascere la sensazione che il mondo non sia come lo immaginiamo. Oggetti spariscono e poi riappaiono; a volte non si rivedono più; a volte riappaiono nello stesso posto, o in pieno giorno, dove sarebbero stati visibilissimi. Alcune persone vengono viste da testimoni diversi in luoghi diversi nello stesso momento, oppure mancano dove dovrebbero essere. Qualcuno è perfino scomparso per poi riapparire sostenendo di non essersi mai allontanato. Alcuni racconti si spiegano con errori di memoria o con l'effetto di sostanze o di un'intossicazione da monossido di carbonio, ma più testimoni hanno confermato la realtà di simili esperienze.\n\nNel divano Paradox il visitatore nasconde parte del corpo nei fori appositi: la parte inferiore è seduta a destra, mentre busto e testa sembrano seduti un metro più in là. Il risultato è un mondo paradossale in cui si somiglia a un errore del reale; in verità, qualunque cosa dica la foto, sono solo due persone con parti del corpo nascoste.\n\nNessuna teoria del complotto: solo il piacere di poltrire tranquillamente, comodi e sedentari, divertendosi con i propri complici.",
   "de": "Der „Fehler in der Matrix“ stammt aus dem Film Matrix, wo ein Glitch jemanden darauf aufmerksam macht, dass er sich in einer Simulation befindet. Glitches sind Ereignisse, die nur Sinn ergeben, wenn man annimmt, dass unsere Wirklichkeit eine Art Simulation ist.\n\nSolche Glitches im echten Leben häufen sich scheinbar und lassen uns fühlen, als steckten wir in einem Film. Diese seltsamen Vorfälle wecken das Gefühl, die Welt sei nicht so, wie wir sie uns vorstellen. Gegenstände verschwinden und tauchen wieder auf; manche nie mehr; manche am selben Ort, manche am helllichten Tag dort, wo man sie längst hätte sehen müssen. Menschen werden von verschiedenen Zeuginnen gleichzeitig an verschiedenen Orten gesehen oder fehlen dort, wo sie sein müssten. Manche verschwanden sogar und behaupteten danach, den Ort nie verlassen zu haben. Manches lässt sich mit Erinnerungsfehlern, Drogenwirkung oder einer Kohlenmonoxidvergiftung erklären, doch mehrere Zeugen haben solche Erlebnisse bestätigt.\n\nAuf dem Paradox-Sofa versteckt die Besucherin einen Teil ihres Körpers in den eigens gestalteten Öffnungen: Der Unterkörper sitzt rechts, Oberkörper und Kopf scheinen einen Meter weiter zu sitzen. So entsteht eine paradoxe Welt, in der man wie ein Fehler der Wirklichkeit aussieht – in Wahrheit sind es, was das Foto auch behauptet, nur zwei Personen mit verborgenen Körperteilen.\n\nKeine Verschwörungstheorie weit und breit: einfach nur gemütliches Nichtstun in sicherer, bequemer Trägheit – mit den richtigen Komplizen."
  }
 },
 "Yes / No Paradox": {
  "d": {
   "fr": "Oui ! Non ! Peut-être ! Je ne sais pas ! Pouvez-vous répéter la question ? Tout cela pose la question de savoir si les gens sont vraiment décidés, ou si leurs décisions dépendent du point de vue adopté.\n\nLa perspective, c'est la façon dont les objets apparaissent selon leurs distances et leurs positions relatives ; c'est la manière de regarder quelque chose. En termes psychologiques, votre perspective est la façon dont vous avez choisi de voir le monde. Elle inclut la façon dont vous vous voyez et dont vous voyez les autres. Ainsi, même si vous croyez que vos pensées sur votre vie et sur vos proches sont des « faits », elles n'en sont pas.\n\nLe paradoxe Oui/Non est une sculpture anamorphique, une projection déformée portant deux affirmations opposées, oui et non. L'illusion visuelle change quand le visiteur change de point de vue. Le corps de la sculpture ne change pas, seule change la façon dont nous la voyons. Selon l'angle, l'attitude ou le point de vue — physique ou émotionnel — il est très facile de tromper notre cerveau et de lui faire voir la même sculpture autrement.",
   "it": "Sì! No! Forse! Non lo so! Puoi ripetere la domanda? Tutto questo solleva la questione se le persone siano davvero decise, oppure se le loro decisioni dipendano dal punto di vista adottato.\n\nLa prospettiva è il modo in cui gli oggetti appaiono in base alle loro distanze e posizioni relative; è il modo in cui si guarda qualcosa. In termini psicologici, la tua prospettiva è il modo in cui hai scelto di vedere il mondo. Comprende come vedi te stesso e chi ti sta intorno. E così, anche se credi che i tuoi pensieri sulla tua vita e sulle persone che conosci siano «fatti», in realtà non lo sono.\n\nIl paradosso Sì/No è una scultura anamorfica, una proiezione distorta con due affermazioni opposte, sì e no. L'illusione visiva cambia quando il visitatore cambia prospettiva. Il corpo della scultura non cambia: cambia solo il modo in cui la vediamo. A seconda dell'angolo, dell'atteggiamento o del punto di vista — fisico o emotivo — è facilissimo ingannare il cervello e fargli vedere la stessa scultura in modo diverso.",
   "de": "Ja! Nein! Vielleicht! Ich weiß nicht! Kannst du die Frage wiederholen? All das wirft die Frage auf, ob Menschen wirklich entschlossen sind – oder ob ihre Entscheidungen vom eingenommenen Blickwinkel abhängen.\n\nPerspektive ist die Art, wie Dinge je nach Entfernung und Lage zueinander erscheinen; sie ist die Art, wie man etwas betrachtet. Psychologisch gesprochen ist deine Perspektive die Weise, wie du die Welt zu sehen gewählt hast. Dazu gehört, wie du dich selbst siehst und wie du andere siehst. Und so sind deine Gedanken über dein Leben und die Menschen um dich herum eben keine „Tatsachen“, auch wenn sie sich so anfühlen.\n\nDas Ja/Nein-Paradox ist eine anamorphe Skulptur, eine verzerrte Projektion mit zwei gegensätzlichen Aussagen: ja und nein. Die optische Täuschung verändert sich, sobald die Betrachterin die Perspektive wechselt. Der Körper der Skulptur bleibt gleich – nur unsere Sicht darauf ändert sich. Je nach Winkel, Haltung oder Standpunkt, körperlich wie gefühlsmäßig, lässt sich das Gehirn mühelos dazu bringen, dieselbe Skulptur ganz anders zu sehen."
  }
 },

     ${Array.from({length:9},(_,i)=>`<rect x="${(23+i*8.6).toFixed(1)}" y="27" width="2.8" height="36" fill="${c}"/>`).join("")}`;
   case "kaleido": return Array.from({length:6},(_,i)=>{

let drawStyle="bloque";
let htSeq=0;
function art(kind,c,style){
  const st=style||drawStyle;
  let s=shapes(kind,c), defs="";
  if(st==="linea"){
    s=s.replace(/fill="(?!none)[^"]*"/g,`fill="none" stroke="${c}" stroke-width="2.2"`);
  }else if(st==="duo"){
    const id="ht"+(++htSeq);
    defs=`<defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="${c}"/><circle cx="2.5" cy="2.5" r="1.75" fill="${BG}"/>
      </pattern></defs>`;
    let flip=false;
    s=s.replace(/fill="(?!none)[^"]*"/g,()=>{flip=!flip;
      return flip?`fill="url(#${id})"`:`fill="${c}"`;});
  }
  return `<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg" role="img">${defs}<rect width="120" height="90" fill="${BG}"/>${s}</svg>`;
}

        <form class="cjform" id="cjForm" autocomplete="off">
          <input id="cjIn" type="text" inputmode="latin" maxlength="6"
                 placeholder="${T.ph}" aria-label="${T.ph}" spellcheck="false">
          <button type="submit">${T.val}</button>
        </form>
        <div class="cjmsg" id="cjMsg" hidden></div>`}

      <div class="cjgrid">
        ${CAST_JUEGO.map(p => {
          const on = hall.has(p.id);
          return `<div class="cjcard${on ? " on" : ""}" data-id="${p.id}">
            <span class="cjph"><img src="${p.img}" alt="" loading="lazy" decoding="async"></span>
            <b>${on ? esc(tr(p.n)) : T.pend}</b>
            ${on ? `<span class="cjtick">✓</span>` : ""}
          </div>`; }).join("")}
      </div>
      <div style="height:22px"></div>
    </div>`;

  const f = el("cjForm");
  if(f) f.onsubmit = ev => {
    ev.preventDefault();
    const T = CAST_T[lang] || CAST_T.es;
    const v = (el("cjIn").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const p = CAST_JUEGO.find(x => x.c === v);
    const msg = el("cjMsg");
    if(!p){ msg.hidden = false; msg.className = "cjmsg mal"; msg.textContent = T.mal;
            el("cjIn").value = ""; return; }
    const hall = castHallados();
    if(hall.has(p.id)){ msg.hidden = false; msg.className = "cjmsg"; msg.textContent = T.rep;
                        el("cjIn").value = ""; return; }
    hall.add(p.id); store.set("cast", [...hall]);
    renderJuegoCast();
    const nuevo = document.querySelector(`.cjcard[data-id="${p.id}"]`);
    if(nuevo){ nuevo.classList.add("recien");
               nuevo.scrollIntoView({block:"center", behavior:"smooth"}); }
    const m2 = el("cjMsg");
    if(m2){ m2.hidden = false; m2.className = "cjmsg bien"; m2.textContent = T.ok + " " + tr(p.n); }
  };
  const r = el("cjReset");
  if(r) r.onclick = () => { store.set("cast", []); renderJuegoCast(); };
}

function renderCast(){
  const c = campana(), U = CAST_UI[lang] || CAST_UI.es;
  const fecha = c.desde.split("-").reverse().join("/");
  if(c.juego === "castaween") return renderJuegoCast();
  if(!c.url){
    el("main").innerHTML = `
      <div class="castpane">
        <div class="casthero">
          <span class="castkick">${esc(tr(c.k))}</span>
          <h2>${esc(tr(c.n)).toUpperCase()}</h2>
          <p class="castlead">${U.pronto}<br>
            <span class="castwhen">${U.desde} ${fecha}</span></p>
        </div>
      </div>`;
    return;
  }
  /* El juego ocupa la pantalla entera, sin cabecera por encima.
     El botón de rescate queda arriba a la derecha por si el juego
     no se deja incrustar y el recuadro sale en blanco. */
  el("main").innerHTML = `
    <div class="castfull">
      <iframe src="${c.url}" title="${esc(tr(c.t))}"
        allow="clipboard-write; camera; geolocation"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
      <a class="castesc" href="${c.url}" target="_blank" rel="noopener"
         title="${U.fuera}" aria-label="${U.fuera}">↗</a>
    </div>`;
}

function render(){
  el("tabRoute").textContent=L().route;
  el("tabRooms").textContent=L().rooms;
  el("tabCast").textContent=tr(campana().n).toUpperCase();
  el("backTxt").textContent=L().route;
  el("main").classList.toggle("castmode", tab==="cast" && !!campana().url);
  tab==="route"?renderRoute():tab==="rooms"?renderRooms():renderCast();
}

/* La tarjeta de bienvenida no abre ficha: deja al visitante dentro
   de la primera sala del recorrido. */
function vamosALaPrimeraSala(){
  const i = S.findIndex(x => x.r !== "entrada");
  if(i < 0) return;
  const cab = [...document.querySelectorAll(".sechead")][1] ||
              document.querySelector(`.stop[data-i="${i}"]`);
  cab && cab.scrollIntoView({block:"start", behavior:"smooth"});
}

function openStop(i){
  idx=Math.max(0,Math.min(S.length-1,i));
  const s=S[idx], R=rm(s), last=idx===S.length-1;
  el("dcount").textContent=`${idx+1} ${L().of} ${S.length}`;

  const how = s.how
    ? `<div class="howrow">${s.how.map((x,k)=>`
        <div class="howcard">
          <div class="ph"><span class="howstep">${k+1}</span>
            ${x.img?`<img src="${x.img}" alt="" loading="lazy" decoding="async">`:photoSlot()}
            <em>${L().photoPend}</em></div>
          <b>${esc(tr(x.t))}</b><span>${esc(tr(x.s))}</span>
        </div>`).join("")}</div>`
    : (s.todo ? "" : `<div class="pending">${L().pendHow}</div>`);

  el("dbody").innerHTML=`
    <div class="hero">
      ${s.img?`<img src="${s.img}" alt="" loading="lazy" decoding="async">`:art(s.art,R.tc)}
      <span class="tag lbl">${s.img?"":L().photo}</span></div>

    <div class="dtext">
      <span class="droom lbl" style="background:${R.c};color:${R.ink}">${tr(R.n)}</span>
      <h1>${s.n?`<span class="hn">${s.n}</span>`:""}${esc(s.t)}</h1>
      ${s.sub?`<p class="sub">${esc(tr(s.sub))}</p>`:""}
    </div>

    ${s.cam?`<div class="camwrap">
      <button class="camcta" id="camGo" type="button">◉ ${L().camOpen}</button>
      <span class="hint">${L().camAsk}</span></div>`:""}

    <div class="block"><div class="lbl">${L().lblHook}</div>
      ${s.hook?`<p class="hook">${esc(tr(s.hook))}</p>`
              :`<div class="pending">${L().pendHook}</div>`}</div>

    ${s.d?`<div class="block"><div class="lbl">${L().lblInfo}</div>
      ${tr(s.d).split("\n\n").map(p=>`<p class="lead">${esc(p)}</p>`).join("")}</div>`:""}

    ${s.list?`<div class="block"><div class="lbl">${L().lblIncl}</div>
      <div class="chips">${s.list.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`:""}

    ${s.fotos&&s.fotos.length?`<div class="block"><div class="lbl">${L().lblFotos}</div>
      <div class="gal">${s.fotos.map(f=>`<img src="${f}" alt="" loading="lazy" decoding="async">`).join("")}</div>
      </div>`:""}

    ${(s.r==="entrada"||s.r==="salida")&&!s.how&&!s.todo?"":`
    <div class="block"><div class="lbl">${L().lblHow}</div>
      ${s.todo?`<p class="lead">${esc(tr(s.todo))}</p>`:""}
      ${(s.todo&&s.how)?`<div style="height:14px"></div>`:""}
      ${s.how?how:(s.todo?"":how)}</div>`}

    ${s.quiz?`<div class="block"><div class="quiz">
        <div class="lbl">${L().lblQuiz}</div>
        <p>${esc(tr(s.quiz.q))}</p>
        <button class="reveal" id="reveal">${L().reveal}</button>
        <p class="ans" id="ans" hidden>${tr(s.quiz.a)}</p>
      </div></div>`:""}

    ${s.r==="salida"?`<div class="block"><div class="revbox">
        <span class="lbl">${L().revKick}</span>
        <h3>${L().revTitle}</h3>
        <p>${L().revSub}</p>
        <div class="stars" id="revStars">${[1,2,3,4,5].map(n=>
          `<button type="button" data-n="${n}" aria-label="${n}">★</button>`).join("")}</div>
        <a class="revcta" id="revCta" href="${GOOGLE_REVIEW}"
           target="_blank" rel="noopener">${L().revCta} →</a>
      </div></div>`:""}

    <div style="height:30px"></div>`;

  el("dbody").scrollTop=0;
  el("prev").disabled = idx===0;
  el("next").disabled = last;
  el("nextTxt").textContent = last ? L().end : L().next;
  syncDone();
  el("detail").classList.add("open");
  el("detail").setAttribute("aria-hidden","false");
  const rv=el("reveal");
  if(rv) rv.onclick=()=>{el("ans").hidden=false; rv.hidden=true;};
  const cg=el("camGo");
  if(cg) cg.onclick=()=>abreCamara(s);
  const rs=el("revStars");
  if(rs) rs.addEventListener("click", ev=>{
    const b=ev.target.closest("button"); if(!b) return;
    const n=+b.dataset.n;
    [...rs.children].forEach(x=>x.classList.toggle("on", +x.dataset.n<=n));
    /* Google no deja escribir la reseña dentro de otra web, así que
       se abre su cuadro de reseña ya en la ficha del museo. */
    setTimeout(()=>window.open(GOOGLE_REVIEW,"_blank","noopener"), 260);
  });
}
function syncDone(){
  const on=seen.has(idx), b=el("done");
  b.textContent = on ? L().undone : L().done;
  b.dataset.on = on?"1":"0";
}
function closeStop(){
  el("detail").classList.remove("open");
  el("detail").setAttribute("aria-hidden","true");
  render();
}

/* ── events ─────────────────────────────────────────────────── */
el("main").addEventListener("click",e=>{
  const bv=e.target.closest(".stop.bienvenida");
  if(bv) return vamosALaPrimeraSala();
  const st=e.target.closest(".stop"); if(st) return openStop(+st.dataset.i);
  const sy=e.target.closest("[data-style]");
  if(sy){ drawStyle=sy.dataset.style; store.set("style",drawStyle); render(); return; }
  const rc=e.target.closest(".roomcard");
  if(rc){
    tab="route";
    document.querySelectorAll(".tabs button").forEach(c=>
      c.setAttribute("aria-selected",String(c.dataset.tab==="route")));
    render();
    const first=S.findIndex(s=>s.r===rc.dataset.room);
    requestAnimationFrame(()=>{
      const n=document.querySelector(`.stop[data-i="${first}"]`);
      n&&n.scrollIntoView({block:"center",behavior:"smooth"});});
    return;
  }
  if(e.target.id==="reset"){ seen=new Set(); store.set("seen",[]); render(); }
});

document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  tab=b.dataset.tab;
  [...e.currentTarget.children].forEach(c=>c.setAttribute("aria-selected",String(c===b)));
  el("main").scrollTop=0; render();
});

function setLang(l){
  lang=LANGS.includes(l)?l:"en"; store.set("lang",lang);
  document.documentElement.lang=lang;
  pintaIdiomas();
  render();
  if(el("detail").classList.contains("open")) openStop(idx);
}
function pintaIdiomas(){
  el("langflag").innerHTML=FLAGS[lang];
  el("langcode").textContent=lang.toUpperCase();
  el("langmenu").innerHTML=LANGS.map(l=>
    `<button data-l="${l}" role="menuitem" aria-current="${l===lang}">
       <span class="fl">${FLAGS[l]}</span>${NOMBRES[l]}</button>`).join("");
  el("gateopts").innerHTML=LANGS.map(l=>
    `<button data-l="${l}"><span class="fl">${FLAGS[l]}</span>${NOMBRES[l]}
       <u>${l.toUpperCase()}</u></button>`).join("");
}
el("langbtn").onclick=()=>{
  const m=el("langmenu"); m.hidden=!m.hidden;
  el("langbtn").setAttribute("aria-expanded", String(!m.hidden));
};
el("langmenu").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  setLang(b.dataset.l); el("langmenu").hidden=true;
  el("langbtn").setAttribute("aria-expanded","false");
});
addEventListener("click",e=>{
  if(!el("langmenu").hidden && !e.target.closest("#langmenu,#langbtn")){
    el("langmenu").hidden=true; el("langbtn").setAttribute("aria-expanded","false"); }
});
el("gate").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  setLang(b.dataset.l); store.set("gate",1); el("gate").classList.add("hide");
});

el("back").onclick=closeStop;
el("prev").onclick=()=>openStop(idx-1);
el("next").onclick=()=>{ if(idx<S.length-1) openStop(idx+1); };
el("done").onclick=()=>{
  seen.has(idx)?seen.delete(idx):seen.add(idx);
  store.set("seen",[...seen]); syncDone();
};
addEventListener("keydown",e=>{
  if(!el("detail").classList.contains("open")) return;
  if(e.key==="ArrowRight"&&idx<S.length-1) openStop(idx+1);
  if(e.key==="ArrowLeft"&&idx>0) openStop(idx-1);
  if(e.key==="Escape") closeStop();
});

/* ── visor de fotos ─────────────────────────────────────────── */
(function(){
  let fotos=[], n=0;
  const box=el("lightbox"), img=el("lbImg"), cuenta=el("lbCount");
  function pinta(){
    img.src=fotos[n];
    cuenta.textContent = fotos.length>1 ? (n+1)+" / "+fotos.length : "";
    el("lbPrev").disabled = n===0;
    el("lbNext").disabled = n===fotos.length-1;
    el("lbPrev").hidden = el("lbNext").hidden = fotos.length<2;
  }
  function abre(lista, i){ fotos=lista; n=i; pinta(); box.hidden=false; }
  function cierra(){ box.hidden=true; img.removeAttribute("src"); }

  el("dbody").addEventListener("click", e=>{
    const t=e.target.closest(".hero, .gal img, .howcard .ph");
    if(!t) return;
    const todas=[...el("dbody").querySelectorAll(".hero img, .gal img, .howcard .ph img")]
      .map(i=>i.getAttribute("src")).filter(Boolean);
    const esta=(t.tagName==="IMG"?t:t.querySelector("img"));
    const url=esta&&esta.getAttribute("src");
    if(!url) return;
    abre(todas, Math.max(0, todas.indexOf(url)));
  });

  el("lbClose").onclick=cierra;
  el("lbPrev").onclick=()=>{ if(n>0){n--;pinta();} };
  el("lbNext").onclick=()=>{ if(n<fotos.length-1){n++;pinta();} };
  box.addEventListener("click", e=>{ if(e.target===box||e.target===img) cierra(); });
  addEventListener("keydown", e=>{
    if(box.hidden) return;
    if(e.key==="Escape") cierra();
    if(e.key==="ArrowRight"&&n<fotos.length-1){n++;pinta();}
    if(e.key==="ArrowLeft"&&n>0){n--;pinta();}
  }, true);
})();

/* ── cámara integrada ───────────────────────────────────────────
   Abre la cámara del móvil dentro de la guía, con el consejo de la
   exhibición siempre a la vista, y gira la foto sola donde toca. */
let abreCamara = () => {};
(function(){
  const box=el("cam"), vid=el("camVid"), img=el("camImg"),
        guide=el("camGuide"), bar=el("camBar"), err=el("camErr");
  let stream=null, facing="environment", act=null, blob=null;

  const barraDisparo = () => {
    bar.innerHTML =
      `<button class="shutter" id="camShot" type="button" aria-label="${L().camShot}"></button>`;
    el("camShot").onclick = dispara;
  };
  const barraRevision = () => {
    bar.innerHTML = `<div class="after">
      <button class="redo" id="camRedo" type="button">${L().camAgain}</button>
      <button class="keep" id="camKeep" type="button">${L().camSave}</button></div>`;
    el("camRedo").onclick = () => { img.hidden=true; vid.hidden=false; guide.hidden=false;
                                    blob=null; barraDisparo(); };
    el("camKeep").onclick = guarda;
  };

  async function arranca(){
    para();
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1920}},
        audio:false});
      vid.srcObject = stream;
      vid.classList.toggle("flip", facing==="user");
      err.hidden = true; vid.hidden = false;
      el("camFlip").hidden = false;
    }catch(e){
      err.querySelector("p").textContent = L().camDeny;
      err.hidden = false; vid.hidden = true; bar.innerHTML = "";
      el("camFlip").hidden = true;
    }
  }
  function para(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

  function dispara(){
    if(!stream) return;
    const w = vid.videoWidth, h = vid.videoHeight;
    if(!w || !h) return;
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const g = cv.getContext("2d");
    const girar = act && act.cam && act.cam.rot === 180;
    g.save();
    if(girar){ g.translate(w, h); g.rotate(Math.PI); }
    if(facing === "user"){ g.translate(girar?-w:w, 0); g.scale(-1, 1); }
    g.drawImage(vid, 0, 0, w, h);
    g.restore();
    cv.toBlob(b => {
      blob = b;
      img.src = URL.createObjectURL(b);
      img.hidden = false; vid.hidden = true; guide.hidden = true;
      barraRevision();
    }, "image/jpeg", 0.92);
  }

  async function guarda(){
    if(!blob) return;
    const nombre = "paradox-" + (act && act.n ? act.n + "-" : "") + Date.now() + ".jpg";
    const f = new File([blob], nombre, {type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f]}); return; }catch(e){ if(e && e.name==="AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function cierra(){
    para(); box.hidden = true; blob = null;
    img.hidden = true; img.removeAttribute("src"); vid.hidden = false;
  }

  el("camClose").onclick = cierra;
  el("camFlip").onclick = () => { facing = facing==="environment" ? "user" : "environment"; arranca(); };
  addEventListener("keydown", e => { if(!box.hidden && e.key==="Escape") cierra(); }, true);

  abreCamara = function(s){
    act = s;
    el("camTitle").textContent = s.t;
    guide.hidden = false;
    guide.innerHTML = (s.cam && s.cam.rot===180 ? `<span class="rot">↻ ${L().camRot}</span>` : "")
      + `<p>${esc(tr(s.cam && s.cam.g ? s.cam.g : s.hook))}</p>`;
    box.hidden = false;
    barraDisparo();
    arranca();
  };
})();

/* Al cambiar el orden del recorrido, las marcas de "visto" guardadas
   apuntarían a otra parada: se descartan una sola vez. */
if(store.get("orden",0)!==2){ store.set("seen",[]); store.set("orden",2); }

seen=new Set(store.get("seen",[]));
drawStyle=store.get("style","bloque");
const sl=store.get("lang",null);
if(sl && LANGS.includes(sl) && store.get("gate",0)){
  lang=sl; el("gate").classList.add("hide");
}else if(!sl){
  const nav=(navigator.languages||[navigator.language||"es"]).map(x=>String(x).slice(0,2));
  const hit=nav.find(x=>LANGS.includes(x));
  if(hit) lang=hit;            // preselecciona el idioma del móvil
}
document.documentElement.lang=lang;
pintaIdiomas();
render();
</script>

<script>
/* Caché para el sótano y para quien repita visita. */
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* La barra del navegador se tiñe: azul en la bienvenida, negra dentro de la guía. */
(function () {
  var meta = document.getElementById("themeColor"), gate = document.getElementById("gate");
  if (!meta || !gate) return;
  var sync = function () {
    meta.setAttribute("content", "#3737FF");
  };
  try { new MutationObserver(sync).observe(gate, {attributes: true, attributeFilter: ["class"]}); }
  catch (_) {}
  sync();
})();

/* "Añadir a pantalla de inicio": sólo se ofrece a partir de la segunda visita,
   para no molestar a quien entra una vez y se va. */
(function () {
  var KEY = "pdx2:visitas", prompt = null;
  var n = 0;
  try { n = parseInt(localStorage.getItem(KEY) || "0", 10) + 1; localStorage.setItem(KEY, n); } catch (_) {}
  addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); prompt = e;
    if (n < 2) return;
    var bar = document.createElement("button");
    bar.textContent = "Instalar la guía como app";
    bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:60;border:0;" +
      "background:#FFDB00;color:#000;font:700 14px/1 'Plus Jakarta Sans',system-ui,sans-serif;" +
      "padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer";
    bar.onclick = function () { bar.remove(); prompt.prompt(); prompt = null; };
    document.body.appendChild(bar);
    setTimeout(function () { bar.remove(); }, 12000);
  });
})();
</script>
